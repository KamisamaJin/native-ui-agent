name: runner-and-evidence
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r native-ui-agent/scripts/requirements.txt
      - run: python -B -m unittest discover -s native-ui-agent/tests -v
      - run: python validation/feature-development/verify_evidence.py
      - run: python validation/blind-comparison/verify_evidence.py
      - run: python validation/observer-probes/verify_preflight.py
      - run: python validation/fresh-blind/verify_evidence.py
