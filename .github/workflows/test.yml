name: runner-and-evidence
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Free unused hosted SDK disk for immutable native evidence
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r native-ui-agent/scripts/requirements.txt "Pillow==11.3.0"
      - name: Verify released v13 and exact common-floor control source identities
        run: python3 -B validation/pooled-forward/verify_sources.py
      - run: python -B -m unittest discover -s native-ui-agent/tests -v
      - name: Publication source binding and lossless restore controls
        run: |
          python3 -B -m unittest discover -s validation/pooled-forward/publication-resolver -p 'test_resolver.py'
          python3 -B -m unittest discover -s validation/pooled-forward/publication-tools -p 'test_archive.py'
          python3 -B -m unittest discover -s validation/pooled-forward/publication-quality -p 'test_integrity.py'
          python3 -B validation/pooled-forward/publication-audit-v2/test_audit.py
      - name: Qualify current Linux runtime against frozen v13 mechanisms and golden evidence
        run: bash validation/pooled-forward/publication-runtime-admission/ci-python311-v2.sh
      - name: Verify bounded CI replay disposal, including Git checkout permissions
        run: python3 -B validation/pooled-forward/publication-replay-cleanup/test_cleanup_v3.py --run-dir "$GITHUB_WORKSPACE/validation/pooled-forward/publication-replay-cleanup/HOST-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Replay sealed v13 native provenance, independent barriers and five-case metrics
        run: |
          read -r publication_sha < validation/pooled-forward/PUBLICATION.sha256
          python3 -B validation/pooled-forward/verify_publication.py --manifest-sha256 "$publication_sha" --output "$RUNNER_TEMP/pooled-v13-replay"
      - name: Dispose verified temporary replay payloads before historical checks
        run: python3 -B validation/pooled-forward/publication-replay-cleanup/cleanup_v2.py --replay "$RUNNER_TEMP/pooled-v13-replay"
      - name: Retain compact v13 replay receipts and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pooled-v13-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pooled-v13-replay/ENTRY.json
            ${{ runner.temp }}/pooled-v13-replay/RESULT.json
            ${{ runner.temp }}/pooled-v13-replay/FAILURE.json
            ${{ runner.temp }}/pooled-v13-replay/RECORDED-PROVENANCE.json
            ${{ runner.temp }}/pooled-v13-replay/METRIC-REPLAY.json
            ${{ runner.temp }}/pooled-v13-replay/CLEANUP.json
            ${{ runner.temp }}/pooled-v13-replay/CLEANUP-FAILED.json
            ${{ runner.temp }}/pooled-v13-replay/CLEANUP-INTENT.json
            ${{ runner.temp }}/pooled-v13-replay/CLEANUP-INVENTORY.json
            ${{ github.workspace }}/validation/pooled-forward/publication-replay-cleanup/HOST-ci-${{ github.run_id }}-${{ github.run_attempt }}/ENTRY.json
            ${{ github.workspace }}/validation/pooled-forward/publication-replay-cleanup/HOST-ci-${{ github.run_id }}-${{ github.run_attempt }}/RESULT.json
            ${{ github.workspace }}/validation/pooled-forward/publication-replay-cleanup/HOST-ci-${{ github.run_id }}-${{ github.run_attempt }}/CASES/*/RESULT.json
            ${{ github.workspace }}/validation/pooled-forward/publication-replay-cleanup/HOST-ci-${{ github.run_id }}-${{ github.run_attempt }}/CASES/*/COMMAND.json
            ${{ github.workspace }}/validation/pooled-forward/publication-replay-cleanup/HOST-ci-${{ github.run_id }}-${{ github.run_attempt }}/CASES/*/stdout.txt
            ${{ github.workspace }}/validation/pooled-forward/publication-replay-cleanup/HOST-ci-${{ github.run_id }}-${{ github.run_attempt }}/CASES/*/stderr.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Historical publication source alias controls
        run: python3 -B -m unittest discover -s validation/publications -p 'test_historical_sources.py'
      - name: Admit exact historical aliases before expensive grading
        run: python3 -B validation/publications/check_historical_aliases.py
      - name: Managed execution neutral measurement controls
        run: python3 -B -m unittest discover -s validation/managed-forward -p 'test_measure.py'
      - name: Replay immutable v12 source, original neutral SDK evidence and paired business barriers
        run: python3 -B validation/publications/managed-v12-replay/verify.py
      - run: python validation/feature-development/verify_evidence.py
      - run: python validation/blind-comparison/verify_evidence.py
      - run: python validation/observer-probes/verify_preflight.py
      - run: python validation/fresh-blind/verify_evidence.py
      - run: python validation/tool-forward/verify_capabilities.py
      - run: python validation/tool-forward/verify_engineering.py
      - run: python validation/tool-forward/verify_frozen.py --include-private
      - run: python validation/tool-forward/metrics.py --self-test
      - run: python validation/tool-forward/verify_evidence.py
      - run: python validation/tool-forward/verify_protocol.py
      - run: python validation/tool-forward/build_summary.py --check
      - run: python validation/tool-forward/build_tables.py --check
      - run: python validation/tool-forward/build_failure_index.py
      - run: python validation/tool-forward/verify_artifacts.py
      - run: python -B validation/dispatch-forward/verify_generic.py
      - run: python -B validation/dispatch-forward/run_evaluator_controls.py
      - run: python -B validation/dispatch-forward/run_png_cache_controls.py
      - run: python -B validation/publication_history.py dispatch-v4 verify_trial.py
      - run: python -B validation/dispatch-forward/verify_blind_stages.py
      - run: python -B validation/dispatch-forward/verify_evaluation.py
      - run: python -B validation/dispatch-forward/metrics.py
      - run: python -B validation/dispatch-forward/observation_facts.py
      - run: python -B validation/dispatch-forward/costs.py
      - run: python -B validation/dispatch-forward/build_tables.py
      - run: python -B validation/dispatch-forward/build_failure_index.py
      - run: python -B validation/publication_history.py dispatch-v4 verify_artifacts.py
      - run: python -B validation/state-forward/verify_tools.py
      - run: python -B validation/state-forward/verify_generic.py
      - run: python -B -m unittest discover -s validation/state-forward/design/private -p 'test_*.py'
      - run: python -B validation/publication_history.py state-v5 verify_trial.py
      - run: python -B validation/state-forward/verify_evaluation.py
      - run: python -B validation/state-forward/metrics.py
      - run: python -B validation/state-forward/costs.py
      - run: python -B validation/state-forward/build_tables.py
      - run: python -B validation/state-forward/failure_index.py
      - run: python -B validation/publication_history.py state-v5 artifacts.py
      - run: python -B validation/publication_history.py contract-v6 verify_tools.py
      - run: python -B validation/publication_history.py contract-v6 verify_generic.py
      - run: python -B -m unittest discover -s validation/contract-forward/design/private -p 'test_*.py'
      - run: python -B validation/contract-forward/verify_trial.py
      - run: python -B validation/contract-forward/verify_evaluation.py
      - run: python -B validation/contract-forward/costs.py
      - run: python -B validation/contract-forward/expectation_audit.py
      - run: python -B validation/contract-forward/failure_index.py
      - run: python -B validation/contract-forward/metrics.py
      - run: python -B validation/contract-forward/build_tables.py
      - run: python -B validation/contract-forward/build_gallery.py
      - run: python -B validation/publication_history.py contract-v6 artifacts.py
      - run: python -B validation/publication_history.py multitask-v7 verify_tools.py
      - run: python -B validation/multitask-forward/verify_generic.py
      - run: python -B validation/multitask-forward/design-v2/T1/private/test_grader.py
      - run: python -B validation/multitask-forward/design-v2/T2/private/test_grader.py
      - run: python -B validation/multitask-forward/design-v2/T3/private/test_grader.py
      - run: python -B validation/multitask-forward/verify_trial.py
      - run: python -B validation/multitask-forward/verify_evaluation.py
      - run: python -B validation/multitask-forward/verify_claims.py
      - run: python -B validation/multitask-forward/test_metrics.py
      - run: python -B validation/multitask-forward/metrics.py
      - run: python -B validation/multitask-forward/quality_breakdown.py
      - run: python -B validation/multitask-forward/pair_metrics.py
      - run: python -B validation/multitask-forward/costs.py
      - run: python -B validation/multitask-forward/observation_costs.py
      - run: python -B validation/multitask-forward/failure_index.py
      - run: python -B validation/multitask-forward/build_tables.py
      - run: python -B validation/multitask-forward/build_gallery.py
      - run: python -B validation/publication_history.py multitask-v7 artifacts.py
      - name: Shared native environment compatibility regression
        run: python3 -B validation/multitask-forward/test_shared_environment.py
      - name: Verify separate posthoc shared infrastructure recheck
        run: |
          python3 -B validation/multitask-forward/supplement.py verify
          python3 -B validation/multitask-forward/supplement.py metrics
      - name: Verify original versus shared-fix comparison tables
        run: python3 -B validation/multitask-forward/build_supplement_tables.py
      - name: Verify post-reveal implementation identity diagnostic
        run: python3 -B validation/multitask-forward/implementation_comparison.py
      - name: Verify sealed independent product-disposition summary
        run: python3 -B validation/multitask-forward/review_product_summary.py
      - name: Replay unscored grader-disagreement pixel evidence
        run: python3 -B validation/multitask-forward/audit_grader_disagreements.py
      - name: Atomic review metric controls
        run: python3 -B validation/atomic-forward/test_metrics.py
      - name: Replay immutable v8 tools and publication in historical source view
        run: python3 -B validation/publications/atomic-v8/verify.py
      - name: Decision and feedback metric controls
        run: |
          python3 -B validation/feedback-forward/test_metrics.py
          python3 -B validation/feedback-forward/test_delivery_metrics.py
          python3 -B validation/feedback-forward/test_final_outcome_metrics.py
          python3 -B validation/feedback-forward/test_implementation_audit.py
          python3 -B validation/feedback-forward/test_source_outcomes.py
      - name: Replay immutable v9 publication in historical source view
        run: python3 -B validation/publications/feedback-v9-replay/verify.py
      - name: Replay immutable v10 publication in historical source view
        run: python3 -B validation/publications/default-v10-replay/verify.py
      - name: Replay immutable v11 source, evidence and original oracle differences
        run: python3 -B validation/publications/routed-v11-replay/verify.py
