name: pooled-runtime-preflight
on:
  push:
    branches: [codex/v13-ci-preflight]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Free unused hosted SDK disk
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow==11.3.0'
      - name: Qualify actual Linux Python 3.11 runtime and replay fixed evidence
        run: bash validation/pooled-forward/publication-runtime-admission/ci-python311-v2.sh
      - name: Retain runtime qualification and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-host-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: validation/pooled-forward/publication-runtime-admission/HOST/ci-python311.*/admission
          if-no-files-found: warn
          retention-days: 7
