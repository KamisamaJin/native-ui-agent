<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1270" viewBox="0 0 1080 1270">
<rect width="1080" height="1270" fill="#EDF1F6"/>
<g font-family="Arial, sans-serif">
<text x="32" y="38" font-size="22" font-weight="700" fill="#172B3A">Print collection authorization — original design intention</text>
<text x="32" y="66" font-size="15" fill="#526675">Schematic enlarged drawing · 320 offered units; native content = offered width minus 32</text>
<rect x="32" y="96" width="390" height="1110" rx="20" fill="#142232"/>
<text x="52" y="134" font-size="22" font-weight="600" fill="#F3F6FA">Authorize print collection</text>
<text x="52" y="166" font-size="13" font-weight="400" fill="#B6C7D5">Cedar Street Choir · 120 concert programmes</text>
<text x="52" y="190" font-size="13" font-weight="400" fill="#B6C7D5">Collect Thu 29 Oct, 16:00–18:30</text>
<text x="52" y="210" font-size="13" font-weight="400" fill="#B6C7D5">Front counter</text>
<rect x="52" y="240" width="350" height="86" rx="12" fill="#223548" stroke="#223548"/>
<text x="68" y="278" font-size="16" font-weight="600" fill="#F3F6FA">I will collect</text>
<text x="68" y="303" font-size="13" font-weight="400" fill="#B6C7D5">Use my order name at the counter</text>
<text x="370" y="278" font-size="18" font-weight="400" fill="#4FD1C5">○</text>
<rect x="52" y="342" width="350" height="86" rx="12" fill="#164C50" stroke="#4FD1C5"/>
<text x="68" y="380" font-size="16" font-weight="600" fill="#F3F6FA">Someone else will collect</text>
<text x="68" y="405" font-size="13" font-weight="400" fill="#B6C7D5">Photo ID and this reference required</text>
<text x="370" y="380" font-size="18" font-weight="400" fill="#4FD1C5">●</text>
<rect x="185" y="344" width="84" height="3" fill="none" stroke="#D33B30"/>
<text x="52" y="458" font-size="15" font-weight="400" fill="#F3F6FA">I have shared the collection reference</text>
<text x="52" y="480" font-size="15" font-weight="400" fill="#F3F6FA">and ID requirement with my collector.</text>
<rect x="350" y="445" width="40" height="24" rx="12" fill="#4FD1C5"/>
<circle cx="378" cy="457" r="10" fill="#FFFFFF"/>
<text x="52" y="520" font-size="15" font-weight="400" fill="#B6C7D5">Ready to authorize collection.</text>
<text x="52" y="558" font-size="15" font-weight="600" fill="#4FD1C5">Hide pickup notes  ˄</text>
<text x="52" y="596" font-size="15" font-weight="400" fill="#F3F6FA">Keep this collection reference available when</text>
<text x="52" y="622" font-size="15" font-weight="400" fill="#F3F6FA">you arrive. The counter team will check the job</text>
<text x="52" y="648" font-size="15" font-weight="400" fill="#F3F6FA">number before handing over the sealed cartons.</text>
<text x="52" y="674" font-size="15" font-weight="400" fill="#F3F6FA"></text>
<text x="52" y="700" font-size="15" font-weight="400" fill="#F3F6FA">The programmes are packed flat in three reusable</text>
<text x="52" y="726" font-size="15" font-weight="400" fill="#F3F6FA">cartons. Bring a trolley or ask the counter team</text>
<text x="52" y="752" font-size="15" font-weight="400" fill="#F3F6FA">for help before moving the full order.</text>
<text x="52" y="778" font-size="15" font-weight="400" fill="#F3F6FA"></text>
<text x="52" y="804" font-size="15" font-weight="400" fill="#F3F6FA">If someone collects for you, they must show their</text>
<text x="52" y="830" font-size="15" font-weight="400" fill="#F3F6FA">own photo ID and quote the same collection</text>
<text x="52" y="856" font-size="15" font-weight="400" fill="#F3F6FA">reference. Authorization covers collection only.</text>
<text x="52" y="882" font-size="15" font-weight="400" fill="#F3F6FA"></text>
<text x="52" y="908" font-size="15" font-weight="400" fill="#F3F6FA">Check the carton labels before leaving. Keep</text>
<text x="52" y="934" font-size="15" font-weight="400" fill="#F3F6FA">damaged cartons at the counter so the team can</text>
<text x="52" y="960" font-size="15" font-weight="400" fill="#F3F6FA">record the issue with you.</text>
<text x="52" y="986" font-size="15" font-weight="400" fill="#F3F6FA"></text>
<text x="52" y="1012" font-size="15" font-weight="400" fill="#F3F6FA">Uncollected work is stored indoors for seven</text>
<text x="52" y="1038" font-size="15" font-weight="400" fill="#F3F6FA">calendar days. Contact the shop if your event</text>
<text x="52" y="1064" font-size="15" font-weight="400" fill="#F3F6FA">has moved and you need a new arrangement.</text>
<rect x="52" y="1090" width="350" height="64" rx="12" fill="#4FD1C5"/>
<text x="77" y="1128" font-size="15" font-weight="600" fill="#102C30">Confirm collection authorization</text>
<path d="M430 128 H470" stroke="#657785" fill="none"/>
<text x="486" y="133" font-size="16" font-weight="400" fill="#172B3A">22 pt/sp semibold; scales with font setting.</text>
<path d="M430 168 H470" stroke="#657785" fill="none"/>
<text x="486" y="173" font-size="16" font-weight="400" fill="#172B3A">13 pt/sp regular secondary metadata.</text>
<path d="M430 240 H470" stroke="#657785" fill="none"/>
<text x="486" y="245" font-size="16" font-weight="400" fill="#172B3A">20 outer card padding; 16 inner row padding.</text>
<path d="M430 286 H470" stroke="#657785" fill="none"/>
<text x="486" y="291" font-size="16" font-weight="400" fill="#172B3A">Row min 80; grows for full labels. Radius 12.</text>
<path d="M430 350 H470" stroke="#657785" fill="none"/>
<text x="486" y="355" font-size="16" font-weight="400" fill="#172B3A">Solid fill sample: x 38–62%, y 2–6% of row.</text>
<path d="M430 386 H470" stroke="#657785" fill="none"/>
<text x="486" y="391" font-size="16" font-weight="400" fill="#172B3A">Selected fill and accent border follow theme.</text>
<path d="M430 455 H470" stroke="#657785" fill="none"/>
<text x="486" y="460" font-size="16" font-weight="400" fill="#172B3A">One native acknowledgment leaf; wrap its label.</text>
<path d="M430 520 H470" stroke="#657785" fill="none"/>
<text x="486" y="525" font-size="16" font-weight="400" fill="#172B3A">Status is caller text; 15 pt/sp regular.</text>
<path d="M430 559 H470" stroke="#657785" fill="none"/>
<text x="486" y="564" font-size="16" font-weight="400" fill="#172B3A">Native disclosure Button; minimum 48 high.</text>
<path d="M430 670 H470" stroke="#657785" fill="none"/>
<text x="486" y="675" font-size="16" font-weight="400" fill="#172B3A">Body 15 pt/sp regular; blank paragraph gaps.</text>
<path d="M430 750 H470" stroke="#657785" fill="none"/>
<text x="486" y="755" font-size="16" font-weight="400" fill="#172B3A">Never ellipsize or cap lines. Parent scrolls.</text>
<path d="M430 1050 H470" stroke="#657785" fill="none"/>
<text x="486" y="1055" font-size="16" font-weight="400" fill="#172B3A">12 between major controls; 8 within text groups.</text>
<path d="M430 1108 H470" stroke="#657785" fill="none"/>
<text x="486" y="1113" font-size="16" font-weight="400" fill="#172B3A">Primary min 48 high; grow for wrapping. Radius 12.</text>
<path d="M430 1170 H470" stroke="#657785" fill="none"/>
<text x="486" y="1175" font-size="16" font-weight="400" fill="#172B3A">Card radius 20. RTL uses start/end alignment.</text>
</g></svg>
