<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" aria-labelledby="title desc"><title id="title">Attachment transfer queue — independent native UI reference</title><desc id="desc">Three views of the public sample queue: normal expanded light, narrow expanded dark with stacked controls, and normal collapsed light with the hidden failure still reflected in the summary. Surrounding annotations are not component content.</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif} .annotation{font-size:13px;fill:#526279}.eyebrow{font-size:12px;font-weight:600;letter-spacing:1.1px;fill:#526279}</style><rect x="0" y="0" width="1280" height="920" fill="#EDF2F8" rx="0" /><text x="32" y="44" fill="#17243B" font-size="12" font-weight="600" text-anchor="start" class="eyebrow">ATTACHMENT TRANSFERS</text><text x="32" y="82" fill="#17243B" font-size="30" font-weight="600" text-anchor="start">A queue that stays useful when details collapse.</text><text x="32" y="109" fill="#526279" font-size="14" font-weight="400" text-anchor="start">Native system text · caller-owned state · one meaning across Compose and SwiftUI</text><text x="32" y="150" fill="#17243B" font-size="12" font-weight="600" text-anchor="start" class="eyebrow">01  EXPANDED</text><text x="32" y="173" fill="#526279" font-size="13" font-weight="400" text-anchor="start">358-unit panel · light</text><rect x="32" y="192" width="358" height="424" fill="#FFFFFF" rx="20" stroke="#D7DFEB" stroke-width="1" /><text x="48" y="228" fill="#17243B" font-size="20" font-weight="600" text-anchor="start">Attachment transfers</text><text x="356" y="227" fill="#275DD8" font-size="14" font-weight="600" text-anchor="end">Show less</text><polyline points="365,224 369,220 373,224" fill="none" stroke="#275DD8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /><circle cx="52" cy="265" r="4" fill="#B3313B" /><text x="64" y="270" fill="#B3313B" font-siz