<svg xmlns="http://www.w3.org/2000/svg" width="470" height="1700" viewBox="0 0 470 1700">
  <rect width="470" height="1700" fill="#e7e7e7"/>
  <rect x="24" y="24" width="422" height="1652" rx="20" fill="#f5f2ea" stroke="#6a6a6a"/>
  <g font-family="system-ui,sans-serif" fill="#263a30">
    <text x="42" y="52" font-size="11">STRUCTURE ONLY · NOT A NATIVE PIXEL BASELINE</text>
    <text x="42" y="85" font-size="12" font-weight="600">MENU CHANGE</text>
    <text x="42" y="122" font-size="26" font-weight="700">Community lunch</text>
    <text x="42" y="152" font-size="26" font-weight="700">menu review</text>
    <text x="42" y="183" font-size="13">Order, venue and revision</text>
    <text x="42" y="207" font-size="14">Replacing: original dish · requested servings</text>
    <text x="42" y="231" font-size="13">Please respond by the supplied deadline</text>
    <rect x="40" y="250" width="390" height="76" rx="16" fill="#fff0d9" stroke="#cbd5cc"/>
    <text x="54" y="278" font-size="14">Kitchen update notice, wrapping fully</text>
    <text x="54" y="301" font-size="14">when the caller sends a new revision.</text>
    <text x="42" y="362" font-size="18" font-weight="600">Choose a replacement</text>
    <rect x="40" y="379" width="390" height="108" rx="16" fill="#e9f3ed" stroke="#216b4a"/>
    <text x="54" y="407" font-size="15" font-weight="600">Selected replacement option</text>
    <text x="54" y="433" font-size="14">Full detail; no truncation</text>
    <text x="54" y="459" font-size="13">Price per serving · inclusive serving range</text>
    <rect x="40" y="497" width="390" height="108" rx="16" fill="white" stroke="#cbd5cc"/>
    <text x="54" y="525" font-size="15" font-weight="600">Another replacement option</text>
    <text x="54" y="551" font-size="14">Full caller-provided description</text>
    <text x="54" y="577" font-size="13">Price per serving · inclusive serving range</text>
    <rect x="40" y="615" width="390" height="82" rx="16" fill="white" stroke="#cbd5cc"/>
    <text x="54" y="644" font-size="15">Unavailable option stays visible</text>
    <text x="54" y="671" font-size="13">Unavailable · disabled native button</text>
    <text x="42" y="735" font-size="18" font-weight="600">Servings</text>
    <rect x="42" y="753" width="48" height="46" rx="8" fill="white" stroke="#cbd5cc"/>
    <text x="61" y="783" font-size="24">−</text>
    <text x="140" y="782" font-size="20" font-weight="600">13 servings</text>
    <rect x="380" y="753" width="48" height="46" rx="8" fill="white" stroke="#cbd5cc"/>
    <text x="395" y="783" font-size="24">+</text>
    <text x="42" y="838" font-size="15">Use tray return credit</text>
    <text x="42" y="860" font-size="13">Offered credit amount</text>
    <rect x="376" y="826" width="52" height="30" rx="15" fill="#216b4a"/>
    <circle cx="412" cy="841" r="12" fill="white"/>
    <rect x="40" y="888" width="390" height="248" rx="16" fill="white" stroke="#cbd5cc"/>
    <text x="54" y="918" font-size="18" font-weight="600">Balance</text>
    <text x="54" y="946" font-size="15">Selected dish title</text>
    <text x="54" y="975" font-size="14">Replacement total $143.00</text>
    <text x="54" y="1002" font-size="14">Already paid $120.00</text>
    <text x="54" y="1029" font-size="14">Tray credit applied $9.00</text>
    <text x="54" y="1064" font-size="20" font-weight="700">Additional payment</text>
    <text x="54" y="1102" font-size="26" font-weight="700">$14.00</text>
    <text x="42" y="1174" font-size="18" font-weight="600">Kitchen notes</text>
    <text x="42" y="1204" font-size="14">Multiple full paragraphs in ordinary flow.</text>
    <text x="42" y="1230" font-size="14">This area grows; the caller scrolls the whole panel.</text>
    <path d="M44 1250v110m0-100h350m-350 25h320m-320 25h350m-350 25h295m-295 25h350" stroke="#a5aea7" stroke-width="2"/>
    <text x="42" y="1396" font-size="18" font-weight="600">Your confirmation</text>
    <text x="42" y="1426" font-size="14">I accept the replacement, serving count,</text>
    <text x="42" y="1450" font-size="14">and balance shown.</text>
    <rect x="376" y="1420" width="52" height="30" rx="15" fill="#216b4a"/>
    <circle cx="412" cy="1435" r="12" fill="white"/>
    <text x="42" y="1501" font-size="14">Ready to send to the kitchen.</text>
    <rect x="40" y="1522" width="390" height="56" rx="16" fill="#216b4a"/>
    <text x="235" y="1557" font-size="16" text-anchor="middle" fill="white" font-weight="600">Send replacement request</text>
    <text x="42" y="1614" font-size="12">Vertical dimensions expand with text and content.</text>
    <text x="42" y="1637" font-size="12">RTL uses native leading/trailing layout.</text>
  </g>
</svg>
