<svg xmlns="http://www.w3.org/2000/svg" width="390" height="973" viewBox="0 0 390 973"><rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="16" y="46" fill="#18251F" font-family="Arial,sans-serif" font-size="22" font-weight="700">Ridge expedition pack</text>
<text x="16" y="75" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">North ridge • shared equipment</text>
<rect x="16" y="99" width="173" height="95" rx="12" fill="#F4F7F3" stroke="#C9D7CC"/>
<text x="28" y="127" fill="#18251F" font-family="Arial,sans-serif" font-size="16" font-weight="700">Two-person tent</text>
<text x="28" y="155" fill="#53645B" font-family="Arial,sans-serif" font-size="12" font-weight="400">Overnight shelter • 1800 g</text>
<rect x="201" y="99" width="173" height="95" rx="12" fill="#F4F7F3" stroke="#C9D7CC"/>
<text x="213" y="127" fill="#18251F" font-family="Arial,sans-serif" font-size="16" font-weight="700">Trail stove</text>
<text x="213" y="155" fill="#53645B" font-family="Arial,sans-serif" font-size="12" font-weight="400">Shared cooking • 800 g</text>
<rect x="16" y="210" width="358" height="52" rx="12" fill="#C9D7CC" stroke="#C9D7CC"/>
<text x="28" y="238" fill="#53645B" font-family="Arial,sans-serif" font-size="16" font-weight="700">Weather cover</text>
<text x="16" y="296" fill="#18251F" font-family="Arial,sans-serif" font-size="18" font-weight="700">0 items • 1200 g / 3500 g</text>
<text x="16" y="332" fill="#276145" font-family="Arial,sans-serif" font-size="14" font-weight="700">Choose shared equipment</text>
<rect x="16" y="348" width="358" height="48" rx="12" fill="#F4F7F3" stroke="#C9D7CC"/>
<text x="28" y="374" fill="#18251F" font-family="Arial,sans-serif" font-size="14" font-weight="700">Show details</text>
<rect x="16" y="412" width="358" height="56" rx="12" fill="#C9D7CC" stroke="#C9D7CC"/>
<text x="28" y="443" fill="#53645B" font-family="Arial,sans-serif" font-size="16" font-weight="700">Confirm pack</text>
<text x="16" y="508" fill="#18251F" font-family="Arial,sans-serif" font-size="16" font-weight="700">Before departure</text>
<text x="16" y="539" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">Packing order: place dense equipment close to your</text>
<text x="16" y="557" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">back and keep the route map reachable. Check the</text>
<text x="16" y="575" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">actual pack before departure. This planning card</text>
<text x="16" y="593" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">records the chosen shared equipment; it does not</text>
<text x="16" y="611" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">replace the group leader’s final equipment inspection.</text>
<text x="16" y="645" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">Weather changes quickly along the exposed ridge. Keep</text>
<text x="16" y="663" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">the optional weather cover at the top of the bag when</text>
<text x="16" y="681" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">selected. The cover protects equipment from brief rain</text>
<text x="16" y="699" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">and is not a substitute for the overnight shelter required</text>
<text x="16" y="717" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">by this route.</text>
<text x="16" y="751" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">Each listed weight is the total carried weight for one</text>
<text x="16" y="769" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">shared item. The base load already includes personal</text>
<text x="16" y="787" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">clothing, food and the filled bottle. Do not add those</text>
<text x="16" y="805" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">items a second time when discussing the displayed total</text>
<text x="16" y="823" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">with the group.</text>
<text x="16" y="857" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">Before leaving the meeting point, check straps, buckles</text>
<text x="16" y="875" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">and the tent poles with another member of the group.</text>
<text x="16" y="893" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">Record any damaged equipment with the trip</text>
<text x="16" y="911" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">coordinator. Availability shown here comes from the</text>
<text x="16" y="929" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">caller and may change when a new trip request arrives.</text>
</svg>