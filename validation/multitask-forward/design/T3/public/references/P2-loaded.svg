<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1956" viewBox="0 0 320 1956"><rect width="100%" height="100%" fill="#101A14"/>
<text x="16" y="59" fill="#E9F2EC" font-family="Arial,sans-serif" font-size="35" font-weight="700">Café group order</text>
<text x="16" y="100" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">Design team • afternoon</text>
<text x="16" y="129" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">break</text>
<rect x="16" y="156" width="138" height="152" rx="12" fill="#16231C" stroke="#456251"/>
<text x="28" y="194" fill="#E9F2EC" font-family="Arial,sans-serif" font-size="26" font-weight="700">Oat latte</text>
<text x="28" y="245" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="19" font-weight="400">Oat milk •</text>
<text x="28" y="270" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="19" font-weight="400">espresso</text>
<rect x="166" y="156" width="138" height="152" rx="12" fill="#456251" stroke="#456251"/>
<text x="178" y="194" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="26" font-weight="700">Cold</text>
<text x="178" y="228" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="26" font-weight="700">brew</text>
<text x="178" y="245" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="19" font-weight="400">Black coffee</text>
<text x="178" y="270" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="19" font-weight="400">• chilled</text>
<rect x="16" y="324" width="288" height="83" rx="12" fill="#456251" stroke="#456251"/>
<text x="28" y="362" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="26" font-weight="700">Reusable cups</text>
<text x="16" y="452" fill="#E9F2EC" font-family="Arial,sans-serif" font-size="29" font-weight="700">0 drinks • $0.00</text>
<text x="16" y="499" fill="#94D6AC" font-family="Arial,sans-serif" font-size="22" font-weight="700">No member saving</text>
<rect x="16" y="518" width="288" height="48" rx="12" fill="#16231C" stroke="#456251"/>
<text x="28" y="552" fill="#E9F2EC" font-family="Arial,sans-serif" font-size="22" font-weight="700">Show details</text>
<rect x="16" y="582" width="288" height="56" rx="12" fill="#456251" stroke="#456251"/>
<text x="28" y="623" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="26" font-weight="700">Place order</text>
<text x="16" y="688" fill="#E9F2EC" font-family="Arial,sans-serif" font-size="26" font-weight="700">Collection notes</text>
<text x="16" y="730" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">Group order notes: each</text>
<text x="16" y="759" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">selected drink represents one</text>
<text x="16" y="788" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">serving. Review the drinks</text>
<text x="16" y="817" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">with the group before placing</text>
<text x="16" y="846" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">the order. Availability and</text>
<text x="16" y="875" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">serving limits are supplied by</text>
<text x="16" y="904" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">the café for this order; a</text>
<text x="16" y="933" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">replacement order starts with</text>
<text x="16" y="962" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">its own supplied selection.</text>
<text x="16" y="1007" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">Reusable cup credit is</text>
<text x="16" y="1036" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">available only for eligible</text>
<text x="16" y="1065" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">drinks when the counter</text>
<text x="16" y="1094" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">accepts reusable cups. Every</text>
<text x="16" y="1123" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">selected drink must support</text>
<text x="16" y="1152" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">that option. Bring clean cups</text>
<text x="16" y="1181" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">to the collection counter and</text>
<text x="16" y="1210" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">tell the barista which drinks</text>
<text x="16" y="1239" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">belong to each person in the</text>
<text x="16" y="1268" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">group.</text>
<text x="16" y="1313" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">Member savings are applied</text>
<text x="16" y="1342" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">once when the number of</text>
<text x="16" y="1371" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">selected drinks meets the</text>
<text x="16" y="1400" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">displayed threshold. Cup</text>
<text x="16" y="1429" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">credit is calculated separately</text>
<text x="16" y="1458" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">per selected drink. The</text>
<text x="16" y="1487" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">summary shows the final</text>
<text x="16" y="1516" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">quoted total after both</text>
<text x="16" y="1545" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">reductions, with a minimum</text>
<text x="16" y="1574" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">total of zero.</text>
<text x="16" y="1619" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">Please check ingredients</text>
<text x="16" y="1648" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">directly with café staff if</text>
<text x="16" y="1677" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">anyone has an allergy.</text>
<text x="16" y="1706" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">Ingredient notes on this</text>
<text x="16" y="1735" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">planning card are</text>
<text x="16" y="1764" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">informational. The order</text>
<text x="16" y="1793" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">callback contains the</text>
<text x="16" y="1822" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">selected drink identifiers and</text>
<text x="16" y="1851" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">the cup choice; it does not</text>
<text x="16" y="1880" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">collect payment or schedule</text>
<text x="16" y="1909" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">collection.</text>
</svg>