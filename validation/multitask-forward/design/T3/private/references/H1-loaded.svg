<svg xmlns="http://www.w3.org/2000/svg" width="390" height="973" viewBox="0 0 390 973"><rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="16" y="46" fill="#18251F" font-family="Arial,sans-serif" font-size="22" font-weight="700">Café group order</text>
<text x="16" y="75" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">Design team • afternoon break</text>
<rect x="16" y="99" width="173" height="95" rx="12" fill="#F4F7F3" stroke="#C9D7CC"/>
<text x="28" y="127" fill="#18251F" font-family="Arial,sans-serif" font-size="16" font-weight="700">Oat latte</text>
<text x="28" y="155" fill="#53645B" font-family="Arial,sans-serif" font-size="12" font-weight="400">Oat milk • espresso</text>
<rect x="201" y="99" width="173" height="95" rx="12" fill="#F4F7F3" stroke="#276145"/>
<text x="213" y="127" fill="#18251F" font-family="Arial,sans-serif" font-size="16" font-weight="700">Cold brew</text>
<text x="213" y="155" fill="#53645B" font-family="Arial,sans-serif" font-size="12" font-weight="400">Black coffee • chilled</text>
<rect x="16" y="210" width="358" height="52" rx="12" fill="#C9D7CC" stroke="#C9D7CC"/>
<text x="28" y="238" fill="#53645B" font-family="Arial,sans-serif" font-size="16" font-weight="700">Reusable cups</text>
<text x="16" y="296" fill="#18251F" font-family="Arial,sans-serif" font-size="18" font-weight="700">1 drink • $4.00</text>
<text x="16" y="332" fill="#276145" font-family="Arial,sans-serif" font-size="14" font-weight="700">No member saving</text>
<rect x="16" y="348" width="358" height="48" rx="12" fill="#F4F7F3" stroke="#C9D7CC"/>
<text x="28" y="374" fill="#18251F" font-family="Arial,sans-serif" font-size="14" font-weight="700">Show details</text>
<rect x="16" y="412" width="358" height="56" rx="12" fill="#276145" stroke="#276145"/>
<text x="28" y="443" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="16" font-weight="700">Place order</text>
<text x="16" y="508" fill="#18251F" font-family="Arial,sans-serif" font-size="16" font-weight="700">Collection notes</text>
<text x="16" y="539" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">Group order notes: each selected drink represents one</text>
<text x="16" y="557" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">serving. Review the drinks with the group before placing</text>
<text x="16" y="575" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">the order. Availability and serving limits are supplied by</text>
<text x="16" y="593" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">the café for this order; a replacement order starts with</text>
<text x="16" y="611" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">its own supplied selection.</text>
<text x="16" y="645" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">Reusable cup credit is available only for eligible drinks</text>
<text x="16" y="663" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">when the counter accepts reusable cups. Every selected</text>
<text x="16" y="681" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">drink must support that option. Bring clean cups to the</text>
<text x="16" y="699" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">collection counter and tell the barista which drinks</text>
<text x="16" y="717" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">belong to each person in the group.</text>
<text x="16" y="751" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">Member savings are applied once when the number of</text>
<text x="16" y="769" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">selected drinks meets the displayed threshold. Cup</text>
<text x="16" y="787" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">credit is calculated separately per selected drink. The</text>
<text x="16" y="805" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">summary shows the final quoted total after both</text>
<text x="16" y="823" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">reductions, with a minimum total of zero.</text>
<text x="16" y="857" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">Please check ingredients directly with café staff if</text>
<text x="16" y="875" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">anyone has an allergy. Ingredient notes on this planning</text>
<text x="16" y="893" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">card are informational. The order callback contains the</text>
<text x="16" y="911" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">selected drink identifiers and the cup choice; it does not</text>
<text x="16" y="929" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">collect payment or schedule collection.</text>
</svg>