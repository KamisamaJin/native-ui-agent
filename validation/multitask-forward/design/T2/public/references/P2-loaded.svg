<svg xmlns="http://www.w3.org/2000/svg" width="320" height="2031" viewBox="0 0 320 2031"><rect width="100%" height="100%" fill="#101A14"/>
<text x="16" y="59" fill="#E9F2EC" font-family="Arial,sans-serif" font-size="35" font-weight="700">Publication</text>
<text x="16" y="105" fill="#E9F2EC" font-family="Arial,sans-serif" font-size="35" font-weight="700">rights</text>
<text x="16" y="146" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">Field Journal • autumn</text>
<text x="16" y="175" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">feature</text>
<rect x="16" y="202" width="138" height="152" rx="12" fill="#16231C" stroke="#456251"/>
<text x="28" y="240" fill="#E9F2EC" font-family="Arial,sans-serif" font-size="26" font-weight="700">Website</text>
<text x="28" y="291" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="19" font-weight="400">Own</text>
<text x="28" y="316" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="19" font-weight="400">publication</text>
<text x="28" y="341" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="19" font-weight="400">pages</text>
<rect x="166" y="202" width="138" height="152" rx="12" fill="#456251" stroke="#456251"/>
<text x="178" y="240" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="26" font-weight="700">Print</text>
<text x="178" y="274" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="26" font-weight="700">edition</text>
<text x="178" y="291" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="19" font-weight="400">One printed</text>
<text x="178" y="316" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="19" font-weight="400">edition</text>
<rect x="16" y="370" width="288" height="83" rx="12" fill="#456251" stroke="#456251"/>
<text x="28" y="408" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="26" font-weight="700">Exclusive license</text>
<text x="16" y="498" fill="#E9F2EC" font-family="Arial,sans-serif" font-size="29" font-weight="700">0 channels • $12.00</text>
<text x="16" y="545" fill="#94D6AC" font-family="Arial,sans-serif" font-size="22" font-weight="700">Choose a publication</text>
<text x="16" y="574" fill="#94D6AC" font-family="Arial,sans-serif" font-size="22" font-weight="700">channel</text>
<rect x="16" y="593" width="288" height="48" rx="12" fill="#16231C" stroke="#456251"/>
<text x="28" y="627" fill="#E9F2EC" font-family="Arial,sans-serif" font-size="22" font-weight="700">Show details</text>
<rect x="16" y="657" width="288" height="56" rx="12" fill="#456251" stroke="#456251"/>
<text x="28" y="698" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="26" font-weight="700">Create license</text>
<text x="16" y="763" fill="#E9F2EC" font-family="Arial,sans-serif" font-size="26" font-weight="700">Usage notes</text>
<text x="16" y="805" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">Publication scope: the</text>
<text x="16" y="834" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">selected channels apply to</text>
<text x="16" y="863" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">this one asset and the named</text>
<text x="16" y="892" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">publication only. Website use</text>
<text x="16" y="921" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">includes the publication’s own</text>
<text x="16" y="950" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">article pages. A printed</text>
<text x="16" y="979" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">edition covers one edition and</text>
<text x="16" y="1008" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">does not include</text>
<text x="16" y="1037" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">merchandise, packaging or</text>
<text x="16" y="1066" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">unrelated promotional</text>
<text x="16" y="1095" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">campaigns.</text>
<text x="16" y="1140" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">An exclusive license is</text>
<text x="16" y="1169" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">offered only when the asset</text>
<text x="16" y="1198" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">owner has made it available</text>
<text x="16" y="1227" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">for this quote. Its surcharge is</text>
<text x="16" y="1256" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">added once to the channel</text>
<text x="16" y="1285" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">total. The eligibility message</text>
<text x="16" y="1314" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">and quoted amount should be</text>
<text x="16" y="1343" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">reviewed together before</text>
<text x="16" y="1372" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">creating the license request.</text>
<text x="16" y="1417" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">Attribution must remain</text>
<text x="16" y="1446" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">visible wherever the asset</text>
<text x="16" y="1475" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">appears. Keep the creator</text>
<text x="16" y="1504" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">credit with the image or in the</text>
<text x="16" y="1533" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">publication’s credits section.</text>
<text x="16" y="1562" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">Cropping may preserve the</text>
<text x="16" y="1591" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">subject and must not remove</text>
<text x="16" y="1620" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">a visible signature. These</text>
<text x="16" y="1649" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">notes travel with the editorial</text>
<text x="16" y="1678" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">handoff.</text>
<text x="16" y="1723" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">A new quote replaces the</text>
<text x="16" y="1752" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">current channel selection and</text>
<text x="16" y="1781" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">exclusive choice with its own</text>
<text x="16" y="1810" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">supplied starting values.</text>
<text x="16" y="1839" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">Creating a request sends the</text>
<text x="16" y="1868" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">chosen channel identifiers to</text>
<text x="16" y="1897" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">the caller. It does not charge</text>
<text x="16" y="1926" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">a card, publish an asset or</text>
<text x="16" y="1955" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">automatically grant additional</text>
<text x="16" y="1984" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">usage rights.</text>
</svg>