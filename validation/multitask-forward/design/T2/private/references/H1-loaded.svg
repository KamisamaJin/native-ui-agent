<svg xmlns="http://www.w3.org/2000/svg" width="390" height="991" viewBox="0 0 390 991"><rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="16" y="46" fill="#18251F" font-family="Arial,sans-serif" font-size="22" font-weight="700">Publication rights</text>
<text x="16" y="75" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">Field Journal • autumn feature</text>
<rect x="16" y="99" width="173" height="95" rx="12" fill="#F4F7F3" stroke="#C9D7CC"/>
<text x="28" y="127" fill="#18251F" font-family="Arial,sans-serif" font-size="16" font-weight="700">Website</text>
<text x="28" y="155" fill="#53645B" font-family="Arial,sans-serif" font-size="12" font-weight="400">Own publication pages</text>
<rect x="201" y="99" width="173" height="95" rx="12" fill="#F4F7F3" stroke="#276145"/>
<text x="213" y="127" fill="#18251F" font-family="Arial,sans-serif" font-size="16" font-weight="700">Print edition</text>
<text x="213" y="155" fill="#53645B" font-family="Arial,sans-serif" font-size="12" font-weight="400">One printed edition</text>
<rect x="16" y="210" width="358" height="52" rx="12" fill="#F4F7F3" stroke="#276145"/>
<text x="28" y="238" fill="#18251F" font-family="Arial,sans-serif" font-size="16" font-weight="700">Exclusive license</text>
<text x="16" y="296" fill="#18251F" font-family="Arial,sans-serif" font-size="18" font-weight="700">1 channel • $62.00</text>
<text x="16" y="332" fill="#276145" font-family="Arial,sans-serif" font-size="14" font-weight="700">Exclusive use</text>
<rect x="16" y="348" width="358" height="48" rx="12" fill="#F4F7F3" stroke="#C9D7CC"/>
<text x="28" y="374" fill="#18251F" font-family="Arial,sans-serif" font-size="14" font-weight="700">Show details</text>
<rect x="16" y="412" width="358" height="56" rx="12" fill="#276145" stroke="#276145"/>
<text x="28" y="443" fill="#FFFFFF" font-family="Arial,sans-serif" font-size="16" font-weight="700">Create license</text>
<text x="16" y="508" fill="#18251F" font-family="Arial,sans-serif" font-size="16" font-weight="700">Usage notes</text>
<text x="16" y="539" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">Publication scope: the selected channels apply to this</text>
<text x="16" y="557" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">one asset and the named publication only. Website use</text>
<text x="16" y="575" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">includes the publication’s own article pages. A printed</text>
<text x="16" y="593" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">edition covers one edition and does not include</text>
<text x="16" y="611" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">merchandise, packaging or unrelated promotional</text>
<text x="16" y="629" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">campaigns.</text>
<text x="16" y="663" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">An exclusive license is offered only when the asset</text>
<text x="16" y="681" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">owner has made it available for this quote. Its surcharge</text>
<text x="16" y="699" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">is added once to the channel total. The eligibility</text>
<text x="16" y="717" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">message and quoted amount should be reviewed</text>
<text x="16" y="735" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">together before creating the license request.</text>
<text x="16" y="769" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">Attribution must remain visible wherever the asset</text>
<text x="16" y="787" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">appears. Keep the creator credit with the image or in the</text>
<text x="16" y="805" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">publication’s credits section. Cropping may preserve the</text>
<text x="16" y="823" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">subject and must not remove a visible signature. These</text>
<text x="16" y="841" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">notes travel with the editorial handoff.</text>
<text x="16" y="875" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">A new quote replaces the current channel selection and</text>
<text x="16" y="893" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">exclusive choice with its own supplied starting values.</text>
<text x="16" y="911" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">Creating a request sends the chosen channel identifiers</text>
<text x="16" y="929" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">to the caller. It does not charge a card, publish an asset</text>
<text x="16" y="947" fill="#53645B" font-family="Arial,sans-serif" font-size="14" font-weight="400">or automatically grant additional usage rights.</text>
</svg>