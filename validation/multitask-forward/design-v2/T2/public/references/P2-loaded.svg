<svg xmlns="http://www.w3.org/2000/svg" width="320" height="2316" viewBox="0 0 320 2316"><rect width="100%" height="100%" fill="#101B29"/>
<text x="16" y="59" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#E1EDFA">Broadcast cue</text>
<text x="16" y="105" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#E1EDFA">mixer</text>
<text x="16" y="146" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">Evening bulletin • Studio B</text>
<rect x="16" y="173" width="140.0" height="48" rx="10" fill="#17283C" stroke="#A0CCFA"/>
<text x="28" y="206.0" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#E1EDFA">Live</text>
<rect x="148.0" y="177" width="4" height="4" rx="2" fill="#A0CCFA" stroke="#A0CCFA"/>
<rect x="164.0" y="173" width="140.0" height="48" rx="10" fill="#17283C" stroke="#405971"/>
<text x="176.0" y="206.0" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#E1EDFA">Preview</text>
<text x="16" y="263" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#E1EDFA">Channels</text>
<text x="16" y="309" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#E1EDFA">Presenter • Locked</text>
<text x="16" y="342" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#B4C7DD">Speech bus • producer locked</text>
<rect x="16" y="359" width="48" height="48" rx="10" fill="#405971" stroke="#405971"/>
<text x="28" y="392.0" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#B4C7DD">−</text>
<text x="72" y="393" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#E1EDFA">3</text>
<rect x="104" y="359" width="48" height="48" rx="10" fill="#405971" stroke="#405971"/>
<text x="116" y="392.0" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#B4C7DD">+</text>
<rect x="214" y="359" width="90" height="48" rx="10" fill="#405971" stroke="#405971"/>
<text x="226" y="390.0" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#B4C7DD">Mute</text>
<text x="16" y="449" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#E1EDFA">Music bed</text>
<text x="16" y="482" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#B4C7DD">Underscore bus</text>
<rect x="16" y="499" width="48" height="48" rx="10" fill="#17283C" stroke="#405971"/>
<text x="28" y="532.0" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#E1EDFA">−</text>
<text x="72" y="533" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#E1EDFA">5</text>
<rect x="104" y="499" width="48" height="48" rx="10" fill="#405971" stroke="#405971"/>
<text x="116" y="532.0" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#B4C7DD">+</text>
<rect x="214" y="499" width="90" height="48" rx="10" fill="#17283C" stroke="#405971"/>
<text x="226" y="530.0" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#E1EDFA">Mute</text>
<text x="16" y="589" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#E1EDFA">Room tone</text>
<text x="16" y="622" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#B4C7DD">Ambience bus</text>
<rect x="16" y="639" width="48" height="48" rx="10" fill="#17283C" stroke="#405971"/>
<text x="28" y="672.0" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#E1EDFA">−</text>
<text x="72" y="673" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#E1EDFA">1</text>
<rect x="104" y="639" width="48" height="48" rx="10" fill="#17283C" stroke="#405971"/>
<text x="116" y="672.0" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#E1EDFA">+</text>
<rect x="214" y="639" width="90" height="48" rx="10" fill="#17283C" stroke="#405971"/>
<text x="226" y="670.0" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#E1EDFA">Mute</text>
<rect x="16" y="707" width="288" height="174" rx="10" fill="#17283C" stroke="#405971"/>
<text x="28" y="748" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#E1EDFA">3 audible • 9 / 6</text>
<text x="28" y="786" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#E1EDFA">units</text>
<text x="28" y="825" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">Headroom: -3 units</text>
<text x="28" y="862" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#A0CCFA">Live mode</text>
<text x="16" y="919" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#A0CCFA">Over live limit by 3 units</text>
<rect x="16" y="942" width="288" height="56" rx="10" fill="#405971" stroke="#405971"/>
<text x="28" y="983" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#B4C7DD">Apply mix</text>
<text x="16" y="1048" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#E1EDFA">Operator notes</text>
<text x="16" y="1090" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">Check the live load before</text>
<text x="16" y="1119" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">sending the mix to the desk.</text>
<text x="16" y="1148" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">Each unmuted channel with a</text>
<text x="16" y="1177" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">level above zero contributes</text>
<text x="16" y="1206" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">its displayed units. Muted</text>
<text x="16" y="1235" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">channels retain their stored</text>
<text x="16" y="1264" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">levels so that an engineer can</text>
<text x="16" y="1293" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">restore them without</text>
<text x="16" y="1322" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">rebuilding the balance.</text>
<text x="16" y="1367" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">Preview mode lets the</text>
<text x="16" y="1396" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">engineer prepare a mix that</text>
<text x="16" y="1425" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">exceeds the live unit limit.</text>
<text x="16" y="1454" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">The warning remains visible</text>
<text x="16" y="1483" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">because switching that mix to</text>
<text x="16" y="1512" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">live would require reducing</text>
<text x="16" y="1541" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">levels or muting channels.</text>
<text x="16" y="1570" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">Applying a preview mix does</text>
<text x="16" y="1599" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">not automatically switch the</text>
<text x="16" y="1628" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">desk to live.</text>
<text x="16" y="1673" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">Locked channels are supplied</text>
<text x="16" y="1702" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">by the producer. Their</text>
<text x="16" y="1731" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">increase, decrease and mute</text>
<text x="16" y="1760" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">controls remain disabled</text>
<text x="16" y="1789" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">while the channel is locked,</text>
<text x="16" y="1818" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">but their current audible</text>
<text x="16" y="1847" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">levels still count in the load.</text>
<text x="16" y="1876" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">Changing mode does not</text>
<text x="16" y="1905" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">unlock a channel or alter any</text>
<text x="16" y="1934" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">stored level.</text>
<text x="16" y="1979" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">A replacement session</text>
<text x="16" y="2008" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">restores all channel levels,</text>
<text x="16" y="2037" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">mute flags and mode from the</text>
<text x="16" y="2066" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">new request on the existing</text>
<text x="16" y="2095" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">mounted component.</text>
<text x="16" y="2124" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">Applying a mix reports the</text>
<text x="16" y="2153" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">real current values to the</text>
<text x="16" y="2182" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">caller. This panel does not</text>
<text x="16" y="2211" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">access an audio device, start</text>
<text x="16" y="2240" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">recording or change system</text>
<text x="16" y="2269" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#B4C7DD">volume.</text>
</svg>