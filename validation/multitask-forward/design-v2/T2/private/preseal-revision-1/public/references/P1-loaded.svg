<text x="116" y="275.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1E3652">+</text>
<rect x="284" y="248" width="90" height="44" rx="10" fill="#F0F5FA" stroke="#C8D7E5"/>
<text x="296" y="275.0" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#1E3652">Mute</text>
<text x="16" y="328" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1E3652">Music bed</text>
<text x="16" y="350" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#556B82">Underscore bus</text>
<rect x="16" y="364" width="44" height="44" rx="10" fill="#F0F5FA" stroke="#C8D7E5"/>
<text x="28" y="391.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1E3652">−</text>
<text x="72" y="388" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1E3652">2</text>
<rect x="104" y="364" width="44" height="44" rx="10" fill="#F0F5FA" stroke="#C8D7E5"/>
<text x="116" y="391.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1E3652">+</text>
<rect x="284" y="364" width="90" height="44" rx="10" fill="#F0F5FA" stroke="#C8D7E5"/>
<text x="296" y="391.0" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#1E3652">Mute</text>
<text x="16" y="444" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1E3652">Room tone</text>
<text x="16" y="466" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#556B82">Ambience bus</text>
<rect x="16" y="480" width="44" height="44" rx="10" fill="#F0F5FA" stroke="#C8D7E5"/>
<text x="28" y="507.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1E3652">−</text>
<text x="72" y="504" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1E3652">1</text>
<rect x="104" y="480" width="44" height="44" rx="10" fill="#F0F5FA" stroke="#C8D7E5"/>
<text x="116" y="507.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1E3652">+</text>
<rect x="284" y="480" width="90" height="44" rx="10" fill="#F0F5FA" stroke="#C8D7E5"/>
<text x="296" y="507.0" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#1E3652">Mute</text>
<rect x="16" y="548" width="358" height="100" rx="10" fill="#F0F5FA" stroke="#C8D7E5"/>
<text x="28" y="578" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#1E3652">3 audible • 6 / 6 units</text>
<text x="28" y="606" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#556B82">Headroom: 0 units</text>
<text x="28" y="632" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#245F9A">Live mode</text>
<rect x="16" y="664" width="358" height="56" rx="10" fill="#245F9A" stroke="#C8D7E5"/>
<text x="28" y="695" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">Apply mix</text>
<text x="16" y="760" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1E3652">Operator notes</text>
<text x="16" y="791" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#556B82">Check the live load before sending the mix to the desk.</text>
<text x="16" y="809" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#556B82">Each unmuted channel with a level above zero</text>
<text x="16" y="827" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#556B82">contributes its displayed units. Muted channels retain</text>
<text x="16" y="845" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#556B82">their stored levels so that an engineer can restore them</text>
<text x="16" y="863" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#556B82">without rebuilding the balance.</text>
<text x="16" y="897" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#556B82">Preview mode lets the engineer prepare a mix that</text>
<text x="16" y="915" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#556B82">exceeds the live unit limit. The warning remains visible</text>
<text x="16" y="933" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#556B82">because switching that mix to live would require</text>
<text x="16" y="951" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#556B82">reducing levels or muting channels. Applying a preview</text>
<text x="16" y="969" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#556B82">mix does not automatically switch the desk to live.</text>
<text x="16" y="1003" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#556B82">Locked channels are supplied by the producer. Their</text>
<text x="16" y="1021" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#556B82">increase, decrease and mute controls remain disabled</text>
<text x="16" y="1039" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#556B82">while the channel is locked, but their current audible</text>
<text x="16" y="1057" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#556B82">levels still count in the load. Changing mode does not</text>
<text x="16" y="1075" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#556B82">unlock a channel or alter any stored level.</text>
<text x="16" y="1109" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#556B82">A replacement session restores all channel levels, mute</text>
<text x="16" y="1127" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#556B82">flags and mode from the new request on the existing</text>
<text x="16" y="1145" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#556B82">mounted component. Applying a mix reports the real</text>
<text x="16" y="1163" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#556B82">current values to the caller. This panel does not access</text>
<text x="16" y="1181" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#556B82">an audio device, start recording or change system</text>
<text x="16" y="1199" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#556B82">volume.</text>
</svg>