<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1243" viewBox="0 0 390 1243"><rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="16" y="46" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#1E3652">Broadcast cue mixer</text>
<text x="16" y="75" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#556B82">Evening bulletin • Studio B</text>
