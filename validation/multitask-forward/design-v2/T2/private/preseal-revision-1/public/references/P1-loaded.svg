<text x="16" y="179" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1E3652">Channels</text>
<text x="16" y="212" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#1E3652">Presenter</text>
<text x="16" y="234" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#556B82">Speech bus</text>
