<svg xmlns="http://www.w3.org/2000/svg" width="320" height="1953" viewBox="0 0 320 1953"><rect width="100%" height="100%" fill="#101A14"/>
<text x="16" y="59" fill="#E9F2EC" font-family="Arial,sans-serif" font-size="35" font-weight="700">Ridge expedition</text>
<text x="16" y="105" fill="#E9F2EC" font-family="Arial,sans-serif" font-size="35" font-weight="700">pack</text>
<text x="16" y="146" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">North ridge • shared</text>
<text x="16" y="175" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">equipment</text>
<rect x="16" y="202" width="138" height="152" rx="12" fill="#16231C" stroke="#456251"/>
<text x="28" y="240" fill="#E9F2EC" font-family="Arial,sans-serif" font-size="26" font-weight="700">Two-person</text>
<text x="28" y="274" fill="#E9F2EC" font-family="Arial,sans-serif" font-size="26" font-weight="700">tent</text>
<text x="28" y="291" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="19" font-weight="400">Overnight</text>
<text x="28" y="316" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="19" font-weight="400">shelter •</text>
<text x="28" y="341" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="19" font-weight="400">1800 g</text>
<rect x="166" y="202" width="138" height="152" rx="12" fill="#456251" stroke="#456251"/>
<text x="178" y="240" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="26" font-weight="700">Trail</text>
<text x="178" y="274" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="26" font-weight="700">stove</text>
<text x="178" y="291" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="19" font-weight="400">Shared</text>
<text x="178" y="316" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="19" font-weight="400">cooking •</text>
<text x="178" y="341" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="19" font-weight="400">800 g</text>
<rect x="16" y="370" width="288" height="83" rx="12" fill="#456251" stroke="#456251"/>
<text x="28" y="408" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="26" font-weight="700">Weather cover</text>
<text x="16" y="498" fill="#E9F2EC" font-family="Arial,sans-serif" font-size="29" font-weight="700">0 items • 1200 g /</text>
<text x="16" y="536" fill="#E9F2EC" font-family="Arial,sans-serif" font-size="29" font-weight="700">3150 g</text>
<text x="16" y="583" fill="#94D6AC" font-family="Arial,sans-serif" font-size="22" font-weight="700">Choose shared equipment</text>
<rect x="16" y="602" width="288" height="48" rx="12" fill="#16231C" stroke="#456251"/>
<text x="28" y="636" fill="#E9F2EC" font-family="Arial,sans-serif" font-size="22" font-weight="700">Show details</text>
<rect x="16" y="666" width="288" height="56" rx="12" fill="#456251" stroke="#456251"/>
<text x="28" y="707" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="26" font-weight="700">Confirm pack</text>
<text x="16" y="772" fill="#E9F2EC" font-family="Arial,sans-serif" font-size="26" font-weight="700">Before departure</text>
<text x="16" y="814" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">Packing order: place dense</text>
<text x="16" y="843" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">equipment close to your back</text>
<text x="16" y="872" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">and keep the route map</text>
<text x="16" y="901" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">reachable. Check the actual</text>
<text x="16" y="930" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">pack before departure. This</text>
<text x="16" y="959" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">planning card records the</text>
<text x="16" y="988" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">chosen shared equipment; it</text>
<text x="16" y="1017" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">does not replace the group</text>
<text x="16" y="1046" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">leader’s final equipment</text>
<text x="16" y="1075" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">inspection.</text>
<text x="16" y="1120" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">Weather changes quickly</text>
<text x="16" y="1149" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">along the exposed ridge.</text>
<text x="16" y="1178" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">Keep the optional weather</text>
<text x="16" y="1207" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">cover at the top of the bag</text>
<text x="16" y="1236" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">when selected. The cover</text>
<text x="16" y="1265" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">protects equipment from brief</text>
<text x="16" y="1294" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">rain and is not a substitute for</text>
<text x="16" y="1323" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">the overnight shelter required</text>
<text x="16" y="1352" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">by this route.</text>
<text x="16" y="1397" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">Each listed weight is the total</text>
<text x="16" y="1426" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">carried weight for one shared</text>
<text x="16" y="1455" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">item. The base load already</text>
<text x="16" y="1484" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">includes personal clothing,</text>
<text x="16" y="1513" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">food and the filled bottle. Do</text>
<text x="16" y="1542" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">not add those items a second</text>
<text x="16" y="1571" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">time when discussing the</text>
<text x="16" y="1600" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">displayed total with the group.</text>
<text x="16" y="1645" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">Before leaving the meeting</text>
<text x="16" y="1674" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">point, check straps, buckles</text>
<text x="16" y="1703" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">and the tent poles with</text>
<text x="16" y="1732" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">another member of the group.</text>
<text x="16" y="1761" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">Record any damaged</text>
<text x="16" y="1790" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">equipment with the trip</text>
<text x="16" y="1819" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">coordinator. Availability</text>
<text x="16" y="1848" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">shown here comes from the</text>
<text x="16" y="1877" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">caller and may change when</text>
<text x="16" y="1906" fill="#B7C7BD" font-family="Arial,sans-serif" font-size="22" font-weight="400">a new trip request arrives.</text>
</svg>