<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1450" viewBox="0 0 390 1450"><rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="16" y="46" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#432D58">Collection condition review</text>
<text x="16" y="75" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#746181">North gallery • weekly inspection</text>
<text x="16" y="115" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#432D58">Inspection queue</text>
<rect x="16" y="132" width="358" height="64" rx="10" fill="#F6F1FA" stroke="#7750A6"/>
<text x="28" y="169.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#432D58">Botanical folio, Needs care</text>
<rect x="366" y="136" width="4" height="4" rx="2" fill="#7750A6" stroke="#7750A6"/>
<rect x="16" y="204" width="358" height="64" rx="10" fill="#F6F1FA" stroke="#DACDE5"/>
<text x="28" y="241.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#432D58">Ceramic bowl, Pending</text>
<rect x="16" y="276" width="358" height="64" rx="10" fill="#F6F1FA" stroke="#DACDE5"/>
<text x="28" y="313.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#432D58">Harbor sketch, Pending</text>
<text x="16" y="373" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#7750A6">Object inspector</text>
<text x="16" y="405" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#432D58">Botanical folio</text>
<text x="16" y="433" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#746181">Paper and cloth</text>
<text x="16" y="463" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#746181">Check the spine and page edges under normal gallery</text>
<text x="16" y="481" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#746181">lighting. Keep the folio supported on the supplied cradle.</text>
<text x="16" y="499" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#746181">Record the visible condition without opening sections</text>
<text x="16" y="517" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#746181">that the collection team has marked as restricted.</text>
<rect x="16" y="537" width="358" height="48" rx="10" fill="#F6F1FA" stroke="#DACDE5"/>
<text x="28" y="566.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#432D58">Stable</text>
<rect x="16" y="593" width="358" height="48" rx="10" fill="#F6F1FA" stroke="#7750A6"/>
<text x="28" y="622.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#432D58">Needs care</text>
<rect x="366" y="597" width="4" height="4" rx="2" fill="#7750A6" stroke="#7750A6"/>
<text x="16" y="671" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#432D58">Care category</text>
<rect x="16" y="683" width="358" height="48" rx="10" fill="#F6F1FA" stroke="#DACDE5"/>
<text x="28" y="712.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#432D58">Surface</text>
<rect x="16" y="739" width="358" height="48" rx="10" fill="#F6F1FA" stroke="#DACDE5"/>
<text x="28" y="768.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#432D58">Structure</text>
<text x="16" y="821" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#432D58">0 of 3 reviewed • 1 follow-up</text>
<text x="16" y="851" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#7750A6">Choose a care category</text>
<rect x="16" y="871" width="358" height="56" rx="10" fill="#DACDE5" stroke="#DACDE5"/>
<text x="28" y="902" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#746181">Submit review</text>
<text x="16" y="967" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#432D58">Review notes</text>
<text x="16" y="998" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#746181">Inspect each object in the queue and record its condition</text>
<text x="16" y="1016" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#746181">before submitting the review. Stable means no follow-up</text>
<text x="16" y="1034" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#746181">category is needed. Needs care requires a category so</text>
<text x="16" y="1052" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#746181">that the collection team can direct the object to the</text>
<text x="16" y="1070" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#746181">appropriate conservator.</text>
<text x="16" y="1104" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#746181">Surface care covers visible finish and surface concerns;</text>
<text x="16" y="1122" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#746181">structure covers the support or physical assembly. This</text>
<text x="16" y="1140" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#746181">review records a routing category only. It does not</text>
<text x="16" y="1158" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#746181">prescribe a treatment, authorize cleaning or replace</text>
<text x="16" y="1176" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#746181">inspection by the collection’s conservation staff.</text>
<text x="16" y="1210" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#746181">Moving between queue rows keeps decisions already</text>
<text x="16" y="1228" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#746181">entered for other objects. Read-only objects show their</text>
<text x="16" y="1246" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#746181">supplied condition and cannot be edited. An optional</text>
<text x="16" y="1264" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#746181">object may remain pending; every required object must</text>
<text x="16" y="1282" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#746181">have a complete decision before submission is enabled.</text>
<text x="16" y="1316" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#746181">A new review request replaces all local decisions and</text>
<text x="16" y="1334" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#746181">focuses the caller’s requested object, or the first object</text>
<text x="16" y="1352" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#746181">when that identifier is unknown. The summary always</text>
<text x="16" y="1370" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#746181">counts the current complete decisions and care</text>
<text x="16" y="1388" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#746181">follow-ups across the entire queue, including objects</text>
<text x="16" y="1406" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#746181">outside the inspector.</text>
</svg>