<svg xmlns="http://www.w3.org/2000/svg" width="320" height="2767" viewBox="0 0 320 2767"><rect width="100%" height="100%" fill="#1C1424"/>
<text x="16" y="59" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#EADDF6">Collection</text>
<text x="16" y="105" font-family="Arial,sans-serif" font-size="35" font-weight="700" fill="#EADDF6">condition review</text>
<text x="16" y="146" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">North gallery • weekly</text>
<text x="16" y="175" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">inspection</text>
<text x="16" y="228" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#EADDF6">Inspection queue</text>
<rect x="16" y="248" width="288" height="99" rx="10" fill="#2A1D36" stroke="#D5B6F5"/>
<text x="28" y="306.5" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#EADDF6">Botanical folio,</text>
<text x="28" y="340.5" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#EADDF6">Needs care</text>
<rect x="296" y="252" width="4" height="4" rx="2" fill="#D5B6F5" stroke="#D5B6F5"/>
<rect x="16" y="355" width="288" height="99" rx="10" fill="#2A1D36" stroke="#634E75"/>
<text x="28" y="413.5" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#EADDF6">Ceramic bowl, Stable</text>
<rect x="16" y="462" width="288" height="99" rx="10" fill="#2A1D36" stroke="#634E75"/>
<text x="28" y="520.5" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#EADDF6">Harbor sketch, Stable</text>
<text x="16" y="602" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#D5B6F5">Object inspector</text>
<text x="16" y="649" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#EADDF6">Botanical folio</text>
<text x="16" y="689" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">Paper and cloth</text>
<text x="16" y="730" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">Check the spine and page</text>
<text x="16" y="759" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">edges under normal gallery</text>
<text x="16" y="788" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">lighting. Keep the folio</text>
<text x="16" y="817" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">supported on the supplied</text>
<text x="16" y="846" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">cradle. Record the visible</text>
<text x="16" y="875" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">condition without opening</text>
<text x="16" y="904" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">sections that the collection</text>
<text x="16" y="933" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">team has marked as</text>
<text x="16" y="962" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">restricted.</text>
<rect x="16" y="985" width="288" height="48" rx="10" fill="#2A1D36" stroke="#634E75"/>
<text x="28" y="1018.0" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#EADDF6">Stable</text>
<rect x="16" y="1041" width="288" height="48" rx="10" fill="#2A1D36" stroke="#D5B6F5"/>
<text x="28" y="1074.0" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#EADDF6">Needs care</text>
<rect x="296" y="1045" width="4" height="4" rx="2" fill="#D5B6F5" stroke="#D5B6F5"/>
<text x="16" y="1127" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#EADDF6">Care category</text>
<rect x="16" y="1142" width="288" height="48" rx="10" fill="#2A1D36" stroke="#D5B6F5"/>
<text x="28" y="1175.0" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#EADDF6">Surface</text>
<rect x="296" y="1146" width="4" height="4" rx="2" fill="#D5B6F5" stroke="#D5B6F5"/>
<rect x="16" y="1198" width="288" height="48" rx="10" fill="#2A1D36" stroke="#634E75"/>
<text x="28" y="1231.0" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#EADDF6">Structure</text>
<text x="16" y="1291" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#EADDF6">3 of 3 reviewed • 1</text>
<text x="16" y="1329" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#EADDF6">follow-up</text>
<text x="16" y="1370" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#D5B6F5">Ready to submit</text>
<rect x="16" y="1393" width="288" height="56" rx="10" fill="#D5B6F5" stroke="#634E75"/>
<text x="28" y="1434" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#1C1424">Submit review</text>
<text x="16" y="1499" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#EADDF6">Review notes</text>
<text x="16" y="1541" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">Inspect each object in the</text>
<text x="16" y="1570" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">queue and record its</text>
<text x="16" y="1599" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">condition before submitting</text>
<text x="16" y="1628" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">the review. Stable means no</text>
<text x="16" y="1657" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">follow-up category is needed.</text>
<text x="16" y="1686" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">Needs care requires a</text>
<text x="16" y="1715" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">category so that the collection</text>
<text x="16" y="1744" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">team can direct the object to</text>
<text x="16" y="1773" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">the appropriate conservator.</text>
<text x="16" y="1818" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">Surface care covers visible</text>
<text x="16" y="1847" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">finish and surface concerns;</text>
<text x="16" y="1876" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">structure covers the support</text>
<text x="16" y="1905" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">or physical assembly. This</text>
<text x="16" y="1934" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">review records a routing</text>
<text x="16" y="1963" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">category only. It does not</text>
<text x="16" y="1992" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">prescribe a treatment,</text>
<text x="16" y="2021" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">authorize cleaning or replace</text>
<text x="16" y="2050" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">inspection by the collection’s</text>
<text x="16" y="2079" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">conservation staff.</text>
<text x="16" y="2124" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">Moving between queue rows</text>
<text x="16" y="2153" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">keeps decisions already</text>
<text x="16" y="2182" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">entered for other objects.</text>
<text x="16" y="2211" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">Read-only objects show their</text>
<text x="16" y="2240" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">supplied condition and cannot</text>
<text x="16" y="2269" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">be edited. An optional object</text>
<text x="16" y="2298" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">may remain pending; every</text>
<text x="16" y="2327" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">required object must have a</text>
<text x="16" y="2356" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">complete decision before</text>
<text x="16" y="2385" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">submission is enabled.</text>
<text x="16" y="2430" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">A new review request</text>
<text x="16" y="2459" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">replaces all local decisions</text>
<text x="16" y="2488" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">and focuses the caller’s</text>
<text x="16" y="2517" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">requested object, or the first</text>
<text x="16" y="2546" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">object when that identifier is</text>
<text x="16" y="2575" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">unknown. The summary</text>
<text x="16" y="2604" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">always counts the current</text>
<text x="16" y="2633" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">complete decisions and care</text>
<text x="16" y="2662" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">follow-ups across the entire</text>
<text x="16" y="2691" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">queue, including objects</text>
<text x="16" y="2720" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#C8B5D9">outside the inspector.</text>
</svg>