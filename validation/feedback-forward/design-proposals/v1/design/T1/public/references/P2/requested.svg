<svg xmlns="http://www.w3.org/2000/svg" width="280" height="3120" viewBox="0 0 280 3120">
<title>Cold-storage transfer release — P2 — requested</title>
<desc>Independent design reference. Font metrics and full height are illustrative, not native measurements.</desc>
<rect width="280" height="3120" fill="#F4F6FA"/>
<rect x="24" y="32" width="232" height="3056" fill="#FFFFFF"/>
<rect x="40" y="48" width="6" height="40" fill="#172B4D"/>
<text x="40" y="128.6" font-family="sans-serif" font-size="28.6" font-weight="bold" fill="#172B4D" text-anchor="start">Evening</text>
<text x="40" y="167.6" font-family="sans-serif" font-size="28.6" font-weight="bold" fill="#172B4D" text-anchor="start">transfer for the</text>
<text x="40" y="206.6" font-family="sans-serif" font-size="28.6" font-weight="bold" fill="#172B4D" text-anchor="start">coastal</text>
<text x="40" y="245.6" font-family="sans-serif" font-size="28.6" font-weight="bold" fill="#172B4D" text-anchor="start">laboratory</text>
<text x="40" y="288.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Coastal rack F / bay 2 ·</text>
<text x="40" y="316.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">-22 to -16 °C</text>
<rect x="40" y="336" width="200" height="60" fill="#DDEBFF"/>
<text x="56" y="372.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Release requested</text>
<text x="40" y="434.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Hide handling</text>
<text x="40" y="476.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Check the coastal</text>
<text x="40" y="506.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">manifest</text>
<text x="40" y="546.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Match the seal</text>
<text x="40" y="574.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">number to the coastal</text>
<text x="40" y="602.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">manifest before</text>
<text x="40" y="630.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">moving the crate.</text>
<text x="40" y="658.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Keep a damaged seal</text>
<text x="40" y="686.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">in the current freezer</text>
<text x="40" y="714.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">and call the receiving</text>
<text x="40" y="742.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">technician.</text>
<text x="40" y="788.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Prepare the shelf</text>
<text x="40" y="828.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Clear the coastal</text>
<text x="40" y="856.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">receiving shelf and</text>
<text x="40" y="884.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">put its tray within</text>
<text x="40" y="912.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">reach. Leave other</text>
<text x="40" y="940.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">specimens in their</text>
<text x="40" y="968.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">labeled</text>
<text x="40" y="996.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">compartments while</text>
<text x="40" y="1024.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">the new crate is being</text>
<text x="40" y="1052.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">placed.</text>
<text x="40" y="1098.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Keep the lid closed</text>
<text x="40" y="1138.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Carry the crate with its</text>
<text x="40" y="1166.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">insulated lid latched.</text>
<text x="40" y="1194.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Open it inside the</text>
<text x="40" y="1222.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">receiving cold room</text>
<text x="40" y="1250.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">after the technician</text>
<text x="40" y="1278.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">checks the destination</text>
<text x="40" y="1306.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">and prepares the</text>
<text x="40" y="1334.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">logger.</text>
<text x="40" y="1380.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Follow the indoor</text>
<text x="40" y="1410.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">route</text>
<text x="40" y="1450.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Use the marked indoor</text>
<text x="40" y="1478.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">corridor. Ask a</text>
<text x="40" y="1506.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">colleague to hold the</text>
<text x="40" y="1534.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">internal door so the</text>
<text x="40" y="1562.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">crate does not wait</text>
<text x="40" y="1590.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">beside an exterior</text>
<text x="40" y="1618.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">entrance.</text>
<text x="40" y="1664.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Read the logger</text>
<text x="40" y="1704.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Read the logger with</text>
<text x="40" y="1732.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">its probe still in the</text>
<text x="40" y="1760.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">packing sleeve.</text>
<text x="40" y="1788.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Record the displayed</text>
<text x="40" y="1816.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">temperature and</text>
<text x="40" y="1844.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">arrival time on the</text>
<text x="40" y="1872.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">manifest before</text>
<text x="40" y="1900.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">replacing the lid.</text>
<text x="40" y="1946.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Separate suspect</text>
<text x="40" y="1976.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">containers</text>
<text x="40" y="2016.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Put a container with a</text>
<text x="40" y="2044.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">loose cap or</text>
<text x="40" y="2072.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">damaged label in the</text>
<text x="40" y="2100.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">secondary tray. Ask</text>
<text x="40" y="2128.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">the technician to verify</text>
<text x="40" y="2156.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">its identity before</text>
<text x="40" y="2184.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">writing a replacement</text>
<text x="40" y="2212.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">label.</text>
<text x="40" y="2258.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Confirm the</text>
<text x="40" y="2288.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">handoff</text>
<text x="40" y="2328.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Wait for the technician</text>
<text x="40" y="2356.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">to acknowledge the</text>
<text x="40" y="2384.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">crate identifier. This</text>
<text x="40" y="2412.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">app records the</text>
<text x="40" y="2440.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">release request; the</text>
<text x="40" y="2468.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">receiving team</text>
<text x="40" y="2496.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">completes its</text>
<text x="40" y="2524.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">separate physical</text>
<text x="40" y="2552.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">inventory and</text>
<text x="40" y="2580.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">signature.</text>
<text x="40" y="2626.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Leave the</text>
<text x="40" y="2656.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">paperwork</text>
<text x="40" y="2696.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Place the signed</text>
<text x="40" y="2724.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">manifest in the</text>
<text x="40" y="2752.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">cold-room sleeve.</text>
<text x="40" y="2780.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Keep the crate</text>
<text x="40" y="2808.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">identifier facing the</text>
<text x="40" y="2836.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">aisle so the next shift</text>
<text x="40" y="2864.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">can find the</text>
<text x="40" y="2892.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">specimens and their</text>
<text x="40" y="2920.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">record.</text>
<text x="40" y="2966.1" font-family="sans-serif" font-size="22.1" font-weight="normal" fill="#172B4D" text-anchor="start">[x] Seal check</text>
<text x="40" y="2996.1" font-family="sans-serif" font-size="22.1" font-weight="normal" fill="#172B4D" text-anchor="start">confirmed</text>
<rect x="40" y="3016" width="200" height="56" fill="#D8DEE8"/>
<text x="140.0" y="3050" font-family="sans-serif" font-size="17" font-weight="bold" fill="#172B4D" text-anchor="middle">Requested</text>
</svg>
