<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1916" viewBox="0 0 400 1916">
<title>Cold-storage transfer release — H1 — requested</title>
<desc>Independent design reference. Font metrics and full height are illustrative, not native measurements.</desc>
<rect width="400" height="1916" fill="#F4F6FA"/>
<rect x="24" y="32" width="352" height="1852" fill="#FFFFFF"/>
<rect x="40" y="48" width="6" height="40" fill="#172B4D"/>
<text x="360" y="122.0" font-family="sans-serif" font-size="22.0" font-weight="bold" fill="#172B4D" text-anchor="end">Transfer for the high-altitude</text>
<text x="360" y="152.0" font-family="sans-serif" font-size="22.0" font-weight="bold" fill="#172B4D" text-anchor="end">seed bank</text>
<text x="360" y="188.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">Reserve rack C / bay 7 · -24 to -18 °C</text>
<rect x="40" y="206" width="320" height="56" fill="#DDEBFF"/>
<text x="344" y="237.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Release requested</text>
<text x="360" y="295.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Hide handling</text>
<text x="360" y="330.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Prepare the remote inventory</text>
<text x="360" y="364.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">Match the seed-lot labels to the receiving</text>
<text x="360" y="386.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">inventory before leaving the staging room.</text>
<text x="360" y="408.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">The island store uses separate racks for</text>
<text x="360" y="430.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">active conservation material and long-term</text>
<text x="360" y="452.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">reserve lots; verify the rack designation with</text>
<text x="360" y="474.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">the receiving keeper.</text>
<text x="360" y="513.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Check the padded carrier</text>
<text x="360" y="547.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">Inspect the carrier corners and the insulated</text>
<text x="360" y="569.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">insert while the lid remains closed. Replace</text>
<text x="360" y="591.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">a wet or torn outer sleeve before departure,</text>
<text x="360" y="613.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">and keep the original transit label attached</text>
<text x="360" y="635.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">until the receiving keeper has accepted the</text>
<text x="360" y="657.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">carrier.</text>
<text x="360" y="696.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Protect the accession tags</text>
<text x="360" y="730.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">Keep the paper accession tags inside their</text>
<text x="360" y="752.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">clear sleeves throughout the transfer.</text>
<text x="360" y="774.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">Condensation can soften an exposed tag</text>
<text x="360" y="796.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">quickly, so use the printed lot number rather</text>
<text x="360" y="818.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">than handwriting a replacement from a</text>
<text x="360" y="840.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">partly visible label.</text>
<text x="360" y="879.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Coordinate the doorway</text>
<text x="360" y="913.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">Arrange for a second staff member to open</text>
<text x="360" y="935.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">the cold-room door before the carrier</text>
<text x="360" y="957.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">arrives. Set the carrier on the designated</text>
<text x="360" y="979.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">bench instead of on the floor while the</text>
<text x="360" y="1001.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">receiving keeper confirms the available</text>
<text x="360" y="1023.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">shelf space.</text>
<text x="360" y="1062.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Verify the receiving tray</text>
<text x="360" y="1096.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">Use the tray reserved for the listed</text>
<text x="360" y="1118.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">accession group and check that its divider</text>
<text x="360" y="1140.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">labels remain legible. A spare tray must be</text>
<text x="360" y="1162.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">entered in the inventory before any</text>
<text x="360" y="1184.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">individual containers are moved out of the</text>
<text x="360" y="1206.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">carrier.</text>
<text x="360" y="1245.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Note an unusual reading</text>
<text x="360" y="1279.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">If the logger shows an unusual reading,</text>
<text x="360" y="1301.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">leave the probe and packing in place.</text>
<text x="360" y="1323.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">Record what the display actually shows and</text>
<text x="360" y="1345.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">contact the conservation lead before</text>
<text x="360" y="1367.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">deciding whether the lot can join the normal</text>
<text x="360" y="1389.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">reserve inventory.</text>
<text x="360" y="1428.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Complete the keeper handoff</text>
<text x="360" y="1462.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">Wait for the keeper to repeat the carrier</text>
<text x="360" y="1484.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">identifier and the destination rack. This</text>
<text x="360" y="1506.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">request records the sender decision, while</text>
<text x="360" y="1528.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">the receiving team independently signs its</text>
<text x="360" y="1550.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">inventory record after checking the physical</text>
<text x="360" y="1572.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">contents of the carrier.</text>
<text x="360" y="1611.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Leave the transfer record</text>
<text x="360" y="1645.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">Place the completed transfer record in the</text>
<text x="360" y="1667.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">receiving rack sleeve with the carrier</text>
<text x="360" y="1689.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">identifier facing outward. Let the next shift</text>
<text x="360" y="1711.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">know where the reserve lot was placed so</text>
<text x="360" y="1733.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">that its first scheduled inspection can</text>
<text x="360" y="1755.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">proceed without searching.</text>
<text x="360" y="1794.0" font-family="sans-serif" font-size="17.0" font-weight="normal" fill="#172B4D" text-anchor="end">[x] Seal check confirmed</text>
<rect x="40" y="1812" width="320" height="56" fill="#D8DEE8"/>
<text x="200.0" y="1846" font-family="sans-serif" font-size="17" font-weight="bold" fill="#172B4D" text-anchor="middle">Requested</text>
</svg>
