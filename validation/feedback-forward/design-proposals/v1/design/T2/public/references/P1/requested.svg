<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1916" viewBox="0 0 400 1916">
<title>Museum audio-tour offline download — P1 — requested</title>
<desc>Independent design reference. Font metrics and full height are illustrative, not native measurements.</desc>
<rect width="400" height="1916" fill="#F4F6FA"/>
<rect x="24" y="32" width="352" height="1852" fill="#FFFFFF"/>
<rect x="40" y="48" width="6" height="40" fill="#172B4D"/>
<text x="40" y="122.0" font-family="sans-serif" font-size="22.0" font-weight="bold" fill="#172B4D" text-anchor="start">Harbor museum: voices of the</text>
<text x="40" y="152.0" font-family="sans-serif" font-size="22.0" font-weight="bold" fill="#172B4D" text-anchor="start">working port</text>
<text x="40" y="188.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">English · harbor collection · 128 MB</text>
<rect x="40" y="206" width="320" height="56" fill="#DDEBFF"/>
<text x="56" y="237.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="start">Download requested</text>
<text x="40" y="295.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="start">Hide chapters</text>
<text x="40" y="330.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="start">At the harbor gate</text>
<text x="40" y="364.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">Begin beside the old harbor gate and listen</text>
<text x="40" y="386.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">for the bell that once announced a vessel</text>
<text x="40" y="408.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">arriving at the quay. The introduction</text>
<text x="40" y="430.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">describes how workers coordinated a busy</text>
<text x="40" y="452.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">waterfront before radios became part of</text>
<text x="40" y="474.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">everyday port life.</text>
<text x="40" y="513.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="start">The rope makers</text>
<text x="40" y="547.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">Walk toward the long rope-making bench</text>
<text x="40" y="569.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">and compare the tools displayed above it.</text>
<text x="40" y="591.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">This chapter follows a small team preparing</text>
<text x="40" y="613.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">a heavy line, with pauses that let you</text>
<text x="40" y="635.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">examine the fibers and the worn wooden</text>
<text x="40" y="657.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">handles nearby.</text>
<text x="40" y="696.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="start">A shipwright workshop</text>
<text x="40" y="730.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">Stand beside the half-built hull and look</text>
<text x="40" y="752.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">along the curve of its ribs. The shipwright</text>
<text x="40" y="774.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">describes choosing timber, checking a</text>
<text x="40" y="796.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">joint, and teaching an apprentice to notice</text>
<text x="40" y="818.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">a small gap before the outer planks were</text>
<text x="40" y="840.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">fitted.</text>
<text x="40" y="879.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="start">Work at the fish market</text>
<text x="40" y="913.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">The market gallery brings together sellers,</text>
<text x="40" y="935.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">carriers, and the people who repaired</text>
<text x="40" y="957.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">baskets at the end of the day. Listen beside</text>
<text x="40" y="979.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">the weighing table, then look for the chalk</text>
<text x="40" y="1001.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">price board before continuing into the next</text>
<text x="40" y="1023.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">room.</text>
<text x="40" y="1062.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="start">Signals across the water</text>
<text x="40" y="1096.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">At the signal cabinet, the narrator explains</text>
<text x="40" y="1118.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">why a clear message mattered in poor</text>
<text x="40" y="1140.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">weather. Short examples describe the flags</text>
<text x="40" y="1162.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">and lamps without requiring you to identify</text>
<text x="40" y="1184.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">every symbol, so you can listen while</text>
<text x="40" y="1206.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">examining the original equipment.</text>
<text x="40" y="1245.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="start">The engine room</text>
<text x="40" y="1279.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">Pause near the engine model and follow the</text>
<text x="40" y="1301.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">route from the boiler to the propeller shaft.</text>
<text x="40" y="1323.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">A mechanic recalls the rhythm of routine</text>
<text x="40" y="1345.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">checks and explains how the crew</text>
<text x="40" y="1367.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">recognized a change in the sound of a</text>
<text x="40" y="1389.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">working engine.</text>
<text x="40" y="1428.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="start">Letters from the voyage</text>
<text x="40" y="1462.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">The writing desk holds copies of letters</text>
<text x="40" y="1484.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">sent home during long trips. This chapter</text>
<text x="40" y="1506.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">reads brief passages about ordinary meals,</text>
<text x="40" y="1528.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">changing weather, and missing family, with</text>
<text x="40" y="1550.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">quiet intervals that give you time to inspect</text>
<text x="40" y="1572.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">the handwriting on display.</text>
<text x="40" y="1611.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="start">A changing waterfront</text>
<text x="40" y="1645.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">Finish at the large window overlooking the</text>
<text x="40" y="1667.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">present harbor. The final voices discuss new</text>
<text x="40" y="1689.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">jobs and familiar landmarks, inviting you to</text>
<text x="40" y="1711.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">compare the view outside with the</text>
<text x="40" y="1733.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">historical photographs on the adjacent wall</text>
<text x="40" y="1755.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">before you leave the gallery.</text>
<text x="40" y="1794.0" font-family="sans-serif" font-size="17.0" font-weight="normal" fill="#172B4D" text-anchor="start">[ ] Wi-Fi only</text>
<rect x="40" y="1812" width="320" height="56" fill="#D8DEE8"/>
<text x="200.0" y="1846" font-family="sans-serif" font-size="17" font-weight="bold" fill="#172B4D" text-anchor="middle">Requested</text>
</svg>
