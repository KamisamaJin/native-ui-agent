<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1916" viewBox="0 0 400 1916">
<title>Museum audio-tour offline download — H1 — requested</title>
<desc>Independent design reference. Font metrics and full height are illustrative, not native measurements.</desc>
<rect width="400" height="1916" fill="#F4F6FA"/>
<rect x="24" y="32" width="352" height="1852" fill="#FFFFFF"/>
<rect x="40" y="48" width="6" height="40" fill="#172B4D"/>
<text x="360" y="122.0" font-family="sans-serif" font-size="22.0" font-weight="bold" fill="#172B4D" text-anchor="end">River instruments: stories from</text>
<text x="360" y="152.0" font-family="sans-serif" font-size="22.0" font-weight="bold" fill="#172B4D" text-anchor="end">the navigation hall</text>
<text x="360" y="188.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">English · river collection · 284 MB</text>
<rect x="40" y="206" width="320" height="56" fill="#DDEBFF"/>
<text x="344" y="237.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Download requested</text>
<text x="360" y="295.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Hide chapters</text>
<text x="360" y="330.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">A river pilots desk</text>
<text x="360" y="364.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">Start at the pilots desk and examine the</text>
<text x="360" y="386.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">folded river chart beneath its glass cover.</text>
<text x="360" y="408.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">The opening voice explains how crews</text>
<text x="360" y="430.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">planned a passage around shifting</text>
<text x="360" y="452.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">sandbanks and why a familiar route still</text>
<text x="360" y="474.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">needed careful attention on every journey.</text>
<text x="360" y="513.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Measuring the current</text>
<text x="360" y="547.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">Beside the current meter, listen to a</text>
<text x="360" y="569.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">surveyor describe taking a reading from a</text>
<text x="360" y="591.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">small boat. The account connects the</text>
<text x="360" y="613.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">instrument to a practical decision about</text>
<text x="360" y="635.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">when to leave the landing, without asking</text>
<text x="360" y="657.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">you to perform a calculation yourself.</text>
<text x="360" y="696.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">The bridge watch</text>
<text x="360" y="730.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">At the bridge model, follow the lookout</text>
<text x="360" y="752.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">route from one side of the deck to the other.</text>
<text x="360" y="774.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">A retired crew member recalls watching for</text>
<text x="360" y="796.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">a low marker while another person kept</text>
<text x="360" y="818.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">track of the approaching bend in the river.</text>
<text x="360" y="857.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Soundings in shallow water</text>
<text x="360" y="891.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">The sounding line display introduces a job</text>
<text x="360" y="913.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">that required patience and clear spoken</text>
<text x="360" y="935.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">signals. Listen while looking at the marked</text>
<text x="360" y="957.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">lengths on the rope, then compare the</text>
<text x="360" y="979.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">working line with the later mechanical</text>
<text x="360" y="1001.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">instrument in the neighboring case.</text>
<text x="360" y="1040.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Keeping a voyage log</text>
<text x="360" y="1074.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">Pause at the open logbook and notice the</text>
<text x="360" y="1096.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">short entries written beside each date. This</text>
<text x="360" y="1118.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">chapter explains how observations about</text>
<text x="360" y="1140.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">weather, repairs, and waiting at a landing</text>
<text x="360" y="1162.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">could help the next crew prepare for the</text>
<text x="360" y="1184.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">same stretch of river.</text>
<text x="360" y="1223.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Repairing a navigation lamp</text>
<text x="360" y="1257.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">The lamp bench shows the small parts a</text>
<text x="360" y="1279.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">keeper carried when a light failed. The</text>
<text x="360" y="1301.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">narrator follows one routine repair and</text>
<text x="360" y="1323.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">describes checking the beam from the</text>
<text x="360" y="1345.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">water, where an apparently bright lamp</text>
<text x="360" y="1367.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">might still be difficult to recognize.</text>
<text x="360" y="1406.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Voices at the crossing</text>
<text x="360" y="1440.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">Listen near the ferry photograph to hear</text>
<text x="360" y="1462.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">three short memories of the crossing. Each</text>
<text x="360" y="1484.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">speaker describes a different task, and the</text>
<text x="360" y="1506.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">pauses between their accounts leave time</text>
<text x="360" y="1528.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">to compare the landing shown in the image</text>
<text x="360" y="1550.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">with the route map.</text>
<text x="360" y="1589.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Reading the river today</text>
<text x="360" y="1623.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">End beside the modern river map and find</text>
<text x="360" y="1645.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">the old crossing on its edge. The closing</text>
<text x="360" y="1667.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">chapter describes which habits of</text>
<text x="360" y="1689.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">observation remain useful, even when the</text>
<text x="360" y="1711.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">crew also carries electronic charts and</text>
<text x="360" y="1733.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">receives regular messages from the shore</text>
<text x="360" y="1755.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">station.</text>
<text x="360" y="1794.0" font-family="sans-serif" font-size="17.0" font-weight="normal" fill="#172B4D" text-anchor="end">[ ] Wi-Fi only</text>
<rect x="40" y="1812" width="320" height="56" fill="#D8DEE8"/>
<text x="200.0" y="1846" font-family="sans-serif" font-size="17" font-weight="bold" fill="#172B4D" text-anchor="middle">Requested</text>
</svg>
