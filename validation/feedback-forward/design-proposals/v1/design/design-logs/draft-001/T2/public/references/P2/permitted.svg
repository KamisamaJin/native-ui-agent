<svg xmlns="http://www.w3.org/2000/svg" width="280" height="3930" viewBox="0 0 280 3930">
<title>Museum audio-tour offline download — P2 — permitted</title>
<desc>Independent design reference. Font metrics and full height are illustrative, not native measurements.</desc>
<rect width="280" height="3930" fill="#F4F6FA"/>
<rect x="24" y="32" width="232" height="3866" fill="#FFFFFF"/>
<rect x="40" y="48" width="6" height="40" fill="#172B4D"/>
<text x="40" y="128.6" font-family="sans-serif" font-size="28.6" font-weight="bold" fill="#172B4D" text-anchor="start">The sound of</text>
<text x="40" y="167.6" font-family="sans-serif" font-size="28.6" font-weight="bold" fill="#172B4D" text-anchor="start">craft: a walk</text>
<text x="40" y="206.6" font-family="sans-serif" font-size="28.6" font-weight="bold" fill="#172B4D" text-anchor="start">through the</text>
<text x="40" y="245.6" font-family="sans-serif" font-size="28.6" font-weight="bold" fill="#172B4D" text-anchor="start">textile galleries</text>
<text x="40" y="288.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">English · textile</text>
<text x="40" y="316.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">collection · 196 MB</text>
<rect x="40" y="336" width="200" height="60" fill="#DDF4EC"/>
<text x="56" y="372.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Ready to download</text>
<text x="40" y="434.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Hide chapters</text>
<text x="40" y="476.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">At the harbor gate</text>
<text x="40" y="516.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Begin beside the old</text>
<text x="40" y="544.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">harbor gate and listen</text>
<text x="40" y="572.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">for the bell that once</text>
<text x="40" y="600.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">announced a vessel</text>
<text x="40" y="628.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">arriving at the quay.</text>
<text x="40" y="656.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">The introduction</text>
<text x="40" y="684.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">describes how</text>
<text x="40" y="712.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">workers coordinated a</text>
<text x="40" y="740.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">busy waterfront</text>
<text x="40" y="768.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">before radios became</text>
<text x="40" y="796.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">part of everyday port</text>
<text x="40" y="824.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">life.</text>
<text x="40" y="870.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">The rope makers</text>
<text x="40" y="910.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Walk toward the long</text>
<text x="40" y="938.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">rope-making bench</text>
<text x="40" y="966.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">and compare the</text>
<text x="40" y="994.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">tools displayed above</text>
<text x="40" y="1022.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">it. This chapter follows</text>
<text x="40" y="1050.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">a small team</text>
<text x="40" y="1078.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">preparing a heavy line,</text>
<text x="40" y="1106.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">with pauses that let</text>
<text x="40" y="1134.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">you examine the fibers</text>
<text x="40" y="1162.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">and the worn wooden</text>
<text x="40" y="1190.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">handles nearby.</text>
<text x="40" y="1236.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">A shipwright</text>
<text x="40" y="1266.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">workshop</text>
<text x="40" y="1306.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Stand beside the</text>
<text x="40" y="1334.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">half-built hull and look</text>
<text x="40" y="1362.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">along the curve of its</text>
<text x="40" y="1390.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">ribs. The shipwright</text>
<text x="40" y="1418.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">describes choosing</text>
<text x="40" y="1446.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">timber, checking a</text>
<text x="40" y="1474.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">joint, and teaching an</text>
<text x="40" y="1502.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">apprentice to notice a</text>
<text x="40" y="1530.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">small gap before the</text>
<text x="40" y="1558.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">outer planks were</text>
<text x="40" y="1586.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">fitted.</text>
<text x="40" y="1632.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Work at the fish</text>
<text x="40" y="1662.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">market</text>
<text x="40" y="1702.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">The market gallery</text>
<text x="40" y="1730.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">brings together</text>
<text x="40" y="1758.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">sellers, carriers, and</text>
<text x="40" y="1786.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">the people who</text>
<text x="40" y="1814.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">repaired baskets at</text>
<text x="40" y="1842.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">the end of the day.</text>
<text x="40" y="1870.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Listen beside the</text>
<text x="40" y="1898.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">weighing table, then</text>
<text x="40" y="1926.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">look for the chalk</text>
<text x="40" y="1954.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">price board before</text>
<text x="40" y="1982.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">continuing into the</text>
<text x="40" y="2010.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">next room.</text>
<text x="40" y="2056.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Signals across the</text>
<text x="40" y="2086.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">water</text>
<text x="40" y="2126.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">At the signal cabinet,</text>
<text x="40" y="2154.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">the narrator explains</text>
<text x="40" y="2182.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">why a clear message</text>
<text x="40" y="2210.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">mattered in poor</text>
<text x="40" y="2238.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">weather. Short</text>
<text x="40" y="2266.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">examples describe the</text>
<text x="40" y="2294.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">flags and lamps</text>
<text x="40" y="2322.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">without requiring you</text>
<text x="40" y="2350.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">to identify every</text>
<text x="40" y="2378.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">symbol, so you can</text>
<text x="40" y="2406.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">listen while examining</text>
<text x="40" y="2434.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">the original</text>
<text x="40" y="2462.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">equipment.</text>
<text x="40" y="2508.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">The engine room</text>
<text x="40" y="2548.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Pause near the engine</text>
<text x="40" y="2576.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">model and follow the</text>
<text x="40" y="2604.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">route from the boiler</text>
<text x="40" y="2632.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">to the propeller shaft.</text>
<text x="40" y="2660.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">A mechanic recalls the</text>
<text x="40" y="2688.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">rhythm of routine</text>
<text x="40" y="2716.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">checks and explains</text>
<text x="40" y="2744.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">how the crew</text>
<text x="40" y="2772.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">recognized a change</text>
<text x="40" y="2800.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">in the sound of a</text>
<text x="40" y="2828.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">working engine.</text>
<text x="40" y="2874.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Letters from the</text>
<text x="40" y="2904.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">voyage</text>
<text x="40" y="2944.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">The writing desk</text>
<text x="40" y="2972.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">holds copies of letters</text>
<text x="40" y="3000.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">sent home during</text>
<text x="40" y="3028.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">long trips. This</text>
<text x="40" y="3056.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">chapter reads brief</text>
<text x="40" y="3084.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">passages about</text>
<text x="40" y="3112.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">ordinary meals,</text>
<text x="40" y="3140.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">changing weather,</text>
<text x="40" y="3168.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">and missing family,</text>
<text x="40" y="3196.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">with quiet intervals</text>
<text x="40" y="3224.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">that give you time to</text>
<text x="40" y="3252.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">inspect the</text>
<text x="40" y="3280.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">handwriting on</text>
<text x="40" y="3308.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">display.</text>
<text x="40" y="3354.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">A changing</text>
<text x="40" y="3384.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">waterfront</text>
<text x="40" y="3424.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Finish at the large</text>
<text x="40" y="3452.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">window overlooking</text>
<text x="40" y="3480.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">the present harbor.</text>
<text x="40" y="3508.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">The final voices</text>
<text x="40" y="3536.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">discuss new jobs and</text>
<text x="40" y="3564.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">familiar landmarks,</text>
<text x="40" y="3592.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">inviting you to</text>
<text x="40" y="3620.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">compare the view</text>
<text x="40" y="3648.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">outside with the</text>
<text x="40" y="3676.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">historical photographs</text>
<text x="40" y="3704.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">on the adjacent wall</text>
<text x="40" y="3732.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">before you leave the</text>
<text x="40" y="3760.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">gallery.</text>
<text x="40" y="3806.1" font-family="sans-serif" font-size="22.1" font-weight="normal" fill="#172B4D" text-anchor="start">[ ] Wi-Fi only</text>
<rect x="40" y="3826" width="200" height="56" fill="#2463C5"/>
<text x="140.0" y="3860" font-family="sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Get audio</text>
</svg>
