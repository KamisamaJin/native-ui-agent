<svg xmlns="http://www.w3.org/2000/svg" width="280" height="3796" viewBox="0 0 280 3796">
<title>Cold-storage transfer release — P2 — permitted</title>
<desc>Independent design reference. Font metrics and full height are illustrative, not native measurements.</desc>
<rect width="280" height="3796" fill="#F4F6FA"/>
<rect x="24" y="32" width="232" height="3732" fill="#FFFFFF"/>
<rect x="40" y="48" width="6" height="40" fill="#172B4D"/>
<text x="40" y="128.6" font-family="sans-serif" font-size="28.6" font-weight="bold" fill="#172B4D" text-anchor="start">Evening</text>
<text x="40" y="167.6" font-family="sans-serif" font-size="28.6" font-weight="bold" fill="#172B4D" text-anchor="start">transfer for the</text>
<text x="40" y="206.6" font-family="sans-serif" font-size="28.6" font-weight="bold" fill="#172B4D" text-anchor="start">coastal</text>
<text x="40" y="245.6" font-family="sans-serif" font-size="28.6" font-weight="bold" fill="#172B4D" text-anchor="start">laboratory</text>
<text x="40" y="288.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Coastal rack F / bay 2 ·</text>
<text x="40" y="316.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">−22 to −16 °C</text>
<rect x="40" y="336" width="200" height="60" fill="#DDF4EC"/>
<text x="56" y="372.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Ready for release</text>
<text x="40" y="434.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Hide handling</text>
<text x="40" y="476.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Check the outer</text>
<text x="40" y="506.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">seal</text>
<text x="40" y="546.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Read the seal number</text>
<text x="40" y="574.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">against the paper</text>
<text x="40" y="602.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">manifest before</text>
<text x="40" y="630.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">moving the crate. If</text>
<text x="40" y="658.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">the security strip is</text>
<text x="40" y="686.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">torn, keep the crate in</text>
<text x="40" y="714.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">its present freezer and</text>
<text x="40" y="742.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">contact the receiving</text>
<text x="40" y="770.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">technician for a</text>
<text x="40" y="798.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">replacement transfer</text>
<text x="40" y="826.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">record.</text>
<text x="40" y="872.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Prepare the</text>
<text x="40" y="902.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">receiving shelf</text>
<text x="40" y="942.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Clear the assigned</text>
<text x="40" y="970.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">shelf and place the</text>
<text x="40" y="998.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">receiving tray within</text>
<text x="40" y="1026.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">easy reach. Keep</text>
<text x="40" y="1054.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">unrelated specimens</text>
<text x="40" y="1082.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">in their labeled</text>
<text x="40" y="1110.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">compartments so that</text>
<text x="40" y="1138.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">the new crate can be</text>
<text x="40" y="1166.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">set down without</text>
<text x="40" y="1194.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">moving other active</text>
<text x="40" y="1222.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">research material.</text>
<text x="40" y="1268.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Keep the lid closed</text>
<text x="40" y="1308.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Carry the crate with its</text>
<text x="40" y="1336.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">insulated lid firmly</text>
<text x="40" y="1364.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">latched. Open it only</text>
<text x="40" y="1392.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">inside the receiving</text>
<text x="40" y="1420.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">cold room, after the</text>
<text x="40" y="1448.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">technician confirms</text>
<text x="40" y="1476.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">the destination label</text>
<text x="40" y="1504.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">and has the</text>
<text x="40" y="1532.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">temperature logger</text>
<text x="40" y="1560.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">ready for the arrival</text>
<text x="40" y="1588.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">reading.</text>
<text x="40" y="1634.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Use the protected</text>
<text x="40" y="1664.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">route</text>
<text x="40" y="1704.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Take the marked</text>
<text x="40" y="1732.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">indoor corridor</text>
<text x="40" y="1760.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">between the loading</text>
<text x="40" y="1788.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">room and the cold</text>
<text x="40" y="1816.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">store. Avoid leaving</text>
<text x="40" y="1844.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">the crate beside an</text>
<text x="40" y="1872.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">exterior doorway</text>
<text x="40" y="1900.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">while waiting for a lift;</text>
<text x="40" y="1928.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">ask a colleague to</text>
<text x="40" y="1956.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">hold the internal door</text>
<text x="40" y="1984.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">instead.</text>
<text x="40" y="2030.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Record the logger</text>
<text x="40" y="2060.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">reading</text>
<text x="40" y="2100.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">At the receiving shelf,</text>
<text x="40" y="2128.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">read the logger</text>
<text x="40" y="2156.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">without removing its</text>
<text x="40" y="2184.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">probe from the</text>
<text x="40" y="2212.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">packing sleeve. Write</text>
<text x="40" y="2240.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">the displayed value</text>
<text x="40" y="2268.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">and the time on the</text>
<text x="40" y="2296.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">manifest, then return</text>
<text x="40" y="2324.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">the logger to its</text>
<text x="40" y="2352.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">original position inside</text>
<text x="40" y="2380.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">the crate.</text>
<text x="40" y="2426.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Separate a suspect</text>
<text x="40" y="2456.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">container</text>
<text x="40" y="2496.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">If one container has a</text>
<text x="40" y="2524.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">loose cap or a</text>
<text x="40" y="2552.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">damaged label, keep</text>
<text x="40" y="2580.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">that container in the</text>
<text x="40" y="2608.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">secondary tray. Do</text>
<text x="40" y="2636.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">not relabel it from</text>
<text x="40" y="2664.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">memory. Record its</text>
<text x="40" y="2692.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">position and ask the</text>
<text x="40" y="2720.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">receiving technician to</text>
<text x="40" y="2748.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">confirm the sample</text>
<text x="40" y="2776.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">identity.</text>
<text x="40" y="2822.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Confirm the</text>
<text x="40" y="2852.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">handoff</text>
<text x="40" y="2892.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Give the receiving</text>
<text x="40" y="2920.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">technician the</text>
<text x="40" y="2948.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">manifest and wait for</text>
<text x="40" y="2976.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">a verbal</text>
<text x="40" y="3004.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">acknowledgement of</text>
<text x="40" y="3032.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">the crate identifier.</text>
<text x="40" y="3060.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">The app records a</text>
<text x="40" y="3088.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">release request only;</text>
<text x="40" y="3116.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">the receiving team still</text>
<text x="40" y="3144.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">completes its normal</text>
<text x="40" y="3172.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">physical inventory and</text>
<text x="40" y="3200.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">handoff procedure.</text>
<text x="40" y="3246.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Store the</text>
<text x="40" y="3276.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">paperwork</text>
<text x="40" y="3316.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Leave the signed</text>
<text x="40" y="3344.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">manifest in the</text>
<text x="40" y="3372.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">cold-room document</text>
<text x="40" y="3400.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">sleeve after the</text>
<text x="40" y="3428.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">handoff is complete.</text>
<text x="40" y="3456.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Keep the crate</text>
<text x="40" y="3484.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">identifier visible at the</text>
<text x="40" y="3512.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">front of the shelf so</text>
<text x="40" y="3540.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">the next shift can find</text>
<text x="40" y="3568.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">both the specimens</text>
<text x="40" y="3596.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">and their record.</text>
<text x="40" y="3642.1" font-family="sans-serif" font-size="22.1" font-weight="normal" fill="#172B4D" text-anchor="start">[x] Seal check</text>
<text x="40" y="3672.1" font-family="sans-serif" font-size="22.1" font-weight="normal" fill="#172B4D" text-anchor="start">confirmed</text>
<rect x="40" y="3692" width="200" height="56" fill="#2463C5"/>
<text x="140.0" y="3726" font-family="sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Release transfer</text>
</svg>
