<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1879" viewBox="0 0 400 1879">
<title>Cold-storage transfer release — P1 — permitted</title>
<desc>Independent static design illustration; no native font or frame measurement is claimed.</desc>
<rect width="400" height="1879" fill="#F4F6FA"/><rect x="24" y="32" width="352" height="1815" fill="#FFFFFF"/>
<rect x="40" y="48" width="6" height="40" fill="#172B4D"/>
<text x="40" y="122.0" font-family="sans-serif" font-size="22.0" font-weight="bold" fill="#172B4D" text-anchor="start">Transfer to North research</text>
<text x="40" y="152.0" font-family="sans-serif" font-size="22.0" font-weight="bold" fill="#172B4D" text-anchor="start">freezer</text>
<text x="40" y="188.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">North rack B / bay 4 · -20 to -14 °C</text>
<rect x="40" y="206" width="320" height="56" fill="#DDF4EC"/>
<text x="56" y="237.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="start">Ready for release</text>
<text x="40" y="291.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="start">Hide handling</text>
<text x="40" y="326.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="start">Check the outer seal</text>
<text x="40" y="360.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">Read the seal number against the paper</text>
<text x="40" y="382.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">manifest before moving the crate. If the</text>
<text x="40" y="404.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">security strip is torn, keep the crate in its</text>
<text x="40" y="426.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">present freezer and contact the receiving</text>
<text x="40" y="448.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">technician for a replacement transfer</text>
<text x="40" y="470.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">record.</text>
<text x="40" y="509.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="start">Prepare the receiving shelf</text>
<text x="40" y="543.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">Clear the assigned shelf and place the</text>
<text x="40" y="565.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">receiving tray within easy reach. Keep</text>
<text x="40" y="587.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">unrelated specimens in their labeled</text>
<text x="40" y="609.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">compartments so that the new crate can be</text>
<text x="40" y="631.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">set down without moving other active</text>
<text x="40" y="653.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">research material.</text>
<text x="40" y="692.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="start">Keep the lid closed</text>
<text x="40" y="726.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">Carry the crate with its insulated lid firmly</text>
<text x="40" y="748.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">latched. Open it only inside the receiving</text>
<text x="40" y="770.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">cold room, after the technician confirms the</text>
<text x="40" y="792.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">destination label and has the temperature</text>
<text x="40" y="814.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">logger ready for the arrival reading.</text>
<text x="40" y="853.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="start">Use the protected route</text>
<text x="40" y="887.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">Take the marked indoor corridor between</text>
<text x="40" y="909.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">the loading room and the cold store. Avoid</text>
<text x="40" y="931.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">leaving the crate beside an exterior</text>
<text x="40" y="953.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">doorway while waiting for a lift; ask a</text>
<text x="40" y="975.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">colleague to hold the internal door instead.</text>
<text x="40" y="1014.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="start">Record the logger reading</text>
<text x="40" y="1048.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">At the receiving shelf, read the logger</text>
<text x="40" y="1070.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">without removing its probe from the</text>
<text x="40" y="1092.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">packing sleeve. Write the displayed value</text>
<text x="40" y="1114.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">and the time on the manifest, then return</text>
<text x="40" y="1136.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">the logger to its original position inside the</text>
<text x="40" y="1158.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">crate.</text>
<text x="40" y="1197.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="start">Separate a suspect container</text>
<text x="40" y="1231.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">If one container has a loose cap or a</text>
<text x="40" y="1253.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">damaged label, keep that container in the</text>
<text x="40" y="1275.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">secondary tray. Do not relabel it from</text>
<text x="40" y="1297.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">memory. Record its position and ask the</text>
<text x="40" y="1319.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">receiving technician to confirm the sample</text>
<text x="40" y="1341.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">identity.</text>
<text x="40" y="1380.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="start">Confirm the handoff</text>
<text x="40" y="1414.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">Give the receiving technician the manifest</text>
<text x="40" y="1436.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">and wait for a verbal acknowledgement of</text>
<text x="40" y="1458.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">the crate identifier. The app records a</text>
<text x="40" y="1480.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">release request only; the receiving team still</text>
<text x="40" y="1502.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">completes its normal physical inventory and</text>
<text x="40" y="1524.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">handoff procedure.</text>
<text x="40" y="1563.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="start">Store the paperwork</text>
<text x="40" y="1597.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">Leave the signed manifest in the cold-room</text>
<text x="40" y="1619.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">document sleeve after the handoff is</text>
<text x="40" y="1641.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">complete. Keep the crate identifier visible at</text>
<text x="40" y="1663.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">the front of the shelf so the next shift can</text>
<text x="40" y="1685.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">find both the specimens and their record.</text>
<text x="40" y="1724.0" font-family="sans-serif" font-size="17.0" font-weight="normal" fill="#172B4D" text-anchor="start">[x] Seal check confirmed</text>
<rect x="40" y="1775" width="320" height="56" fill="#2463C5"/>
<text x="200.0" y="1809" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Release transfer</text>
</svg>
