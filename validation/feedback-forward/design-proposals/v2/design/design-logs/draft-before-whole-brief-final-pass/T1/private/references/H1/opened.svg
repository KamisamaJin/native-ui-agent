<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1945" viewBox="0 0 400 1945">
<title>Cold-storage transfer release — H1 — opened</title>
<desc>Independent static design illustration; no native font or frame measurement is claimed.</desc>
<rect width="400" height="1945" fill="#F4F6FA"/><rect x="24" y="32" width="352" height="1881" fill="#FFFFFF"/>
<rect x="354" y="48" width="6" height="40" fill="#172B4D"/>
<text x="360" y="122.0" font-family="sans-serif" font-size="22.0" font-weight="bold" fill="#172B4D" text-anchor="end">Transfer for the high-altitude</text>
<text x="360" y="152.0" font-family="sans-serif" font-size="22.0" font-weight="bold" fill="#172B4D" text-anchor="end">seed bank</text>
<text x="360" y="188.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">Reserve rack C / bay 7 · -24 to -18 °C</text>
<rect x="40" y="206" width="320" height="56" fill="#E9EFF8"/>
<text x="344" y="237.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Awaiting check</text>
<text x="360" y="291.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Hide handling</text>
<text x="360" y="326.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Prepare the remote inventory</text>
<text x="360" y="360.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">Match the seed-lot labels to the receiving</text>
<text x="360" y="382.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">inventory before leaving the staging room.</text>
<text x="360" y="404.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">The island store uses separate racks for</text>
<text x="360" y="426.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">active conservation material and long-term</text>
<text x="360" y="448.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">reserve lots; verify the rack designation with</text>
<text x="360" y="470.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">the receiving keeper.</text>
<text x="360" y="509.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Check the padded carrier</text>
<text x="360" y="543.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">Inspect the carrier corners and the insulated</text>
<text x="360" y="565.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">insert while the lid remains closed. Replace</text>
<text x="360" y="587.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">a wet or torn outer sleeve before departure,</text>
<text x="360" y="609.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">and keep the original transit label attached</text>
<text x="360" y="631.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">until the receiving keeper has accepted the</text>
<text x="360" y="653.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">carrier.</text>
<text x="360" y="692.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Protect the accession tags</text>
<text x="360" y="726.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">Keep the paper accession tags inside their</text>
<text x="360" y="748.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">clear sleeves throughout the transfer.</text>
<text x="360" y="770.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">Condensation can soften an exposed tag</text>
<text x="360" y="792.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">quickly, so use the printed lot number rather</text>
<text x="360" y="814.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">than handwriting a replacement from a</text>
<text x="360" y="836.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">partly visible label.</text>
<text x="360" y="875.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Coordinate the doorway</text>
<text x="360" y="909.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">Arrange for a second staff member to open</text>
<text x="360" y="931.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">the cold-room door before the carrier</text>
<text x="360" y="953.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">arrives. Set the carrier on the designated</text>
<text x="360" y="975.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">bench instead of on the floor while the</text>
<text x="360" y="997.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">receiving keeper confirms the available</text>
<text x="360" y="1019.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">shelf space.</text>
<text x="360" y="1058.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Verify the receiving tray</text>
<text x="360" y="1092.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">Use the tray reserved for the listed</text>
<text x="360" y="1114.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">accession group and check that its divider</text>
<text x="360" y="1136.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">labels remain legible. A spare tray must be</text>
<text x="360" y="1158.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">entered in the inventory before any</text>
<text x="360" y="1180.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">individual containers are moved out of the</text>
<text x="360" y="1202.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">carrier.</text>
<text x="360" y="1241.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Note an unusual reading</text>
<text x="360" y="1275.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">If the logger shows an unusual reading,</text>
<text x="360" y="1297.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">leave the probe and packing in place.</text>
<text x="360" y="1319.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">Record what the display actually shows and</text>
<text x="360" y="1341.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">contact the conservation lead before</text>
<text x="360" y="1363.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">deciding whether the lot can join the normal</text>
<text x="360" y="1385.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">reserve inventory.</text>
<text x="360" y="1424.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Complete the keeper handoff</text>
<text x="360" y="1458.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">Wait for the keeper to repeat the carrier</text>
<text x="360" y="1480.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">identifier and the destination rack. This</text>
<text x="360" y="1502.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">request records the sender decision, while</text>
<text x="360" y="1524.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">the receiving team independently signs its</text>
<text x="360" y="1546.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">inventory record after checking the physical</text>
<text x="360" y="1568.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">contents of the carrier.</text>
<text x="360" y="1607.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Leave the transfer record</text>
<text x="360" y="1641.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">Place the completed transfer record in the</text>
<text x="360" y="1663.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">receiving rack sleeve with the carrier</text>
<text x="360" y="1685.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">identifier facing outward. Let the next shift</text>
<text x="360" y="1707.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">know where the reserve lot was placed so</text>
<text x="360" y="1729.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">that its first scheduled inspection can</text>
<text x="360" y="1751.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">proceed without searching.</text>
<text x="360" y="1790.0" font-family="sans-serif" font-size="17.0" font-weight="normal" fill="#172B4D" text-anchor="end">[ ] Confirm seal checked</text>
<rect x="40" y="1841" width="320" height="56" fill="#D8DEE8"/>
<text x="200.0" y="1875" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="middle">Release transfer</text>
</svg>
