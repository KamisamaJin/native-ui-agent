<svg xmlns="http://www.w3.org/2000/svg" width="280" height="3114" viewBox="0 0 280 3114">
<title>Cold-storage transfer release — P2 — cleared</title>
<desc>Independent static design illustration; no native font or frame measurement is claimed.</desc>
<rect width="280" height="3114" fill="#F4F6FA"/><rect x="24" y="32" width="232" height="3050" fill="#FFFFFF"/>
<rect x="40" y="48" width="6" height="40" fill="#172B4D"/>
<text x="40" y="128.6" font-family="sans-serif" font-size="28.6" font-weight="bold" fill="#172B4D" text-anchor="start">Evening</text>
<text x="40" y="167.6" font-family="sans-serif" font-size="28.6" font-weight="bold" fill="#172B4D" text-anchor="start">transfer for the</text>
<text x="40" y="206.6" font-family="sans-serif" font-size="28.6" font-weight="bold" fill="#172B4D" text-anchor="start">coastal</text>
<text x="40" y="245.6" font-family="sans-serif" font-size="28.6" font-weight="bold" fill="#172B4D" text-anchor="start">laboratory</text>
<text x="40" y="288.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Coastal rack F / bay 2 ·</text>
<text x="40" y="316.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">-22 to -16 °C</text>
<rect x="40" y="336" width="200" height="58" fill="#E9EFF8"/>
<text x="56" y="372.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Awaiting check</text>
<text x="40" y="428.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Hide handling</text>
<text x="40" y="470.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Check the coastal</text>
<text x="40" y="500.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">manifest</text>
<text x="40" y="540.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Match the seal</text>
<text x="40" y="568.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">number to the coastal</text>
<text x="40" y="596.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">manifest before</text>
<text x="40" y="624.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">moving the crate.</text>
<text x="40" y="652.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Keep a damaged seal</text>
<text x="40" y="680.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">in the current freezer</text>
<text x="40" y="708.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">and call the receiving</text>
<text x="40" y="736.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">technician.</text>
<text x="40" y="782.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Prepare the shelf</text>
<text x="40" y="822.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Clear the coastal</text>
<text x="40" y="850.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">receiving shelf and</text>
<text x="40" y="878.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">put its tray within</text>
<text x="40" y="906.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">reach. Leave other</text>
<text x="40" y="934.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">specimens in their</text>
<text x="40" y="962.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">labeled</text>
<text x="40" y="990.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">compartments while</text>
<text x="40" y="1018.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">the new crate is being</text>
<text x="40" y="1046.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">placed.</text>
<text x="40" y="1092.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Keep the lid closed</text>
<text x="40" y="1132.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Carry the crate with its</text>
<text x="40" y="1160.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">insulated lid latched.</text>
<text x="40" y="1188.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Open it inside the</text>
<text x="40" y="1216.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">receiving cold room</text>
<text x="40" y="1244.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">after the technician</text>
<text x="40" y="1272.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">checks the destination</text>
<text x="40" y="1300.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">and prepares the</text>
<text x="40" y="1328.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">logger.</text>
<text x="40" y="1374.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Follow the indoor</text>
<text x="40" y="1404.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">route</text>
<text x="40" y="1444.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Use the marked indoor</text>
<text x="40" y="1472.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">corridor. Ask a</text>
<text x="40" y="1500.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">colleague to hold the</text>
<text x="40" y="1528.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">internal door so the</text>
<text x="40" y="1556.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">crate does not wait</text>
<text x="40" y="1584.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">beside an exterior</text>
<text x="40" y="1612.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">entrance.</text>
<text x="40" y="1658.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Read the logger</text>
<text x="40" y="1698.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Read the logger with</text>
<text x="40" y="1726.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">its probe still in the</text>
<text x="40" y="1754.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">packing sleeve.</text>
<text x="40" y="1782.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Record the displayed</text>
<text x="40" y="1810.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">temperature and</text>
<text x="40" y="1838.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">arrival time on the</text>
<text x="40" y="1866.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">manifest before</text>
<text x="40" y="1894.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">replacing the lid.</text>
<text x="40" y="1940.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Separate suspect</text>
<text x="40" y="1970.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">containers</text>
<text x="40" y="2010.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Put a container with a</text>
<text x="40" y="2038.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">loose cap or</text>
<text x="40" y="2066.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">damaged label in the</text>
<text x="40" y="2094.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">secondary tray. Ask</text>
<text x="40" y="2122.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">the technician to verify</text>
<text x="40" y="2150.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">its identity before</text>
<text x="40" y="2178.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">writing a replacement</text>
<text x="40" y="2206.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">label.</text>
<text x="40" y="2252.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Confirm the</text>
<text x="40" y="2282.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">handoff</text>
<text x="40" y="2322.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Wait for the technician</text>
<text x="40" y="2350.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">to acknowledge the</text>
<text x="40" y="2378.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">crate identifier. This</text>
<text x="40" y="2406.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">app records the</text>
<text x="40" y="2434.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">release request; the</text>
<text x="40" y="2462.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">receiving team</text>
<text x="40" y="2490.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">completes its</text>
<text x="40" y="2518.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">separate physical</text>
<text x="40" y="2546.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">inventory and</text>
<text x="40" y="2574.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">signature.</text>
<text x="40" y="2620.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Leave the</text>
<text x="40" y="2650.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">paperwork</text>
<text x="40" y="2690.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Place the signed</text>
<text x="40" y="2718.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">manifest in the</text>
<text x="40" y="2746.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">cold-room sleeve.</text>
<text x="40" y="2774.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Keep the crate</text>
<text x="40" y="2802.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">identifier facing the</text>
<text x="40" y="2830.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">aisle so the next shift</text>
<text x="40" y="2858.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">can find the</text>
<text x="40" y="2886.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">specimens and their</text>
<text x="40" y="2914.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">record.</text>
<text x="40" y="2960.1" font-family="sans-serif" font-size="22.1" font-weight="normal" fill="#172B4D" text-anchor="start">[ ] Confirm seal</text>
<text x="40" y="2990.1" font-family="sans-serif" font-size="22.1" font-weight="normal" fill="#172B4D" text-anchor="start">checked</text>
<rect x="40" y="3010" width="200" height="56" fill="#D8DEE8"/>
<text x="140.0" y="3044" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="middle">Release transfer</text>
</svg>
