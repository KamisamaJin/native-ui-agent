<svg xmlns="http://www.w3.org/2000/svg" width="280" height="3144" viewBox="0 0 280 3144">
<title>Cold-storage transfer release — P2 — restored</title>
<desc>Independent static design illustration; no native font or frame measurement is claimed.</desc>
<rect width="280" height="3144" fill="#F4F6FA"/><rect x="24" y="32" width="232" height="3080" fill="#FFFFFF"/>
<rect x="40" y="48" width="6" height="40" fill="#172B4D"/>
<text x="40" y="128.6" font-family="sans-serif" font-size="28.6" font-weight="bold" fill="#172B4D" text-anchor="start">Evening</text>
<text x="40" y="167.6" font-family="sans-serif" font-size="28.6" font-weight="bold" fill="#172B4D" text-anchor="start">transfer for the</text>
<text x="40" y="206.6" font-family="sans-serif" font-size="28.6" font-weight="bold" fill="#172B4D" text-anchor="start">coastal</text>
<text x="40" y="245.6" font-family="sans-serif" font-size="28.6" font-weight="bold" fill="#172B4D" text-anchor="start">laboratory</text>
<text x="40" y="288.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Coastal rack F / bay 2 ·</text>
<text x="40" y="316.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">-22 to -16 °C</text>
<rect x="40" y="336" width="200" height="88" fill="#DDF4EC"/>
<text x="56" y="372.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Ready for</text>
<text x="56" y="402.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">release</text>
<text x="40" y="458.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Hide handling</text>
<text x="40" y="500.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Check the coastal</text>
<text x="40" y="530.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">manifest</text>
<text x="40" y="570.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Match the seal</text>
<text x="40" y="598.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">number to the coastal</text>
<text x="40" y="626.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">manifest before</text>
<text x="40" y="654.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">moving the crate.</text>
<text x="40" y="682.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Keep a damaged seal</text>
<text x="40" y="710.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">in the current freezer</text>
<text x="40" y="738.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">and call the receiving</text>
<text x="40" y="766.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">technician.</text>
<text x="40" y="812.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Prepare the shelf</text>
<text x="40" y="852.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Clear the coastal</text>
<text x="40" y="880.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">receiving shelf and</text>
<text x="40" y="908.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">put its tray within</text>
<text x="40" y="936.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">reach. Leave other</text>
<text x="40" y="964.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">specimens in their</text>
<text x="40" y="992.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">labeled</text>
<text x="40" y="1020.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">compartments while</text>
<text x="40" y="1048.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">the new crate is being</text>
<text x="40" y="1076.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">placed.</text>
<text x="40" y="1122.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Keep the lid closed</text>
<text x="40" y="1162.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Carry the crate with its</text>
<text x="40" y="1190.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">insulated lid latched.</text>
<text x="40" y="1218.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Open it inside the</text>
<text x="40" y="1246.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">receiving cold room</text>
<text x="40" y="1274.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">after the technician</text>
<text x="40" y="1302.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">checks the destination</text>
<text x="40" y="1330.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">and prepares the</text>
<text x="40" y="1358.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">logger.</text>
<text x="40" y="1404.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Follow the indoor</text>
<text x="40" y="1434.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">route</text>
<text x="40" y="1474.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Use the marked indoor</text>
<text x="40" y="1502.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">corridor. Ask a</text>
<text x="40" y="1530.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">colleague to hold the</text>
<text x="40" y="1558.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">internal door so the</text>
<text x="40" y="1586.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">crate does not wait</text>
<text x="40" y="1614.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">beside an exterior</text>
<text x="40" y="1642.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">entrance.</text>
<text x="40" y="1688.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Read the logger</text>
<text x="40" y="1728.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Read the logger with</text>
<text x="40" y="1756.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">its probe still in the</text>
<text x="40" y="1784.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">packing sleeve.</text>
<text x="40" y="1812.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Record the displayed</text>
<text x="40" y="1840.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">temperature and</text>
<text x="40" y="1868.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">arrival time on the</text>
<text x="40" y="1896.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">manifest before</text>
<text x="40" y="1924.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">replacing the lid.</text>
<text x="40" y="1970.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Separate suspect</text>
<text x="40" y="2000.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">containers</text>
<text x="40" y="2040.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Put a container with a</text>
<text x="40" y="2068.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">loose cap or</text>
<text x="40" y="2096.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">damaged label in the</text>
<text x="40" y="2124.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">secondary tray. Ask</text>
<text x="40" y="2152.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">the technician to verify</text>
<text x="40" y="2180.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">its identity before</text>
<text x="40" y="2208.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">writing a replacement</text>
<text x="40" y="2236.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">label.</text>
<text x="40" y="2282.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Confirm the</text>
<text x="40" y="2312.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">handoff</text>
<text x="40" y="2352.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Wait for the technician</text>
<text x="40" y="2380.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">to acknowledge the</text>
<text x="40" y="2408.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">crate identifier. This</text>
<text x="40" y="2436.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">app records the</text>
<text x="40" y="2464.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">release request; the</text>
<text x="40" y="2492.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">receiving team</text>
<text x="40" y="2520.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">completes its</text>
<text x="40" y="2548.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">separate physical</text>
<text x="40" y="2576.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">inventory and</text>
<text x="40" y="2604.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">signature.</text>
<text x="40" y="2650.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">Leave the</text>
<text x="40" y="2680.1" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#172B4D" text-anchor="start">paperwork</text>
<text x="40" y="2720.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Place the signed</text>
<text x="40" y="2748.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">manifest in the</text>
<text x="40" y="2776.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">cold-room sleeve.</text>
<text x="40" y="2804.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">Keep the crate</text>
<text x="40" y="2832.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">identifier facing the</text>
<text x="40" y="2860.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">aisle so the next shift</text>
<text x="40" y="2888.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">can find the</text>
<text x="40" y="2916.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">specimens and their</text>
<text x="40" y="2944.8" font-family="sans-serif" font-size="20.8" font-weight="normal" fill="#172B4D" text-anchor="start">record.</text>
<text x="40" y="2990.1" font-family="sans-serif" font-size="22.1" font-weight="normal" fill="#172B4D" text-anchor="start">[x] Seal check</text>
<text x="40" y="3020.1" font-family="sans-serif" font-size="22.1" font-weight="normal" fill="#172B4D" text-anchor="start">confirmed</text>
<rect x="40" y="3040" width="200" height="56" fill="#2463C5"/>
<text x="140.0" y="3074" font-family="sans-serif" font-size="22.1" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Release transfer</text>
</svg>
