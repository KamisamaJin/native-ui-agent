<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1945" viewBox="0 0 400 1945">
<title>Museum audio-tour offline download — P1 — restored</title>
<desc>Independent static design illustration; no native font or frame measurement is claimed.</desc>
<rect width="400" height="1945" fill="#F4F6FA"/><rect x="24" y="32" width="352" height="1881" fill="#FFFFFF"/>
<rect x="40" y="48" width="6" height="40" fill="#172B4D"/>
<text x="40" y="122.0" font-family="sans-serif" font-size="22.0" font-weight="bold" fill="#172B4D" text-anchor="start">Harbor museum: voices of the</text>
<text x="40" y="152.0" font-family="sans-serif" font-size="22.0" font-weight="bold" fill="#172B4D" text-anchor="start">working port</text>
<text x="40" y="188.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">English · harbor collection · 128 MB</text>
<rect x="40" y="206" width="320" height="56" fill="#DDF4EC"/>
<text x="56" y="237.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="start">Ready to download</text>
<text x="40" y="291.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="start">Hide chapters</text>
<text x="40" y="326.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="start">At the harbor gate</text>
<text x="40" y="360.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">Begin beside the old harbor gate and listen</text>
<text x="40" y="382.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">for the bell that once announced a vessel</text>
<text x="40" y="404.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">arriving at the quay. The introduction</text>
<text x="40" y="426.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">describes how workers coordinated a busy</text>
<text x="40" y="448.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">waterfront before radios became part of</text>
<text x="40" y="470.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">everyday port life.</text>
<text x="40" y="509.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="start">The rope makers</text>
<text x="40" y="543.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">Walk toward the long rope-making bench</text>
<text x="40" y="565.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">and compare the tools displayed above it.</text>
<text x="40" y="587.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">This chapter follows a small team preparing</text>
<text x="40" y="609.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">a heavy line, with pauses that let you</text>
<text x="40" y="631.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">examine the fibers and the worn wooden</text>
<text x="40" y="653.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">handles nearby.</text>
<text x="40" y="692.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="start">A shipwright workshop</text>
<text x="40" y="726.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">Stand beside the half-built hull and look</text>
<text x="40" y="748.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">along the curve of its ribs. The shipwright</text>
<text x="40" y="770.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">describes choosing timber, checking a</text>
<text x="40" y="792.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">joint, and teaching an apprentice to notice</text>
<text x="40" y="814.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">a small gap before the outer planks were</text>
<text x="40" y="836.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">fitted.</text>
<text x="40" y="875.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="start">Work at the fish market</text>
<text x="40" y="909.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">The market gallery brings together sellers,</text>
<text x="40" y="931.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">carriers, and the people who repaired</text>
<text x="40" y="953.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">baskets at the end of the day. Listen beside</text>
<text x="40" y="975.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">the weighing table, then look for the chalk</text>
<text x="40" y="997.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">price board before continuing into the next</text>
<text x="40" y="1019.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">room.</text>
<text x="40" y="1058.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="start">Signals across the water</text>
<text x="40" y="1092.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">At the signal cabinet, the narrator explains</text>
<text x="40" y="1114.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">why a clear message mattered in poor</text>
<text x="40" y="1136.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">weather. Short examples describe the flags</text>
<text x="40" y="1158.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">and lamps without requiring you to identify</text>
<text x="40" y="1180.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">every symbol, so you can listen while</text>
<text x="40" y="1202.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">examining the original equipment.</text>
<text x="40" y="1241.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="start">The engine room</text>
<text x="40" y="1275.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">Pause near the engine model and follow the</text>
<text x="40" y="1297.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">route from the boiler to the propeller shaft.</text>
<text x="40" y="1319.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">A mechanic recalls the rhythm of routine</text>
<text x="40" y="1341.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">checks and explains how the crew</text>
<text x="40" y="1363.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">recognized a change in the sound of a</text>
<text x="40" y="1385.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">working engine.</text>
<text x="40" y="1424.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="start">Letters from the voyage</text>
<text x="40" y="1458.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">The writing desk holds copies of letters</text>
<text x="40" y="1480.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">sent home during long trips. This chapter</text>
<text x="40" y="1502.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">reads brief passages about ordinary meals,</text>
<text x="40" y="1524.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">changing weather, and missing family, with</text>
<text x="40" y="1546.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">quiet intervals that give you time to inspect</text>
<text x="40" y="1568.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">the handwriting on display.</text>
<text x="40" y="1607.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="start">A changing waterfront</text>
<text x="40" y="1641.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">Finish at the large window overlooking the</text>
<text x="40" y="1663.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">present harbor. The final voices discuss new</text>
<text x="40" y="1685.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">jobs and familiar landmarks, inviting you to</text>
<text x="40" y="1707.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">compare the view outside with the</text>
<text x="40" y="1729.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">historical photographs on the adjacent wall</text>
<text x="40" y="1751.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="start">before you leave the gallery.</text>
<text x="40" y="1790.0" font-family="sans-serif" font-size="17.0" font-weight="normal" fill="#172B4D" text-anchor="start">[ ] Wi-Fi only</text>
<rect x="40" y="1841" width="320" height="56" fill="#2463C5"/>
<text x="200.0" y="1875" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Get audio</text>
</svg>
