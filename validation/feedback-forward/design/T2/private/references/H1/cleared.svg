<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1945" viewBox="0 0 400 1945">
<title>Museum audio-tour offline download — H1 — cleared</title>
<desc>Independent static design illustration; no native font or frame measurement is claimed.</desc>
<rect width="400" height="1945" fill="#F4F6FA"/><rect x="24" y="32" width="352" height="1881" fill="#FFFFFF"/>
<rect x="354" y="48" width="6" height="40" fill="#172B4D"/>
<text x="360" y="122.0" font-family="sans-serif" font-size="22.0" font-weight="bold" fill="#172B4D" text-anchor="end">River instruments: stories from</text>
<text x="360" y="152.0" font-family="sans-serif" font-size="22.0" font-weight="bold" fill="#172B4D" text-anchor="end">the navigation hall</text>
<text x="360" y="188.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">English · river collection · 284 MB</text>
<rect x="40" y="206" width="320" height="56" fill="#E9EFF8"/>
<text x="344" y="237.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Wi-Fi required</text>
<text x="360" y="291.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Hide chapters</text>
<text x="360" y="326.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">A river pilots desk</text>
<text x="360" y="360.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">Start at the pilots desk and examine the</text>
<text x="360" y="382.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">folded river chart beneath its glass cover.</text>
<text x="360" y="404.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">The opening voice explains how crews</text>
<text x="360" y="426.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">planned a passage around shifting</text>
<text x="360" y="448.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">sandbanks and why a familiar route still</text>
<text x="360" y="470.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">needed careful attention on every journey.</text>
<text x="360" y="509.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Measuring the current</text>
<text x="360" y="543.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">Beside the current meter, listen to a</text>
<text x="360" y="565.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">surveyor describe taking a reading from a</text>
<text x="360" y="587.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">small boat. The account connects the</text>
<text x="360" y="609.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">instrument to a practical decision about</text>
<text x="360" y="631.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">when to leave the landing, without asking</text>
<text x="360" y="653.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">you to perform a calculation yourself.</text>
<text x="360" y="692.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">The bridge watch</text>
<text x="360" y="726.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">At the bridge model, follow the lookout</text>
<text x="360" y="748.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">route from one side of the deck to the other.</text>
<text x="360" y="770.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">A retired crew member recalls watching for</text>
<text x="360" y="792.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">a low marker while another person kept</text>
<text x="360" y="814.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">track of the approaching bend in the river.</text>
<text x="360" y="853.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Soundings in shallow water</text>
<text x="360" y="887.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">The sounding line display introduces a job</text>
<text x="360" y="909.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">that required patience and clear spoken</text>
<text x="360" y="931.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">signals. Listen while looking at the marked</text>
<text x="360" y="953.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">lengths on the rope, then compare the</text>
<text x="360" y="975.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">working line with the later mechanical</text>
<text x="360" y="997.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">instrument in the neighboring case.</text>
<text x="360" y="1036.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Keeping a voyage log</text>
<text x="360" y="1070.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">Pause at the open logbook and notice the</text>
<text x="360" y="1092.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">short entries written beside each date. This</text>
<text x="360" y="1114.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">chapter explains how observations about</text>
<text x="360" y="1136.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">weather, repairs, and waiting at a landing</text>
<text x="360" y="1158.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">could help the next crew prepare for the</text>
<text x="360" y="1180.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">same stretch of river.</text>
<text x="360" y="1219.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Repairing a navigation lamp</text>
<text x="360" y="1253.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">The lamp bench shows the small parts a</text>
<text x="360" y="1275.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">keeper carried when a light failed. The</text>
<text x="360" y="1297.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">narrator follows one routine repair and</text>
<text x="360" y="1319.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">describes checking the beam from the</text>
<text x="360" y="1341.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">water, where an apparently bright lamp</text>
<text x="360" y="1363.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">might still be difficult to recognize.</text>
<text x="360" y="1402.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Voices at the crossing</text>
<text x="360" y="1436.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">Listen near the ferry photograph to hear</text>
<text x="360" y="1458.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">three short memories of the crossing. Each</text>
<text x="360" y="1480.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">speaker describes a different task, and the</text>
<text x="360" y="1502.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">pauses between their accounts leave time</text>
<text x="360" y="1524.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">to compare the landing shown in the image</text>
<text x="360" y="1546.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">with the route map.</text>
<text x="360" y="1585.0" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="end">Reading the river today</text>
<text x="360" y="1619.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">End beside the modern river map and find</text>
<text x="360" y="1641.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">the old crossing on its edge. The closing</text>
<text x="360" y="1663.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">chapter describes which habits of</text>
<text x="360" y="1685.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">observation remain useful, even when the</text>
<text x="360" y="1707.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">crew also carries electronic charts and</text>
<text x="360" y="1729.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">receives regular messages from the shore</text>
<text x="360" y="1751.0" font-family="sans-serif" font-size="16.0" font-weight="normal" fill="#172B4D" text-anchor="end">station.</text>
<text x="360" y="1790.0" font-family="sans-serif" font-size="17.0" font-weight="normal" fill="#172B4D" text-anchor="end">[x] Wi-Fi only</text>
<rect x="40" y="1841" width="320" height="56" fill="#D8DEE8"/>
<text x="200.0" y="1875" font-family="sans-serif" font-size="17.0" font-weight="bold" fill="#172B4D" text-anchor="middle">Get audio</text>
</svg>
