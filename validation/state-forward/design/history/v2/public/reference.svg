<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1060" viewBox="0 0 840 1060"><rect width="840" height="1060" fill="#E7EBF1"/><style>text{font-family:system-ui,sans-serif;fill:#14243A}.note{font-size:12px;fill:#3F5169}.body{font-size:14px}.small{font-size:12px;fill:#53657A}.bold{font-weight:600}</style><text x="24" y="28" font-size="18" font-weight="700">Print Batch Approval — preimplementation design reference</text><text x="24" y="49" class="note">Example: P1 after duplex + priority + expanded breakdown. Scroll content shown beyond 600-high viewport.</text><rect x="24" y="72" width="390" height="930" fill="#F5F7FA" stroke="#94A3B8"/><path d="M24 672H414" stroke="#B63835" stroke-dasharray="5 4"/><text x="430" y="674" class="note">600-high viewport ends here; vertical scroll reaches footer.</text><rect x="40" y="88" width="358" height="894" rx="16" fill="#FFFFFF"/><text x="56" y="124" font-size="20" font-weight="600">Print budget check</text><rect x="326" y="103" width="56" height="24" rx="12" fill="#167650" opacity=".13"/><text x="338" y="119" font-size="12" font-weight="600" fill="#167650">Ready</text><text x="56" y="155" class="small">Estimated charge</text><text x="56" y="189" font-size="28" font-weight="700">48 cr</text><text x="56" y="216" class="small">2 jobs • 21 pages • 11 sheets</text><rect x="56" y="240" width="20" height="20" rx="4" fill="#265FE4"/><path d="M60 250l4 4 8-9" fill="none" stroke="white" stroke-width="2"/><text x="88" y="253" class="body bold">Meeting agenda</text><text x="88" y="274" class="small">8 pages × 2 copies • Mono</text><text x="344" y="253" class="body">24 cr</text><path d="M56 290H382" stroke="#53657A" opacity=".25"/><rect x="56" y="314" width="20" height="20" rx="4" fill="#265FE4"/><path d="M60 324l4 4 8-9" fill="none" stroke="white" stroke-width="2"/><text x="88" y="327" class="body bold">Color cover</text><text x="88" y="348" class="small">5 pages × 1 copies • Color</text><text x="344" y="327" class="body">18 cr</text><path d="M56 364H382" stroke="#53657A" opacity=".25"/><rect x="56" y="388" width="20" height="20" rx="4" fill="none" stroke="#53657A"/><text x="88" y="401" class="body bold">Desk notes</text><text x="88" y="422" class="small">3 pages × 1 copies • Mono</text><text x="352" y="401" class="body">5 cr</text><text x="56" y="458" class="body bold">Paper mode</text><rect x="56" y="470" width="326" height="48" rx="10" fill="#F5F7FA"/><text x="74" y="499" class="body">Single-sided</text><rect x="219" y="470" width="163" height="48" rx="10" fill="#265FE4"/><text x="273" y="499" class="body" style="fill:white">Duplex</text><text x="56" y="557" class="body bold">Priority handling</text><rect x="334" y="538" width="48" height="28" rx="14" fill="#265FE4"/><circle cx="368" cy="552" r="11" fill="white"/><text x="56" y="584" class="small">Adds 6 cr to this batch.</text><text x="56" y="630" class="body bold" style="fill:#265FE4">Hide cost breakdown</text><text x="56" y="673" class="small">Ink</text><text x="349" y="673" class="small">31 cr</text><text x="56" y="704" class="small">Paper</text><text x="349" y="704" class="small">11 cr</text><text x="56" y="735" class="small">Priority</text><text x="356" y="735" class="small">6 cr</text><text x="56" y="766" class="small">Total</text><text x="349" y="766" class="small">48 cr</text><text x="56" y="814" class="body bold">Balance after approval: 12 cr</text><rect x="56" y="838" width="326" height="48" rx="10" fill="#265FE4"/><text x="127" y="867" class="body bold" style="fill:white">Approve 2 jobs · 48 cr</text><text x="440" y="116" class="note">390 host / 358 card; host outside inset 16.</text><text x="440" y="138" class="note">320 host / 288 card. Internal inset 16.</text><text x="440" y="160" class="note">Card radius 16; section spacing 12.</text><text x="440" y="182" class="note">Row vertical padding 12; row separators muted at 25%.</text><text x="440" y="204" class="note">Native action bounds ≥48×48; approval radius 10.</text><text x="440" y="248" class="note">System sans-serif tokens, multiplied by textScale:</text><text x="440" y="270" class="note">title 20 semibold; charge 28 bold;</text><text x="440" y="292" class="note">body/controls/titles 14; helper/caption/detail 12.</text><text x="440" y="314" class="note">Control/title weight semibold; other body regular.</text><text x="440" y="336" class="note">textScale ∈ {1,1.2}; wrap and grow, never truncate.</text><text x="440" y="380" class="note">Light palette:</text><text x="440" y="402" class="note">background #F5F7FA / surface #FFFFFF</text><text x="440" y="424" class="note">text #14243A / muted #53657A / accent #265FE4</text><text x="440" y="446" class="note">ready #167650 / error #B63835</text><text x="440" y="490" class="note">Dark palette:</text><text x="440" y="512" class="note">background #10161F / surface #1B2532</text><text x="440" y="534" class="note">text #F2F5FA / muted #B7C4D5 / accent #8BB0FF</text><text x="440" y="556" class="note">ready #75D6AA / error #FF9A96</text><text x="440" y="600" class="note">RTL mirrors leading/trailing relationships and mode order.</text><text x="440" y="622" class="note">Vertical order remains; words/numbers stay readable.</text><text x="440" y="730" class="note">This fixes hierarchy, colors, dimensions and semantics.</text><text x="440" y="752" class="note">It does not fix incidental y positions or exact line wrapping.</text><text x="440" y="774" class="note">Actual long text/large text must expand without overlap.</text><text x="440" y="818" class="note">Cost example: ink31 + paper11 + priority6 = total48.</text><text x="440" y="840" class="note">Reference drawn before either implementation exists.</text></svg>