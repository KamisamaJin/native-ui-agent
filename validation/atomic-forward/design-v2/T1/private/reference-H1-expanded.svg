<svg xmlns="http://www.w3.org/2000/svg" width="280" height="2003" viewBox="0 0 280 2003"><rect width="280" height="2003" rx="12" fill="#14282D"/><text x="264.000" y="41.960" font-size="25.960" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">Book a workshop</text><text x="264.000" y="75.708" font-size="25.960" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">station</text><text x="264.000" y="114.376" font-size="18.880" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">Choose one supervised</text><text x="264.000" y="138.920" font-size="18.880" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">station and review the safety</text><text x="264.000" y="163.464" font-size="18.880" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">briefing before requesting a</text><text x="264.000" y="188.008" font-size="18.880" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">place.</text><rect x="16" y="205.672" width="248" height="105.632" rx="10" fill="#2D4245"/><text x="248.000" y="240.552" font-size="18.880" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">Supervised sessions</text><text x="248.000" y="265.096" font-size="18.880" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">only. A request does not</text><text x="248.000" y="289.640" font-size="18.880" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">confirm a place.</text><rect x="16" y="331.304" width="248" height="219.94400000000002" rx="10" fill="#31575C"/><text x="244.000" y="366.184" font-size="18.880" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">08:15 · Ceramic repair</text><text x="244.000" y="390.728" font-size="18.880" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">bench</text><text x="244.000" y="422.912" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">Bring closed shoes. Staff</text><text x="244.000" y="444.388" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">will check tool training at</text><text x="244.000" y="465.864" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">arrival. Dust extraction runs</text><text x="244.000" y="487.340" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">throughout the session; tell</text><text x="244.000" y="508.816" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">staff about any access</text><text x="244.000" y="530.292" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">needs.</text><rect x="16" y="563.248" width="248" height="134.04" rx="10" fill="#20383D"/><text x="244.000" y="598.128" font-size="18.880" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">10:45 · Optical</text><text x="244.000" y="622.672" font-size="18.880" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">instrument table</text><text x="244.000" y="654.856" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">Staff-assisted access is</text><text x="244.000" y="676.332" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">available on request.</text><rect x="16" y="709.288" width="248" height="297.44000000000005" rx="10" fill="#20383D"/><text x="244.000" y="744.168" font-size="18.880" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">13:15 · Laser safety</text><text x="244.000" y="768.712" font-size="18.880" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">induction bay ·</text><text x="244.000" y="793.256" font-size="18.880" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">Unavailable</text><text x="244.000" y="825.440" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">Training supervisor is</text><text x="244.000" y="846.916" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">unavailable for this station.</text><text x="244.000" y="878.392" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">Bring closed shoes. Staff</text><text x="244.000" y="899.868" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">will check tool training at</text><text x="244.000" y="921.344" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">arrival. Dust extraction runs</text><text x="244.000" y="942.820" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">throughout the session; tell</text><text x="244.000" y="964.296" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">staff about any access</text><text x="244.000" y="985.772" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">needs.</text><rect x="16" y="1018.7280000000001" width="248" height="134.04" rx="10" fill="#20383D"/><text x="244.000" y="1053.608" font-size="18.880" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">14:45 · Pattern cutting</text><text x="244.000" y="1078.152" font-size="18.880" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">station</text><text x="244.000" y="1110.336" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">Staff-assisted access is</text><text x="244.000" y="1131.812" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">available on request.</text><rect x="16" y="1164.768" width="248" height="219.94400000000002" rx="10" fill="#20383D"/><text x="244.000" y="1199.648" font-size="18.880" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">16:15 · Bookbinding</text><text x="244.000" y="1224.192" font-size="18.880" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">press</text><text x="244.000" y="1256.376" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">Bring closed shoes. Staff</text><text x="244.000" y="1277.852" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">will check tool training at</text><text x="244.000" y="1299.328" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">arrival. Dust extraction runs</text><text x="244.000" y="1320.804" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">throughout the session; tell</text><text x="244.000" y="1342.280" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">staff about any access</text><text x="244.000" y="1363.756" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">needs.</text><rect x="16" y="1396.712" width="248" height="134.04" rx="10" fill="#20383D"/><text x="244.000" y="1431.592" font-size="18.880" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">18:00 · Quiet</text><text x="244.000" y="1456.136" font-size="18.880" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">handwork</text><text x="244.000" y="1488.320" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">Staff-assisted access is</text><text x="244.000" y="1509.796" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">available on request.</text><text x="264.000" y="1569.632" font-size="18.880" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">Draft station: 08:15 ·</text><text x="264.000" y="1594.176" font-size="18.880" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">Ceramic repair bench</text><text x="264.000" y="1638.720" font-size="18.880" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">Hide safety briefing</text><text x="264.000" y="1675.264" font-size="18.880" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">Bring closed shoes. Staff will</text><text x="264.000" y="1699.808" font-size="18.880" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">check tool training at arrival.</text><text x="264.000" y="1724.352" font-size="18.880" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">Dust extraction runs</text><text x="264.000" y="1748.896" font-size="18.880" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">throughout the session; tell</text><text x="264.000" y="1773.440" font-size="18.880" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">staff about any access</text><text x="264.000" y="1797.984" font-size="18.880" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">needs.</text><rect x="16" y="1823.6480000000001" width="248" height="56.544" rx="10" fill="#8CC7C7"/><text x="246.000" y="1858.528" font-size="18.880" font-family="Arial, sans-serif" font-weight="600" fill="#102D30" text-anchor="end">Request station</text><text x="264.000" y="1916.712" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">Station requests are reviewed by</text><text x="264.000" y="1938.188" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">the duty maker. Your selected</text><text x="264.000" y="1959.664" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">time remains a draft until staff</text><text x="264.000" y="1981.140" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">confirm availability.</text></svg>