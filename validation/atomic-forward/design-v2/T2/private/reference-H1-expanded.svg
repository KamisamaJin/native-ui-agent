<svg xmlns="http://www.w3.org/2000/svg" width="280" height="1784" viewBox="0 0 280 1784"><rect width="280" height="1784" rx="12" fill="#14282D"/><text x="264.000" y="41.960" font-size="25.960" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">Review river sensor</text><text x="264.000" y="75.708" font-size="25.960" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">alerts</text><text x="264.000" y="114.376" font-size="18.880" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">Select one incoming alert,</text><text x="264.000" y="138.920" font-size="18.880" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">inspect its readings, and</text><text x="264.000" y="163.464" font-size="18.880" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">acknowledge it for a field</text><text x="264.000" y="188.008" font-size="18.880" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">team.</text><rect x="16" y="205.672" width="248" height="130.176" rx="10" fill="#2D4245"/><text x="248.000" y="240.552" font-size="18.880" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">Readings are advisory.</text><text x="248.000" y="265.096" font-size="18.880" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">Follow the field team</text><text x="248.000" y="289.640" font-size="18.880" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">protocol before</text><text x="248.000" y="314.184" font-size="18.880" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">intervention.</text><text x="264.000" y="374.728" font-size="18.880" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">Hide reading dossier</text><rect x="16" y="396.39199999999994" width="236" height="115.496" rx="10" fill="#31575C"/><text x="232.000" y="431.272" font-size="18.880" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">08:05 · Estuary gate</text><text x="232.000" y="455.816" font-size="18.880" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">salinity change</text><text x="232.000" y="485.640" font-size="14.160" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">WATCH</text><path d="M 259 396.39199999999994 V 523.8879999999999" stroke="#8CC7C7" stroke-width="2"/><text x="252.000" y="554.768" font-size="18.880" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">Latest sample: 07:18</text><text x="252.000" y="579.312" font-size="18.880" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">local. Compare the three</text><text x="252.000" y="603.856" font-size="18.880" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">recorded readings</text><text x="252.000" y="628.400" font-size="18.880" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">before sending a field</text><text x="252.000" y="652.944" font-size="18.880" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">crew. Maintenance-held</text><text x="252.000" y="677.488" font-size="18.880" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">alerts remain visible for</text><text x="252.000" y="702.032" font-size="18.880" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">context and cannot be</text><text x="252.000" y="726.576" font-size="18.880" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">acknowledged.</text><rect x="16" y="748.2399999999999" width="236" height="115.496" rx="10" fill="#20383D"/><text x="232.000" y="783.120" font-size="18.880" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">08:20 · Orchard drain</text><text x="232.000" y="807.664" font-size="18.880" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">battery warning</text><text x="232.000" y="837.488" font-size="14.160" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">SERVICE</text><path d="M 259 748.2399999999999 V 875.7359999999999" stroke="#8CC7C7" stroke-width="2"/><rect x="16" y="875.7359999999999" width="236" height="235.94400000000002" rx="10" fill="#20383D"/><text x="232.000" y="910.616" font-size="18.880" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">08:35 · West spillway</text><text x="232.000" y="935.160" font-size="18.880" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">maintenance hold ·</text><text x="232.000" y="959.704" font-size="18.880" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">Unavailable</text><text x="232.000" y="989.528" font-size="14.160" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">HOLD</text><text x="232.000" y="1016.296" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">Sensor is on a</text><text x="232.000" y="1037.772" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">maintenance hold; field</text><text x="232.000" y="1059.248" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">acknowledgement is</text><text x="232.000" y="1080.724" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">paused.</text><path d="M 259 875.7359999999999 V 1123.6799999999998" stroke="#8CC7C7" stroke-width="2"/><rect x="16" y="1123.6799999999998" width="236" height="115.496" rx="10" fill="#20383D"/><text x="232.000" y="1158.560" font-size="18.880" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">08:50 · Meadow ford</text><text x="232.000" y="1183.104" font-size="18.880" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">turbidity rise</text><text x="232.000" y="1212.928" font-size="14.160" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">WATCH</text><path d="M 259 1123.6799999999998 V 1251.176" stroke="#8CC7C7" stroke-width="2"/><rect x="16" y="1251.176" width="236" height="115.496" rx="10" fill="#20383D"/><text x="232.000" y="1286.056" font-size="18.880" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">09:05 · Old quay</text><text x="232.000" y="1310.600" font-size="18.880" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">temperature change</text><text x="232.000" y="1340.424" font-size="14.160" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">INFO</text><path d="M 259 1251.176 V 1378.672" stroke="#8CC7C7" stroke-width="2"/><rect x="16" y="1378.672" width="236" height="115.496" rx="10" fill="#20383D"/><text x="232.000" y="1413.552" font-size="18.880" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">09:20 · Marsh inlet</text><text x="232.000" y="1438.096" font-size="18.880" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">gauge offset</text><text x="232.000" y="1467.920" font-size="14.160" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">INFO</text><path d="M 259 1378.672 V 1506.1680000000001" stroke="#8CC7C7" stroke-width="2"/><text x="264.000" y="1533.048" font-size="18.880" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">Reviewing: 08:05 · Estuary</text><text x="264.000" y="1557.592" font-size="18.880" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">gate salinity change</text><rect x="16" y="1583.256" width="248" height="56.544" rx="10" fill="#8CC7C7"/><text x="246.000" y="1618.136" font-size="18.880" font-family="Arial, sans-serif" font-weight="600" fill="#102D30" text-anchor="end">Acknowledge alert</text><text x="264.000" y="1676.320" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">Acknowledgement assigns</text><text x="264.000" y="1697.796" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">review responsibility only. The</text><text x="264.000" y="1719.272" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">monitoring service keeps the</text><text x="264.000" y="1740.748" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">original readings and the incident</text><text x="264.000" y="1762.224" font-size="16.520" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">chronology.</text></svg>