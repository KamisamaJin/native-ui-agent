<svg xmlns="http://www.w3.org/2000/svg" width="358" height="1214" viewBox="0 0 358 1214"><rect width="358" height="1214" rx="12" fill="#F5F2EB"/><text x="16.000" y="38.000" font-size="22.000" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">Review river sensor alerts</text><text x="16.000" y="72.600" font-size="16.000" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">Select one incoming alert, inspect its</text><text x="16.000" y="93.400" font-size="16.000" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">readings, and acknowledge it for a field team.</text><rect x="16" y="110.2" width="326" height="73.6" rx="10" fill="#E7DED0"/><text x="32.000" y="142.200" font-size="16.000" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">Readings are advisory. Follow the field</text><text x="32.000" y="163.000" font-size="16.000" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">team protocol before intervention.</text><text x="16.000" y="219.800" font-size="16.000" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">Hide reading dossier</text><rect x="28" y="240.60000000000002" width="314" height="84.4" rx="10" fill="#D6E6E5"/><text x="48.000" y="272.600" font-size="16.000" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">06:40 · North weir level rise</text><text x="48.000" y="299.400" font-size="12.000" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">WATCH</text><path d="M 21 240.60000000000002 V 337.0" stroke="#315F68" stroke-width="2"/><text x="40.000" y="365.000" font-size="16.000" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">Latest sample: 07:18 local. Compare the</text><text x="40.000" y="385.800" font-size="16.000" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">three recorded readings before sending</text><text x="40.000" y="406.600" font-size="16.000" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">a field crew. Maintenance-held alerts</text><text x="40.000" y="427.400" font-size="16.000" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">remain visible for context and cannot be</text><text x="40.000" y="448.200" font-size="16.000" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">acknowledged.</text><rect x="28" y="469.0" width="314" height="84.4" rx="10" fill="#FFFFFF"/><text x="48.000" y="501.000" font-size="16.000" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">06:55 · East culvert battery low</text><text x="48.000" y="527.800" font-size="12.000" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">SERVICE</text><path d="M 21 469.0 V 565.4" stroke="#315F68" stroke-width="2"/><rect x="28" y="565.4" width="314" height="151.6" rx="10" fill="#FFFFFF"/><text x="48.000" y="597.400" font-size="16.000" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">07:10 · South reach signal lost ·</text><text x="48.000" y="618.200" font-size="16.000" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">Unavailable</text><text x="48.000" y="645.000" font-size="12.000" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">HOLD</text><text x="48.000" y="668.600" font-size="14.000" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">Sensor is on a maintenance hold; field</text><text x="48.000" y="686.800" font-size="14.000" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">acknowledgement is paused.</text><path d="M 21 565.4 V 729.0" stroke="#315F68" stroke-width="2"/><rect x="28" y="729.0" width="314" height="84.4" rx="10" fill="#FFFFFF"/><text x="48.000" y="761.000" font-size="16.000" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">07:25 · Mill bridge turbidity</text><text x="48.000" y="787.800" font-size="12.000" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">WATCH</text><path d="M 21 729.0 V 825.4" stroke="#315F68" stroke-width="2"/><rect x="28" y="825.4" width="314" height="84.4" rx="10" fill="#FFFFFF"/><text x="48.000" y="857.400" font-size="16.000" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">07:40 · Reed bank temperature</text><text x="48.000" y="884.200" font-size="12.000" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">INFO</text><path d="M 21 825.4 V 921.8" stroke="#315F68" stroke-width="2"/><rect x="28" y="921.8" width="314" height="84.4" rx="10" fill="#FFFFFF"/><text x="48.000" y="953.800" font-size="16.000" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">07:55 · Ferry gauge drift</text><text x="48.000" y="980.600" font-size="12.000" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">INFO</text><path d="M 21 921.8 V 1018.1999999999999" stroke="#315F68" stroke-width="2"/><text x="16.000" y="1042.200" font-size="16.000" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">Reviewing: 06:40 · North weir level rise</text><rect x="16" y="1066.9999999999998" width="326" height="56" rx="10" fill="#315F68"/><text x="34.000" y="1099.000" font-size="16.000" font-family="Arial, sans-serif" font-weight="600" fill="#F8FBFA" text-anchor="start">Acknowledge alert</text><text x="16.000" y="1157.000" font-size="14.000" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">Acknowledgement assigns review responsibility</text><text x="16.000" y="1175.200" font-size="14.000" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">only. The monitoring service keeps the original</text><text x="16.000" y="1193.400" font-size="14.000" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">readings and the incident chronology.</text></svg>