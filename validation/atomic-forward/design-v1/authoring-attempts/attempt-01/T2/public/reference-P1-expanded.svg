<svg xmlns="http://www.w3.org/2000/svg" width="358" height="1550" viewBox="0 0 358 1550"><rect width="358" height="1550" rx="12" fill="#F5F2EB"/><text x="16.00" y="38.00" font-size="22.00" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">Review river sensor alerts</text><text x="16.00" y="72.60" font-size="16.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">Select one incoming alert, inspect its</text><text x="16.00" y="93.40" font-size="16.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">readings, and acknowledge it for a</text><text x="16.00" y="114.20" font-size="16.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">field team.</text><rect x="16" y="131.0" width="326" height="94.4" rx="10" fill="#E7DED0"/><text x="32.00" y="163.00" font-size="16.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">Readings are advisory. Follow the</text><text x="32.00" y="183.80" font-size="16.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">field team protocol before</text><text x="32.00" y="204.60" font-size="16.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">intervention.</text><text x="16.00" y="261.40" font-size="16.00" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">Hide reading dossier</text><rect x="28" y="282.2" width="314" height="155.8" rx="10" fill="#D6E6E5"/><text x="48.00" y="314.20" font-size="16.00" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">06:40 · North weir level rise</text><text x="48.00" y="341.00" font-size="12.00" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">WATCH</text><text x="48.00" y="364.60" font-size="14.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">Latest sample: 07:18 local. Compare</text><text x="48.00" y="382.80" font-size="14.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">the three recorded readings before</text><text x="48.00" y="401.00" font-size="14.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">sending a field crew.</text><text x="48.00" y="419.20" font-size="14.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">Maintenance-held alerts remain</text><text x="48.00" y="437.40" font-size="14.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">visible for context and cannot be</text><text x="48.00" y="455.60" font-size="14.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">acknowledged.</text><path d="M 21 282.2 V 450.0" stroke="#315F68" stroke-width="2"/><text x="40.00" y="478.00" font-size="16.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">Latest sample: 07:18 local.</text><text x="40.00" y="498.80" font-size="16.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">Compare the three recorded</text><text x="40.00" y="519.60" font-size="16.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">readings before sending a field</text><text x="40.00" y="540.40" font-size="16.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">crew. Maintenance-held alerts</text><text x="40.00" y="561.20" font-size="16.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">remain visible for context and</text><text x="40.00" y="582.00" font-size="16.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">cannot be acknowledged.</text><rect x="28" y="602.8" width="314" height="101.2" rx="10" fill="#F