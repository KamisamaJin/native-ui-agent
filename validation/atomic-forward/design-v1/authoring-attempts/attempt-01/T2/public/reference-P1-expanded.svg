-size="14.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">Maintenance-held alerts remain</text><text x="48.00" y="1173.00" font-size="14.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">visible for context and cannot be</text><text x="48.00" y="1191.20" font-size="14.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">acknowledged.</text><path d="M 21 1017.8000000000001 V 1185.6000000000001" stroke="#315F68" stroke-width="2"/><rect x="28" y="1185.6000000000001" width="314" height="101.2" rx="10" fill="#FFFFFF"/><text x="48.00" y="1217.60" font-size="16.00" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">07:55 · Ferry gauge drift</text><text x="48.00" y="1244.40" font-size="12.00" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">INFO</text><text x="48.00" y="1268.00" font-size="14.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">Staff-assisted access is available</text><text x="48.00" y="1286.20" font-size="14.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">on request.</text><path d="M 21 1185.6000000000001 V 1298.8000000000002" stroke="#315F68" stroke-width="2"/><text x="16.00" y="1322.80" font-size="16.00" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">Reviewing: 06:40 · North weir level</text><text x="16.00" y="1343.60" font-size="16.00" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">rise</text><rect x="16" y="1368.4" width="326" height="73.6" rx="10" fill="#315F68"/><text x="34.00" y="1400.40" font-size="16.00" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">Acknowledge alert</text><text x="16.00" y="1476.00" font-size="14.00" font-family="Arial, sans-serif" font-weight="400" fill="#17