d</text><text x="252.00" y="803.76" font-size="18.88" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">cannot be</text><text x="252.00" y="828.30" font-size="18.88" font-family="Arial, sans-serif" font-weight="400" fill="#E6F1EF" text-anchor="end">acknowledged.</text><rect x="16" y="849.9680000000001" width="236" height="143.592" rx="10" fill="#20383D"/><text x="232.00" y="884.85" font-size="18.88" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">08:20 · Orchard</text><text x="232.00" y="909.39" font-size="18.88" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">drain battery</text><text x="232.00" y="933.94" font-size="18.88" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">warning</text><text x="232.00" y="963.76" font-size="14.16" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">SERVICE</text><path d="M 259 849.9680000000001 V 1005.5600000000001" stroke="#8CC7C7" stroke-width="2"/><rect x="16" y="1005.5600000000001" width="236" height="168.136" rx="10" fill="#20383D"/><text x="232.00" y="1040.44" font-size="18.88" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">08:35 · West</text><text x="232.00" y="1064.98" font-size="18.88" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">spillway</text><text x="232.00" y="1089.53" font-size="18.88" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">maintenance hold ·</text><text x="232.00" y="1114.07" font-size="18.88" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">Unavailable</text><text x="232.00" y="1143.90" font-size="14.16" font-family="Arial, sans-serif" font-weight="600" fill="#E6F1EF" text-anchor="end">HOLD</text><path d="M 259 1005.5600000000001 V 1185.6960000000001" stroke="#8CC7C7" stroke-width="2"/><rect x="16" y="