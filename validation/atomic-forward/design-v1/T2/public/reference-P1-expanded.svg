<svg xmlns="http://www.w3.org/2000/svg" width="358" height="1300" viewBox="0 0 358 1300"><rect width="358" height="1300" rx="12" fill="#F5F2EB"/><text x="16.00" y="38.00" font-size="22.00" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">Review river sensor alerts</text><text x="16.00" y="72.60" font-size="16.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">Select one incoming alert, inspect its</text><text x="16.00" y="93.40" font-size="16.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">readings, and acknowledge it for a</text><text x="16.00" y="114.20" font-size="16.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">field team.</text><rect x="16" y="131.0" width="326" height="94.4" rx="10" fill="#E7DED0"/><text x="32.00" y="163.00" font-size="16.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">Readings are advisory. Follow the</text><text x="32.00" y="183.80" font-size="16.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">field team protocol before</text><text x="32.00" y="204.60" font-size="16.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">intervention.</text><text x="16.00" y="261.40" font-size="16.00" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">Hide reading dossier</text><rect x="28" y="282.2" width="314" height="86.8" rx="10" fill="#D6E6E5"/><text x="48.00" y="314.20" font-size="16.00" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">06:40 · North weir level rise</text><text x="48.00" y="341.00" font-size="12.00" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">WATCH</text><path d="M 21 282.2 V 381.0" stroke="#315F68" stroke-width="2"/><text x="40.00" y="409.00" font-size="16.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">Latest sample: 07:18 local.</text><text x="40.00" y="429.80" font-size="16.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">Compare the three recorded</text><text x="40.00" y="450.60" font-size="16.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">readings before sending a field</text><text x="40.00" y="471.40" font-size="16.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">crew. Maintenance-held alerts</text><text x="40.00" y="492.20" font-size="16.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">remain visible for context and</text><text x="40.00" y="513.00" font-size="16.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">cannot be acknowledged.</text><rect x="28" y="533.8" width="314" height="86.8" rx="10" fill="#FFFFFF"/><text x="48.00" y="565.80" font-size="16.00" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">06:55 · East culvert battery low</text><text x="48.00" y="592.60" font-size="12.00" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">SERVICE</text><path d="M 21 533.8 V 632.5999999999999" stroke="#315F68" stroke-width="2"/><rect x="28" y="632.5999999999999" width="314" height="107.6" rx="10" fill="#FFFFFF"/><text x="48.00" y="664.60" font-size="16.00" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">07:10 · South reach signal lost</text><text x="48.00" y="685.40" font-size="16.00" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">· Unavailable</text><text x="48.00" y="712.20" font-size="12.00" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">HOLD</text><path d="M 21 632.5999999999999 V 752.1999999999999" stroke="#315F68" stroke-width="2"/><rect x="28" y="752.1999999999999" width="314" height="86.8" rx="10" fill="#FFFFFF"/><text x="48.00" y="784.20" font-size="16.00" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">07:25 · Mill bridge turbidity</text><text x="48.00" y="811.00" font-size="12.00" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">WATCH</text><path d="M 21 752.1999999999999 V 850.9999999999999" stroke="#315F68" stroke-width="2"/><rect x="28" y="850.9999999999999" width="314" height="86.8" rx="10" fill="#FFFFFF"/><text x="48.00" y="883.00" font-size="16.00" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">07:40 · Reed bank temperature</text><text x="48.00" y="909.80" font-size="12.00" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">INFO</text><path d="M 21 850.9999999999999 V 949.7999999999998" stroke="#315F68" stroke-width="2"/><rect x="28" y="949.7999999999998" width="314" height="86.8" rx="10" fill="#FFFFFF"/><text x="48.00" y="981.80" font-size="16.00" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">07:55 · Ferry gauge drift</text><text x="48.00" y="1008.60" font-size="12.00" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">INFO</text><path d="M 21 949.7999999999998 V 1048.6" stroke="#315F68" stroke-width="2"/><text x="16.00" y="1072.60" font-size="16.00" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">Reviewing: 06:40 · North weir level</text><text x="16.00" y="1093.40" font-size="16.00" font-family="Arial, sans-serif" font-weight="600" fill="#172D32" text-anchor="start">rise</text><rect x="16" y="1118.1999999999998" width="326" height="73.6" rx="10" fill="#315F68"/><text x="34.00" y="1150.20" font-size="16.00" font-family="Arial, sans-serif" font-weight="600" fill="#F8FBFA" text-anchor="start">Acknowledge alert</text><text x="16.00" y="1225.80" font-size="14.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">Acknowledgement assigns review</text><text x="16.00" y="1244.00" font-size="14.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">responsibility only. The monitoring service</text><text x="16.00" y="1262.20" font-size="14.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">keeps the original readings and the</text><text x="16.00" y="1280.40" font-size="14.00" font-family="Arial, sans-serif" font-weight="400" fill="#172D32" text-anchor="start">incident chronology.</text></svg>