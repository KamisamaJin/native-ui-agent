<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1160" viewBox="0 0 780 1160"><title>T2 Initial draft independent reference</title><rect width="780" height="1160" fill="#FFF8F4"/><rect x="16" y="16" width="358" height="1128" rx="16" fill="#FFFFFF"/>
<text x="32" y="44" font-family="system-ui,sans-serif" font-size="22" font-weight="600" fill="#201B13">Appointment rescheduling</text>
<text x="32" y="68" font-family="system-ui,sans-serif" font-size="22" font-weight="600" fill="#201B13">offer</text>
<text x="32" y="104" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">BK-320 · Community design review</text>
<text x="32" y="136" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">Move this appointment only after</text>
<text x="32" y="160" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">checking both the visit mode and</text>
<text x="32" y="184" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">the offered time. The attendee</text>
<text x="32" y="208" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">needs enough notice to rearrange</text>
<text x="32" y="232" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">accessible transport or prepare a</text>
<text x="32" y="256" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">quiet place for the video review.</text>
<rect x="32" y="296" width="326" height="56" rx="8" fill="#FFFFFF" stroke="#817567"/><path d="M334 308 V340" stroke="#D3C4B4" stroke-dasharray="2 4"/>
<text x="44" y="324" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">○</text>
<text x="68" y="324" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">Visit in person</text>
<rect x="32" y="360" width="326" height="56" rx="8" fill="#FFFFFF" stroke="#817567"/><path d="M334 372 V404" stroke="#D3C4B4" stroke-dasharray="2 4"/>
<text x="44" y="388" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">○</text>
<text x="68" y="388" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">Visit by video</text>
<rect x="32" y="424" width="326" height="192" rx="8" fill="#F3E6DA" stroke="#817567"/><path d="M334 436 V604" stroke="#D3C4B4" stroke-dasharray="2 4"/>
<text x="44" y="452" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">○</text>
<text x="68" y="452" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">Choose Tuesday morning</text>
<text x="68" y="476" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">Tuesday 10:30–11:15. The</text>
<text x="68" y="500" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">consultation includes time</text>
<text x="68" y="524" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">for an interpreter and</text>
<text x="68" y="548" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">review of the annotated</text>
<text x="68" y="572" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">floor plan.</text>
<text x="68" y="596" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">Available · in_person, video</text>
<rect x="32" y="624" width="326" height="120" rx="8" fill="#F3E6DA" stroke="#817567"/><path d="M334 636 V732" stroke="#D3C4B4" stroke-dasharray="2 4"/>
<text x="44" y="652" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">○</text>
<text x="68" y="652" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">Choose Wednesday afternoon</text>
<text x="68" y="676" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">Wednesday 14:00–14:45 at the</text>
<text x="68" y="700" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">town hall annex.</text>
<text x="68" y="724" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">Full · in_person</text>
<rect x="32" y="752" width="326" height="120" rx="8" fill="#F3E6DA" stroke="#817567"/><path d="M334 764 V860" stroke="#D3C4B4" stroke-dasharray="2 4"/>
<text x="44" y="780" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">○</text>
<text x="68" y="780" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">Choose Thursday video</text>
<text x="68" y="804" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">Thursday 16:00–16:45 with</text>
<text x="68" y="828" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">the remote design team.</text>
<text x="68" y="852" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">Available · video</text>
<rect x="32" y="888" width="326" height="48" rx="8" fill="#FFF1E5"/>
<text x="44" y="916" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">No visit mode · No time selected</text>
<text x="32" y="968" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">Choose a visit mode.</text>
<text x="32" y="1024" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">☐ Notify the attendee</text>
<rect x="32" y="1064" width="326" height="48" rx="8" fill="#EDE0D4"/><text x="195" y="1094" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">Move appointment</text>
<text x="416" y="36" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#201B13">INDEPENDENT AUTHOR REFERENCE</text>
<text x="416" y="60" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#201B13">T2 · Initial draft</text>
<text x="416" y="84" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">390 logical parent /358 child</text>
<text x="416" y="108" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Host viewport600; full content shown</text>
<text x="416" y="132" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">No component-owned scrolling</text>
<text x="416" y="156" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13"></text>
<text x="416" y="180" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Title22pt iOS /22sp Android,600</text>
<text x="416" y="204" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Body16pt iOS /16sp Android</text>
<text x="416" y="228" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Panel inset16, radius16pt/dp</text>
<text x="416" y="252" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Major section gap16pt/dp</text>
<text x="416" y="276" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Rows inset12, gap8, radius8pt/dp</text>
<text x="416" y="300" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Empty trailing paint gutter24pt/dp</text>
<text x="416" y="324" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Dashed guide is annotation only</text>
<text x="416" y="348" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Primary height48pt/dp, radius8</text>
<text x="416" y="372" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13"></text>
<text x="416" y="396" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Opaque source-backed palette:</text>
<text x="416" y="420" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FFFFFFFF panel/unselected row</text>
<text x="416" y="444" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FFFFDDB3 selected row</text>
<text x="416" y="468" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FFF3E6DA disabled option</text>
<text x="416" y="492" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FF805610 enabled primary</text>
<text x="416" y="516" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FFEDE0D4 disabled primary</text>
<text x="416" y="540" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FF201B13 text /#FFFFFFFF primary</text>
<text x="416" y="564" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13"></text>
<text x="416" y="588" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Wrap all copy; no ellipsis</text>
<text x="416" y="612" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">No overlap or horizontal clipping</text>
<text x="416" y="636" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Visible selected/checked marks</text>
<text x="416" y="660" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13"></text>
<text x="416" y="684" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Schematic wrapping and glyphs</text>
<text x="416" y="708" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">are not cross-renderer pixel targets.</text>
<text x="416" y="732" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Pixel regions are frozen separately</text>
<text x="416" y="756" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">in policy.json /PIXEL-SCOPE.md.</text>
</svg>
