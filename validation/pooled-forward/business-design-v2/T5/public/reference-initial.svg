<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1344" viewBox="0 0 780 1344"><title>T5 Initial draft independent reference</title><rect width="780" height="1344" fill="#FFF8F4"/><rect x="16" y="16" width="358" height="1312" rx="16" fill="#FFFFFF"/>
<text x="32" y="44" font-family="system-ui,sans-serif" font-size="22" font-weight="600" fill="#201B13">Equipment return</text>
<text x="32" y="68" font-family="system-ui,sans-serif" font-size="22" font-weight="600" fill="#201B13">disposition</text>
<text x="32" y="104" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">RET-517 · Portable interpretation</text>
<text x="32" y="128" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">tablet return</text>
<text x="32" y="160" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">Record the physical checks before</text>
<text x="32" y="184" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">routing this returned tablet. A</text>
<text x="32" y="208" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">return can be offered for stock</text>
<text x="32" y="232" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">only after its power test,</text>
<text x="32" y="256" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">accessories count, and required</text>
<text x="32" y="280" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">data erasure are complete. Keep the</text>
<text x="32" y="304" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">original complaint and the next</text>
<text x="32" y="328" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">handling instruction visible for</text>
<text x="32" y="352" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">the receiving team.</text>
<rect x="32" y="392" width="326" height="56" rx="8" fill="#FFFFFF" stroke="#817567"/><path d="M334 404 V436" stroke="#D3C4B4" stroke-dasharray="2 4"/>
<text x="44" y="420" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">○</text>
<text x="68" y="420" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">Accessories counted</text>
<rect x="32" y="456" width="326" height="56" rx="8" fill="#FFFFFF" stroke="#817567"/><path d="M334 468 V500" stroke="#D3C4B4" stroke-dasharray="2 4"/>
<text x="44" y="484" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">○</text>
<text x="68" y="484" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">Stored data erased</text>
<rect x="32" y="520" width="326" height="56" rx="8" fill="#FFFFFF" stroke="#817567"/><path d="M334 532 V564" stroke="#D3C4B4" stroke-dasharray="2 4"/>
<text x="44" y="548" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">○</text>
<text x="68" y="548" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">Power test passed</text>
<rect x="32" y="584" width="326" height="144" rx="8" fill="#F3E6DA" stroke="#817567"/><path d="M334 596 V716" stroke="#D3C4B4" stroke-dasharray="2 4"/>
<text x="44" y="612" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">○</text>
<text x="68" y="612" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">Return to stock</text>
<text x="68" y="636" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">Restock only after the</text>
<text x="68" y="660" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">tablet passes the power test</text>
<text x="68" y="684" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">and its data and accessories</text>
<text x="68" y="708" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">checks are complete.</text>
<rect x="32" y="736" width="326" height="120" rx="8" fill="#F3E6DA" stroke="#817567"/><path d="M334 748 V844" stroke="#D3C4B4" stroke-dasharray="2 4"/>
<text x="44" y="764" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">○</text>
<text x="68" y="764" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">Send for repair</text>
<text x="68" y="788" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">A technician can inspect the</text>
<text x="68" y="812" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">intermittent charging fault</text>
<text x="68" y="836" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">after safe intake checks.</text>
<rect x="32" y="864" width="326" height="120" rx="8" fill="#F3E6DA" stroke="#817567"/><path d="M334 876 V972" stroke="#D3C4B4" stroke-dasharray="2 4"/>
<text x="44" y="892" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">○</text>
<text x="68" y="892" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">Send for recycling</text>
<text x="68" y="916" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">Recycling is unavailable</text>
<text x="68" y="940" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">while this model remains in</text>
<text x="68" y="964" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">the repair program.</text>
<rect x="32" y="1000" width="326" height="96" rx="8" fill="#FFF1E5"/>
<text x="44" y="1028" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">Accessories unchecked · Data</text>
<text x="44" y="1052" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">pending · Power unchecked ·</text>
<text x="44" y="1076" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">Route none</text>
<text x="32" y="1128" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">Complete accessories and data</text>
<text x="32" y="1152" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">checks.</text>
<text x="32" y="1208" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">☐ Chain of custody checked</text>
<rect x="32" y="1248" width="326" height="48" rx="8" fill="#EDE0D4"/><text x="195" y="1278" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">Record disposition</text>
<text x="416" y="36" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#201B13">INDEPENDENT AUTHOR REFERENCE</text>
<text x="416" y="60" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#201B13">T5 · Initial draft</text>
<text x="416" y="84" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">390 logical parent /358 child</text>
<text x="416" y="108" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Host viewport600; full content shown</text>
<text x="416" y="132" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">No component-owned scrolling</text>
<text x="416" y="156" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13"></text>
<text x="416" y="180" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Title22pt iOS /22sp Android,600</text>
<text x="416" y="204" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Body16pt iOS /16sp Android</text>
<text x="416" y="228" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Panel inset16, radius16pt/dp</text>
<text x="416" y="252" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Major section gap16pt/dp</text>
<text x="416" y="276" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Rows inset12, gap8, radius8pt/dp</text>
<text x="416" y="300" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Empty trailing paint gutter24pt/dp</text>
<text x="416" y="324" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Dashed guide is annotation only</text>
<text x="416" y="348" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Primary height48pt/dp, radius8</text>
<text x="416" y="372" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13"></text>
<text x="416" y="396" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Opaque source-backed palette:</text>
<text x="416" y="420" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FFFFFFFF panel/unselected row</text>
<text x="416" y="444" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FFFFDDB3 selected row</text>
<text x="416" y="468" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FFF3E6DA disabled option</text>
<text x="416" y="492" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FF805610 enabled primary</text>
<text x="416" y="516" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FFEDE0D4 disabled primary</text>
<text x="416" y="540" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FF201B13 text /#FFFFFFFF primary</text>
<text x="416" y="564" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13"></text>
<text x="416" y="588" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Wrap all copy; no ellipsis</text>
<text x="416" y="612" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">No overlap or horizontal clipping</text>
<text x="416" y="636" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Visible selected/checked marks</text>
<text x="416" y="660" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13"></text>
<text x="416" y="684" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Schematic wrapping and glyphs</text>
<text x="416" y="708" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">are not cross-renderer pixel targets.</text>
<text x="416" y="732" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Pixel regions are frozen separately</text>
<text x="416" y="756" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">in policy.json /PIXEL-SCOPE.md.</text>
</svg>
