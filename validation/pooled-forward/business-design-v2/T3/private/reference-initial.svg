<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1304" viewBox="0 0 780 1304"><title>T3 Initial draft independent reference</title><rect width="780" height="1304" fill="#FFF8F4"/><rect x="16" y="16" width="358" height="1272" rx="16" fill="#FFFFFF"/>
<text x="32" y="44" font-family="system-ui,sans-serif" font-size="22" font-weight="600" fill="#201B13">Invoice credit-and-</text>
<text x="32" y="68" font-family="system-ui,sans-serif" font-size="22" font-weight="600" fill="#201B13">payment allocation</text>
<text x="32" y="104" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">INV-992 · Specialist accessible</text>
<text x="32" y="128" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">exhibition equipment and</text>
<text x="32" y="152" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">consolidated delivery</text>
<text x="32" y="184" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">The supplier consolidated several</text>
<text x="32" y="208" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">small equipment lines into one</text>
<text x="32" y="232" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">invoice. Preserve the complete</text>
<text x="32" y="256" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">remittance instructions and the</text>
<text x="32" y="280" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">statement that account credit must</text>
<text x="32" y="304" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">be capped at the amount actually</text>
<text x="32" y="328" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">due. A one-cent difference matters</text>
<text x="32" y="352" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">to the balance, and the authorized</text>
<text x="32" y="376" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">method must be the currently</text>
<text x="32" y="400" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">available one rather than the first</text>
<text x="32" y="424" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">method in the supplied list.</text>
<rect x="32" y="464" width="326" height="56" rx="8" fill="#FFFFFF" stroke="#817567"/><path d="M334 476 V508" stroke="#D3C4B4" stroke-dasharray="2 4"/>
<text x="44" y="492" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">○</text>
<text x="68" y="492" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">Apply account credit</text>
<rect x="32" y="528" width="326" height="216" rx="8" fill="#F3E6DA" stroke="#817567"/><path d="M334 540 V732" stroke="#D3C4B4" stroke-dasharray="2 4"/>
<text x="44" y="556" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">○</text>
<text x="68" y="556" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">Pay by bank transfer</text>
<text x="68" y="580" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">Use the verified operating</text>
<text x="68" y="604" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">account ending 0428. The</text>
<text x="68" y="628" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">payment reference must</text>
<text x="68" y="652" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">remain attached to this</text>
<text x="68" y="676" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">invoice.</text>
<text x="68" y="700" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">Unavailable: Bank</text>
<text x="68" y="724" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">verification pending</text>
<rect x="32" y="752" width="326" height="216" rx="8" fill="#FFFFFF" stroke="#817567"/><path d="M334 764 V956" stroke="#D3C4B4" stroke-dasharray="2 4"/>
<text x="44" y="780" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">○</text>
<text x="68" y="780" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">Pay by company card</text>
<text x="68" y="804" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">Use the purchasing card with</text>
<text x="68" y="828" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">the documented spending</text>
<text x="68" y="852" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">approval, and retain the</text>
<text x="68" y="876" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">unusually long supplier</text>
<text x="68" y="900" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">reference supplied with the</text>
<text x="68" y="924" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">invoice.</text>
<text x="68" y="948" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">Available</text>
<rect x="32" y="984" width="326" height="72" rx="8" fill="#FFF1E5"/>
<text x="44" y="1012" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">Credit USD 0.00 · Remaining USD</text>
<text x="44" y="1036" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">101.99</text>
<text x="32" y="1088" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">Choose a payment method for the</text>
<text x="32" y="1112" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">remaining amount.</text>
<text x="32" y="1168" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">☐ I authorize this settlement</text>
<rect x="32" y="1208" width="326" height="48" rx="8" fill="#EDE0D4"/><text x="195" y="1238" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">Settle invoice</text>
<text x="416" y="36" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#201B13">INDEPENDENT AUTHOR REFERENCE</text>
<text x="416" y="60" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#201B13">T3 · Initial draft</text>
<text x="416" y="84" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">390 logical parent /358 child</text>
<text x="416" y="108" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Host viewport600; full content shown</text>
<text x="416" y="132" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">No component-owned scrolling</text>
<text x="416" y="156" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13"></text>
<text x="416" y="180" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Title22pt iOS /22sp Android,600</text>
<text x="416" y="204" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Body16pt iOS /16sp Android</text>
<text x="416" y="228" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Panel inset16, radius16pt/dp</text>
<text x="416" y="252" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Major section gap16pt/dp</text>
<text x="416" y="276" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Rows inset12, gap8, radius8pt/dp</text>
<text x="416" y="300" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Empty trailing paint gutter24pt/dp</text>
<text x="416" y="324" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Dashed guide is annotation only</text>
<text x="416" y="348" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Primary height48pt/dp, radius8</text>
<text x="416" y="372" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13"></text>
<text x="416" y="396" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Opaque source-backed palette:</text>
<text x="416" y="420" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FFFFFFFF panel/unselected row</text>
<text x="416" y="444" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FFFFDDB3 selected row</text>
<text x="416" y="468" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FFF3E6DA disabled option</text>
<text x="416" y="492" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FF805610 enabled primary</text>
<text x="416" y="516" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FFEDE0D4 disabled primary</text>
<text x="416" y="540" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FF201B13 text /#FFFFFFFF primary</text>
<text x="416" y="564" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13"></text>
<text x="416" y="588" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Wrap all copy; no ellipsis</text>
<text x="416" y="612" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">No overlap or horizontal clipping</text>
<text x="416" y="636" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Visible selected/checked marks</text>
<text x="416" y="660" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13"></text>
<text x="416" y="684" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Schematic wrapping and glyphs</text>
<text x="416" y="708" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">are not cross-renderer pixel targets.</text>
<text x="416" y="732" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Pixel regions are frozen separately</text>
<text x="416" y="756" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">in policy.json /PIXEL-SCOPE.md.</text>
</svg>
