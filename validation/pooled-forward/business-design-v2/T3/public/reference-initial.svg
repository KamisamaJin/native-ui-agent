<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1160" viewBox="0 0 780 1160"><title>T3 Initial draft independent reference</title><rect width="780" height="1160" fill="#FFF8F4"/><rect x="16" y="16" width="358" height="1128" rx="16" fill="#FFFFFF"/>
<text x="32" y="44" font-family="system-ui,sans-serif" font-size="22" font-weight="600" fill="#201B13">Invoice credit-and-</text>
<text x="32" y="68" font-family="system-ui,sans-serif" font-size="22" font-weight="600" fill="#201B13">payment allocation</text>
<text x="32" y="104" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">INV-640 · Workshop materials</text>
<text x="32" y="128" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">invoice</text>
<text x="32" y="160" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">Allocate the available account</text>
<text x="32" y="184" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">credit before choosing how to</text>
<text x="32" y="208" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">settle the remaining amount. This</text>
<text x="32" y="232" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">invoice includes reusable workshop</text>
<text x="32" y="256" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">supplies, documented delivery</text>
<text x="32" y="280" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">charges, and a separate reference</text>
<text x="32" y="304" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">for the accounts team. Amounts are</text>
<text x="32" y="328" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">integer US cents; never calculate</text>
<text x="32" y="352" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">using binary floating-point money.</text>
<rect x="32" y="392" width="326" height="56" rx="8" fill="#FFFFFF" stroke="#817567"/><path d="M334 404 V436" stroke="#D3C4B4" stroke-dasharray="2 4"/>
<text x="44" y="420" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">○</text>
<text x="68" y="420" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">Apply account credit</text>
<rect x="32" y="456" width="326" height="192" rx="8" fill="#FFFFFF" stroke="#817567"/><path d="M334 468 V636" stroke="#D3C4B4" stroke-dasharray="2 4"/>
<text x="44" y="484" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">○</text>
<text x="68" y="484" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">Pay by bank transfer</text>
<text x="68" y="508" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">Use the verified operating</text>
<text x="68" y="532" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">account ending 0428. The</text>
<text x="68" y="556" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">payment reference must</text>
<text x="68" y="580" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">remain attached to this</text>
<text x="68" y="604" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">invoice.</text>
<text x="68" y="628" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">Available</text>
<rect x="32" y="656" width="326" height="168" rx="8" fill="#F3E6DA" stroke="#817567"/><path d="M334 668 V812" stroke="#D3C4B4" stroke-dasharray="2 4"/>
<text x="44" y="684" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">○</text>
<text x="68" y="684" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">Pay by company card</text>
<text x="68" y="708" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">The company card is</text>
<text x="68" y="732" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">temporarily unavailable for</text>
<text x="68" y="756" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">this supplier.</text>
<text x="68" y="780" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">Unavailable: Supplier card</text>
<text x="68" y="804" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">payments paused</text>
<rect x="32" y="840" width="326" height="72" rx="8" fill="#FFF1E5"/>
<text x="44" y="868" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">Credit USD 0.00 · Remaining USD</text>
<text x="44" y="892" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">125.00</text>
<text x="32" y="944" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">Choose a payment method for the</text>
<text x="32" y="968" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">remaining amount.</text>
<text x="32" y="1024" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">☐ I authorize this settlement</text>
<rect x="32" y="1064" width="326" height="48" rx="8" fill="#EDE0D4"/><text x="195" y="1094" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">Settle invoice</text>
<text x="416" y="36" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#201B13">INDEPENDENT AUTHOR REFERENCE</text>
<text x="416" y="60" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#201B13">T3 · Initial draft</text>
<text x="416" y="84" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">390 logical parent /358 child</text>
<text x="416" y="108" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Host viewport600; full content shown</text>
<text x="416" y="132" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">No component-owned scrolling</text>
<text x="416" y="156" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13"></text>
<text x="416" y="180" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Title22pt iOS /22sp Android,600</text>
<text x="416" y="204" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Body16pt iOS /16sp Android</text>
<text x="416" y="228" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Panel inset16, radius16pt/dp</text>
<text x="416" y="252" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Major section gap16pt/dp</text>
<text x="416" y="276" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Rows inset12, gap8, radius8pt/dp</text>
<text x="416" y="300" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Empty trailing paint gutter24pt/dp</text>
<text x="416" y="324" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Dashed guide is annotation only</text>
<text x="416" y="348" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Primary height48pt/dp, radius8</text>
<text x="416" y="372" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13"></text>
<text x="416" y="396" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Opaque source-backed palette:</text>
<text x="416" y="420" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FFFFFFFF panel/unselected row</text>
<text x="416" y="444" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FFFFDDB3 selected row</text>
<text x="416" y="468" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FFF3E6DA disabled option</text>
<text x="416" y="492" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FF805610 enabled primary</text>
<text x="416" y="516" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FFEDE0D4 disabled primary</text>
<text x="416" y="540" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FF201B13 text /#FFFFFFFF primary</text>
<text x="416" y="564" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13"></text>
<text x="416" y="588" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Wrap all copy; no ellipsis</text>
<text x="416" y="612" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">No overlap or horizontal clipping</text>
<text x="416" y="636" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Visible selected/checked marks</text>
<text x="416" y="660" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13"></text>
<text x="416" y="684" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Schematic wrapping and glyphs</text>
<text x="416" y="708" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">are not cross-renderer pixel targets.</text>
<text x="416" y="732" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Pixel regions are frozen separately</text>
<text x="416" y="756" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">in policy.json /PIXEL-SCOPE.md.</text>
</svg>
