<text x="32" y="104" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">OR-481 · Museum installation</text>
<text x="32" y="128" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">freight</text>
<text x="32" y="160" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">Release only the cartons that can</text>
<text x="32" y="184" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">travel together today. The</text>
