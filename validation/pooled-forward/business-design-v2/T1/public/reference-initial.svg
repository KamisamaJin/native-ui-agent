<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1152" viewBox="0 0 780 1152"><title>T1 Initial draft independent reference</title><rect width="780" height="1152" fill="#FFF8F4"/><rect x="16" y="16" width="358" height="1120" rx="16" fill="#FFFFFF"/>
