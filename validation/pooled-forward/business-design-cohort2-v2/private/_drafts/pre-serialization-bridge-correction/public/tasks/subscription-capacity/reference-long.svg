<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1436" viewBox="0 0 390 1436"><title>Independent authored design, not runtime output</title><rect width="390" height="1436" fill="#FFFFFF"/><rect x="16" y="24" width="358" height="1388" rx="12" fill="#F7F9FC"/><g font-family="system-ui, sans-serif"><text x="32" y="48" font-size="24" font-weight="600" fill="#15243B">Extended review:</text><text x="32" y="78" font-size="24" font-weight="600" fill="#15243B">Subscription capacity</text><text x="32" y="108" font-size="24" font-weight="600" fill="#15243B">change for the cross-</text><text x="32" y="138" font-size="24" font-weight="600" fill="#15243B">functional welcome and</text><text x="32" y="168" font-size="24" font-weight="600" fill="#15243B">operations programme</text><text x="32" y="210" font-size="15" font-weight="400" fill="#526174">Prepare a workspace capacity change from</text><text x="32" y="231" font-size="15" font-weight="400" fill="#526174">current seat demand, allocation limits,</text><text x="32" y="252" font-size="15" font-weight="400" fill="#526174">and prepaid credit. The component records</text><text x="32" y="273" font-size="15" font-weight="400" fill="#526174">a request and does not charge a payment</text><text x="32" y="294" font-size="15" font-weight="400" fill="#526174">method. Please read this caller-supplied</text><text x="32" y="315" font-size="15" font-weight="400" fill="#526174">narrative in full before recording the</text><text x="32" y="336" font-size="15" font-weight="400" fill="#526174">request. The facilities, people, and</text><text x="32" y="357" font-size="15" font-weight="400" fill="#526174">operations teams share this reusable</text><text x="32" y="378" font-size="15" font-weight="400" fill="#526174">panel, so the narrative may include</text><text x="32" y="399" font-size="15" font-weight="400" fill="#526174">several complete sentences and meaningful</text><text x="32" y="420" font-size="15" font-weight="400" fill="#526174">spaces. Every sentence must remain visible</text><text x="32" y="441" font-size="15" font-weight="400" fill="#526174">when the host scrolls; the panel must grow</text><text x="32" y="462" font-size="15" font-weight="400" fill="#526174">naturally instead of clipping, shrinking</text><text x="32" y="483" font-size="15" font-weight="400" fill="#526174">the type, or introducing an internal</text><text x="32" y="504" font-size="15" font-weight="400" fill="#526174">scroll region.</text><text x="32" y="537" font-size="15" font-weight="400" fill="#526174">Quota limits are inclusive. Ten seats is</text><text x="32" y="558" font-size="15" font-weight="400" fill="#526174">the first eligible Scale quantity.</text><text x="32" y="579" font-size="15" font-weight="400" fill="#526174"></text><text x="32" y="600" font-size="15" font-weight="400" fill="#526174">Selecting another plan clears the billing</text><text x="32" y="621" font-size="15" font-weight="400" fill="#526174">term and capacity confirmation.</text><text x="32" y="642" font-size="15" font-weight="400" fill="#526174"></text><text x="32" y="663" font-size="15" font-weight="400" fill="#526174">Caller note: keep the accessibility labels</text><text x="32" y="684" font-size="15" font-weight="400" fill="#526174">on the actual controls. Long descriptive</text><text x="32" y="705" font-size="15" font-weight="400" fill="#526174">text belongs in the component content and</text><text x="32" y="726" font-size="15" font-weight="400" fill="#526174">wraps across as many lines as necessary.</text><text x="32" y="747" font-size="15" font-weight="400" fill="#526174">This explanatory note is business context</text><text x="32" y="768" font-size="15" font-weight="400" fill="#526174">for the operator.</text><text x="32" y="801" font-size="16" font-weight="600" fill="#15243B">Plan</text><rect x="32" y="835" width="326" height="52" rx="8" fill="#E5F1FF" stroke="#2459A6"/><text x="48" y="866" font-size="15" fill="#526174">Scale plan</text><text x="333" y="866" font-size="16" fill="#2459A6">✓</text><rect x="32" y="899" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="930" font-size="15" fill="#526174">Team plan</text><text x="32" y="963" font-size="16" font-weight="600" fill="#15243B">Term</text><rect x="32" y="997" width="326" height="52" rx="8" fill="#E5F1FF" stroke="#2459A6"/><text x="48" y="1028" font-size="15" fill="#526174">Annual billing</text><text x="333" y="1028" font-size="16" fill="#2459A6">✓</text><rect x="32" y="1061" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="1092" font-size="15" fill="#526174">Monthly billing</text><text x="32" y="1125" font-size="16" font-weight="600" fill="#15243B">Plan: Scale plan. Term: Annual billing. 18</text><text x="32" y="1147" font-size="16" font-weight="600" fill="#15243B">seats.</text><rect x="32" y="1181" width="326" height="52" rx="8" fill="#E5F1FF" stroke="#2459A6"/><text x="48" y="1212" font-size="15" fill="#526174">I confirm the capacity commitment</text><text x="333" y="1212" font-size="16" fill="#2459A6">✓</text><text x="32" y="1245" font-size="15" font-weight="400" fill="#526174">Recorded. Selections are locked for this</text><text x="32" y="1266" font-size="15" font-weight="400" fill="#526174">request.</text><text x="32" y="1299" font-size="15" font-weight="400" fill="#526174">Capacity change recorded.</text><rect x="32" y="1332" width="326" height="48" rx="8" fill="#D9E1EC"/><text x="195" y="1362" text-anchor="middle" font-size="16" font-weight="600" fill="#526174">Record capacity change</text></g></svg>
