<svg xmlns="http://www.w3.org/2000/svg" width="390" height="968" viewBox="0 0 390 968"><title>Independent authored design, not runtime output</title><rect width="390" height="968" fill="#FFFFFF"/><rect x="16" y="24" width="358" height="920" rx="12" fill="#F7F9FC"/><g font-family="system-ui, sans-serif"><text x="32" y="48" font-size="24" font-weight="600" fill="#15243B">Subscription capacity</text><text x="32" y="78" font-size="24" font-weight="600" fill="#15243B">change</text><text x="32" y="120" font-size="15" font-weight="400" fill="#526174">Prepare a workspace capacity change from</text><text x="32" y="141" font-size="15" font-weight="400" fill="#526174">current seat demand, allocation limits,</text><text x="32" y="162" font-size="15" font-weight="400" fill="#526174">and prepaid credit. The component records</text><text x="32" y="183" font-size="15" font-weight="400" fill="#526174">a request and does not charge a payment</text><text x="32" y="204" font-size="15" font-weight="400" fill="#526174">method.</text><text x="32" y="237" font-size="15" font-weight="400" fill="#526174">Quota limits are inclusive. Ten seats is</text><text x="32" y="258" font-size="15" font-weight="400" fill="#526174">the first eligible Scale quantity.</text><text x="32" y="279" font-size="15" font-weight="400" fill="#526174"></text><text x="32" y="300" font-size="15" font-weight="400" fill="#526174">Selecting another plan clears the billing</text><text x="32" y="321" font-size="15" font-weight="400" fill="#526174">term and capacity confirmation.</text><text x="32" y="354" font-size="16" font-weight="600" fill="#15243B">Plan</text><rect x="32" y="388" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="419" font-size="15" fill="#15243B">Scale plan</text><rect x="32" y="452" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="483" font-size="15" fill="#15243B">Team plan</text><text x="32" y="516" font-size="16" font-weight="600" fill="#15243B">Term</text><rect x="32" y="550" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="581" font-size="15" fill="#526174">Annual billing</text><rect x="32" y="614" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="645" font-size="15" fill="#526174">Monthly billing</text><text x="32" y="678" font-size="16" font-weight="600" fill="#15243B">Plan: Not chosen. Term: Not chosen. 18</text><text x="32" y="700" font-size="16" font-weight="600" fill="#15243B">seats.</text><rect x="32" y="734" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="765" font-size="15" fill="#526174">I confirm the capacity commitment</text><text x="32" y="798" font-size="15" font-weight="400" fill="#526174">Choose a plan.</text><text x="32" y="831" font-size="15" font-weight="400" fill="#526174">No request recorded.</text><rect x="32" y="864" width="326" height="48" rx="8" fill="#D9E1EC"/><text x="195" y="894" text-anchor="middle" font-size="16" font-weight="600" fill="#526174">Record capacity change</text></g></svg>
