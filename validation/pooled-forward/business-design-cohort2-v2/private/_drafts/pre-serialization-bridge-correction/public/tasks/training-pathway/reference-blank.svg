<svg xmlns="http://www.w3.org/2000/svg" width="390" height="947" viewBox="0 0 390 947"><title>Independent authored design, not runtime output</title><rect width="390" height="947" fill="#FFFFFF"/><rect x="16" y="24" width="358" height="899" rx="12" fill="#F7F9FC"/><g font-family="system-ui, sans-serif"><text x="32" y="48" font-size="24" font-weight="600" fill="#15243B">Training pathway</text><text x="32" y="78" font-size="24" font-weight="600" fill="#15243B">enrollment</text><text x="32" y="120" font-size="15" font-weight="400" fill="#526174">Enroll a staff member in the next learning</text><text x="32" y="141" font-size="15" font-weight="400" fill="#526174">activity using already completed modules</text><text x="32" y="162" font-size="15" font-weight="400" fill="#526174">and published capacity. This panel does</text><text x="32" y="183" font-size="15" font-weight="400" fill="#526174">not book a date or load a course service.</text><text x="32" y="216" font-size="15" font-weight="400" fill="#526174">Foundation completion is a case-sensitive</text><text x="32" y="237" font-size="15" font-weight="400" fill="#526174">module identifier, not a display label.</text><text x="32" y="258" font-size="15" font-weight="400" fill="#526174"></text><text x="32" y="279" font-size="15" font-weight="400" fill="#526174">Changing a pathway clears the</text><text x="32" y="300" font-size="15" font-weight="400" fill="#526174">participation mode and commitment.</text><text x="32" y="333" font-size="16" font-weight="600" fill="#15243B">Pathway</text><rect x="32" y="367" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="398" font-size="15" fill="#15243B">Guided cohort</text><rect x="32" y="431" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="462" font-size="15" fill="#15243B">Independent lab</text><text x="32" y="495" font-size="16" font-weight="600" fill="#15243B">Mode</text><rect x="32" y="529" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="560" font-size="15" fill="#526174">Certificate assessment</text><rect x="32" y="593" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="624" font-size="15" fill="#526174">Practice only</text><text x="32" y="657" font-size="16" font-weight="600" fill="#15243B">Pathway: Not chosen. Mode: Not chosen. 16</text><text x="32" y="679" font-size="16" font-weight="600" fill="#15243B">completed hours.</text><rect x="32" y="713" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="744" font-size="15" fill="#526174">I confirm the learning commitment</text><text x="32" y="777" font-size="15" font-weight="400" fill="#526174">Choose a pathway.</text><text x="32" y="810" font-size="15" font-weight="400" fill="#526174">No request recorded.</text><rect x="32" y="843" width="326" height="48" rx="8" fill="#D9E1EC"/><text x="195" y="873" text-anchor="middle" font-size="16" font-weight="600" fill="#526174">Record training enrollment</text></g></svg>
