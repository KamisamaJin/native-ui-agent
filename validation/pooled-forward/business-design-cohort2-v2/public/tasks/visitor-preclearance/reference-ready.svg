<svg xmlns="http://www.w3.org/2000/svg" width="390" height="989" viewBox="0 0 390 989"><title>Independent authored design, not runtime output</title><rect width="390" height="989" fill="#FFFFFF"/><rect x="16" y="24" width="358" height="941" rx="12" fill="#F7F9FC"/><g font-family="system-ui, sans-serif"><text x="32" y="48" font-size="24" font-weight="600" fill="#15243B">Visitor access</text><text x="32" y="78" font-size="24" font-weight="600" fill="#15243B">preclearance</text><text x="32" y="120" font-size="15" font-weight="400" fill="#526174">Prepare one deterministic visitor access</text><text x="32" y="141" font-size="15" font-weight="400" fill="#526174">request using sponsor, identity,</text><text x="32" y="162" font-size="15" font-weight="400" fill="#526174">induction, and escort facts already</text><text x="32" y="183" font-size="15" font-weight="400" fill="#526174">supplied by reception. This panel does not</text><text x="32" y="204" font-size="15" font-weight="400" fill="#526174">issue a badge.</text><text x="32" y="237" font-size="15" font-weight="400" fill="#526174">Each visitor requires a verified identity</text><text x="32" y="258" font-size="15" font-weight="400" fill="#526174">and an induction for a research badge.</text><text x="32" y="279" font-size="15" font-weight="400" fill="#526174"></text><text x="32" y="300" font-size="15" font-weight="400" fill="#526174">Changing an access area clears the</text><text x="32" y="321" font-size="15" font-weight="400" fill="#526174">credential route and briefing</text><text x="32" y="342" font-size="15" font-weight="400" fill="#526174">confirmation.</text><text x="32" y="375" font-size="16" font-weight="600" fill="#15243B">Area</text><rect x="32" y="409" width="326" height="52" rx="8" fill="#E5F1FF" stroke="#2459A6"/><text x="48" y="440" font-size="15" fill="#15243B">Research floor</text><text x="333" y="440" font-size="16" fill="#2459A6">✓</text><rect x="32" y="473" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="504" font-size="15" fill="#15243B">Office floor</text><text x="32" y="537" font-size="16" font-weight="600" fill="#15243B">Credential</text><rect x="32" y="571" width="326" height="52" rx="8" fill="#E5F1FF" stroke="#2459A6"/><text x="48" y="602" font-size="15" fill="#15243B">Research badge</text><text x="333" y="602" font-size="16" fill="#2459A6">✓</text><rect x="32" y="635" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="666" font-size="15" fill="#15243B">Visitor escort</text><text x="32" y="699" font-size="16" font-weight="600" fill="#15243B">Area: Research floor. Credential: Research</text><text x="32" y="721" font-size="16" font-weight="600" fill="#15243B">badge. 3 visitors.</text><rect x="32" y="755" width="326" height="52" rx="8" fill="#E5F1FF" stroke="#2459A6"/><text x="48" y="786" font-size="15" fill="#15243B">I confirm the visitor briefing</text><text x="333" y="786" font-size="16" fill="#2459A6">✓</text><text x="32" y="819" font-size="15" font-weight="400" fill="#526174">Ready to record visitor clearance.</text><text x="32" y="852" font-size="15" font-weight="400" fill="#526174">No request recorded.</text><rect x="32" y="885" width="326" height="48" rx="8" fill="#2459A6"/><text x="195" y="915" text-anchor="middle" font-size="16" font-weight="600" fill="#FFFFFF">Record visitor clearance</text></g></svg>
