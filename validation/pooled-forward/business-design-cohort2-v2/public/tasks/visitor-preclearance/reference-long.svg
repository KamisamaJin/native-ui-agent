<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1457" viewBox="0 0 390 1457"><title>Independent authored design, not runtime output</title><rect width="390" height="1457" fill="#FFFFFF"/><rect x="16" y="24" width="358" height="1409" rx="12" fill="#F7F9FC"/><g font-family="system-ui, sans-serif"><text x="32" y="48" font-size="24" font-weight="600" fill="#15243B">Extended review: Visitor</text><text x="32" y="78" font-size="24" font-weight="600" fill="#15243B">access preclearance for</text><text x="32" y="108" font-size="24" font-weight="600" fill="#15243B">the cross-functional</text><text x="32" y="138" font-size="24" font-weight="600" fill="#15243B">welcome and operations</text><text x="32" y="168" font-size="24" font-weight="600" fill="#15243B">programme</text><text x="32" y="210" font-size="15" font-weight="400" fill="#526174">Prepare one deterministic visitor access</text><text x="32" y="231" font-size="15" font-weight="400" fill="#526174">request using sponsor, identity,</text><text x="32" y="252" font-size="15" font-weight="400" fill="#526174">induction, and escort facts already</text><text x="32" y="273" font-size="15" font-weight="400" fill="#526174">supplied by reception. This panel does not</text><text x="32" y="294" font-size="15" font-weight="400" fill="#526174">issue a badge. Please read this caller-</text><text x="32" y="315" font-size="15" font-weight="400" fill="#526174">supplied narrative in full before</text><text x="32" y="336" font-size="15" font-weight="400" fill="#526174">recording the request. The facilities,</text><text x="32" y="357" font-size="15" font-weight="400" fill="#526174">people, and operations teams share this</text><text x="32" y="378" font-size="15" font-weight="400" fill="#526174">reusable panel, so the narrative may</text><text x="32" y="399" font-size="15" font-weight="400" fill="#526174">include several complete sentences and</text><text x="32" y="420" font-size="15" font-weight="400" fill="#526174">meaningful spaces. Every sentence must</text><text x="32" y="441" font-size="15" font-weight="400" fill="#526174">remain visible when the host scrolls; the</text><text x="32" y="462" font-size="15" font-weight="400" fill="#526174">panel must grow naturally instead of</text><text x="32" y="483" font-size="15" font-weight="400" fill="#526174">clipping, shrinking the type, or</text><text x="32" y="504" font-size="15" font-weight="400" fill="#526174">introducing an internal scroll region.</text><text x="32" y="537" font-size="15" font-weight="400" fill="#526174">Each visitor requires a verified identity</text><text x="32" y="558" font-size="15" font-weight="400" fill="#526174">and an induction for a research badge.</text><text x="32" y="579" font-size="15" font-weight="400" fill="#526174"></text><text x="32" y="600" font-size="15" font-weight="400" fill="#526174">Changing an access area clears the</text><text x="32" y="621" font-size="15" font-weight="400" fill="#526174">credential route and briefing</text><text x="32" y="642" font-size="15" font-weight="400" fill="#526174">confirmation.</text><text x="32" y="663" font-size="15" font-weight="400" fill="#526174"></text><text x="32" y="684" font-size="15" font-weight="400" fill="#526174">Caller note: keep the accessibility labels</text><text x="32" y="705" font-size="15" font-weight="400" fill="#526174">on the actual controls. Long descriptive</text><text x="32" y="726" font-size="15" font-weight="400" fill="#526174">text belongs in the component content and</text><text x="32" y="747" font-size="15" font-weight="400" fill="#526174">wraps across as many lines as necessary.</text><text x="32" y="768" font-size="15" font-weight="400" fill="#526174">This explanatory note is business context</text><text x="32" y="789" font-size="15" font-weight="400" fill="#526174">for the operator.</text><text x="32" y="822" font-size="16" font-weight="600" fill="#15243B">Area</text><rect x="32" y="856" width="326" height="52" rx="8" fill="#E5F1FF" stroke="#2459A6"/><text x="48" y="887" font-size="15" fill="#526174">Research floor</text><text x="333" y="887" font-size="16" fill="#2459A6">✓</text><rect x="32" y="920" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="951" font-size="15" fill="#526174">Office floor</text><text x="32" y="984" font-size="16" font-weight="600" fill="#15243B">Credential</text><rect x="32" y="1018" width="326" height="52" rx="8" fill="#E5F1FF" stroke="#2459A6"/><text x="48" y="1049" font-size="15" fill="#526174">Research badge</text><text x="333" y="1049" font-size="16" fill="#2459A6">✓</text><rect x="32" y="1082" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="1113" font-size="15" fill="#526174">Visitor escort</text><text x="32" y="1146" font-size="16" font-weight="600" fill="#15243B">Area: Research floor. Credential: Research</text><text x="32" y="1168" font-size="16" font-weight="600" fill="#15243B">badge. 3 visitors.</text><rect x="32" y="1202" width="326" height="52" rx="8" fill="#E5F1FF" stroke="#2459A6"/><text x="48" y="1233" font-size="15" fill="#526174">I confirm the visitor briefing</text><text x="333" y="1233" font-size="16" fill="#2459A6">✓</text><text x="32" y="1266" font-size="15" font-weight="400" fill="#526174">Recorded. Selections are locked for this</text><text x="32" y="1287" font-size="15" font-weight="400" fill="#526174">request.</text><text x="32" y="1320" font-size="15" font-weight="400" fill="#526174">Visitor clearance recorded.</text><rect x="32" y="1353" width="326" height="48" rx="8" fill="#D9E1EC"/><text x="195" y="1383" text-anchor="middle" font-size="16" font-weight="600" fill="#526174">Record visitor clearance</text></g></svg>
