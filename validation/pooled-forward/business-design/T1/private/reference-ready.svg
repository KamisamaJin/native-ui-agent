<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1464" viewBox="0 0 780 1464"><title>T1 Ready to submit independent reference</title><rect width="780" height="1464" fill="#FFF8F4"/><rect x="16" y="16" width="358" height="1432" rx="16" fill="#FFFFFF"/>
<text x="32" y="44" font-family="system-ui,sans-serif" font-size="22" font-weight="600" fill="#201B13">Shipment release</text>
<text x="32" y="68" font-family="system-ui,sans-serif" font-size="22" font-weight="600" fill="#201B13">checklist</text>
<text x="32" y="104" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">OR-936 · Northern depot</text>
<text x="32" y="128" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">accessibility refit and</text>
<text x="32" y="152" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">replacement display materials</text>
<text x="32" y="184" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">The northern depot is coordinating</text>
<text x="32" y="208" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">a multi-room accessibility refit</text>
<text x="32" y="232" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">with a receiving team that shares</text>
<text x="32" y="256" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">its loading bay with another</text>
<text x="32" y="280" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">institution. Preserve the full</text>
<text x="32" y="304" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">delivery note, including the</text>
<text x="32" y="328" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">instruction to call the facilities</text>
<text x="32" y="352" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">desk after arrival, leave the</text>
<text x="32" y="376" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">archival labels attached, and keep</text>
<text x="32" y="400" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">the last pallet upright while the</text>
<text x="32" y="424" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">rear lift is in use.</text>
<rect x="32" y="464" width="326" height="288" rx="8" fill="#FFDDB3" stroke="#817567"/><path d="M334 476 V740" stroke="#D3C4B4" stroke-dasharray="2 4"/>
<text x="44" y="492" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">✓</text>
<text x="68" y="492" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">Release northern lot</text>
<text x="68" y="516" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">Very long conservation</text>
<text x="68" y="540" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">packaging instruction: this</text>
<text x="68" y="564" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">lot contains folded</text>
<text x="68" y="588" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">interpretive panels,</text>
<text x="68" y="612" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">replacement tactile labels,</text>
<text x="68" y="636" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">and a rigid display support</text>
<text x="68" y="660" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">that must remain flat until</text>
<text x="68" y="684" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">the destination crew has</text>
<text x="68" y="708" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">signed the receiving sheet.</text>
<text x="68" y="732" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">17 units · Available</text>
<rect x="32" y="760" width="326" height="192" rx="8" fill="#FFDDB3" stroke="#817567"/><path d="M334 772 V940" stroke="#D3C4B4" stroke-dasharray="2 4"/>
<text x="44" y="788" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">✓</text>
<text x="68" y="788" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">Release accessible fittings</text>
<text x="68" y="812" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">A mixed lot of access rails</text>
<text x="68" y="836" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">and small fittings, each in</text>
<text x="68" y="860" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">a labeled reusable pouch. Do</text>
<text x="68" y="884" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">not separate the pouch list</text>
<text x="68" y="908" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">from its returnable crate.</text>
<text x="68" y="932" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">8 units · Available</text>
<rect x="32" y="960" width="326" height="216" rx="8" fill="#F3E6DA" stroke="#817567"/><path d="M334 972 V1164" stroke="#D3C4B4" stroke-dasharray="2 4"/>
<text x="44" y="988" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">○</text>
<text x="68" y="988" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">Release reserve stock</text>
<text x="68" y="1012" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">Reserve labels and mounting</text>
<text x="68" y="1036" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">plates remain held while the</text>
<text x="68" y="1060" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">receiving institution</text>
<text x="68" y="1084" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">confirms whether its storage</text>
<text x="68" y="1108" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">area is ready.</text>
<text x="68" y="1132" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">5 units · Held: Written</text>
<text x="68" y="1156" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">receiving approval missing</text>
<rect x="32" y="1192" width="326" height="48" rx="8" fill="#FFF1E5"/>
<text x="44" y="1220" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">2 lots selected · 25 units</text>
<text x="32" y="1272" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">Ready to release 2 lots.</text>
<text x="32" y="1328" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">☑ Packing list checked</text>
<rect x="32" y="1368" width="326" height="48" rx="8" fill="#805610"/><text x="195" y="1398" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">Release selected lots</text>
<text x="416" y="36" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#201B13">INDEPENDENT AUTHOR REFERENCE</text>
<text x="416" y="60" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#201B13">T1 · Ready to submit</text>
<text x="416" y="84" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">390 logical parent /358 child</text>
<text x="416" y="108" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Host viewport600; full content shown</text>
<text x="416" y="132" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">No component-owned scrolling</text>
<text x="416" y="156" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13"></text>
<text x="416" y="180" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Title22pt iOS /22sp Android,600</text>
<text x="416" y="204" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Body16pt iOS /16sp Android</text>
<text x="416" y="228" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Panel inset16, radius16pt/dp</text>
<text x="416" y="252" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Major section gap16pt/dp</text>
<text x="416" y="276" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Rows inset12, gap8, radius8pt/dp</text>
<text x="416" y="300" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Empty trailing paint gutter24pt/dp</text>
<text x="416" y="324" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Dashed guide is annotation only</text>
<text x="416" y="348" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Primary height48pt/dp, radius8</text>
<text x="416" y="372" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13"></text>
<text x="416" y="396" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Opaque source-backed palette:</text>
<text x="416" y="420" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FFFFFFFF panel/unselected row</text>
<text x="416" y="444" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FFFFDDB3 selected row</text>
<text x="416" y="468" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FFF3E6DA disabled option</text>
<text x="416" y="492" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FF805610 enabled primary</text>
<text x="416" y="516" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FFEDE0D4 disabled primary</text>
<text x="416" y="540" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FF201B13 text /#FFFFFFFF primary</text>
<text x="416" y="564" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13"></text>
<text x="416" y="588" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Wrap all copy; no ellipsis</text>
<text x="416" y="612" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">No overlap or horizontal clipping</text>
<text x="416" y="636" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Visible selected/checked marks</text>
<text x="416" y="660" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13"></text>
<text x="416" y="684" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Schematic wrapping and glyphs</text>
<text x="416" y="708" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">are not cross-renderer pixel targets.</text>
<text x="416" y="732" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Pixel regions are frozen separately</text>
<text x="416" y="756" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">in policy.json /PIXEL-SCOPE.md.</text>
</svg>
