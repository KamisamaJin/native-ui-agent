<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1584" viewBox="0 0 780 1584"><title>T5 Initial draft independent reference</title><rect width="780" height="1584" fill="#FFF8F4"/><rect x="16" y="16" width="358" height="1552" rx="16" fill="#FFFFFF"/>
<text x="32" y="44" font-family="system-ui,sans-serif" font-size="22" font-weight="600" fill="#201B13">Equipment return</text>
<text x="32" y="68" font-family="system-ui,sans-serif" font-size="22" font-weight="600" fill="#201B13">disposition</text>
<text x="32" y="104" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">RET-903 · Loaned accessible</text>
<text x="32" y="128" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">reading device and specialist</text>
<text x="32" y="152" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">charging accessories</text>
<text x="32" y="184" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">The loaned reading device was</text>
<text x="32" y="208" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">returned with an intermittent power</text>
<text x="32" y="232" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">complaint and a bag of specialist</text>
<text x="32" y="256" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">charging accessories. The receiving</text>
<text x="32" y="280" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">team must retain the full intake</text>
<text x="32" y="304" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">note, including the requirement to</text>
<text x="32" y="328" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">erase locally stored reading</text>
<text x="32" y="352" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">material, count the separately</text>
<text x="32" y="376" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">packaged cable adaptors, and</text>
<text x="32" y="400" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">document the next custodian before</text>
<text x="32" y="424" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">any onward routing occurs.</text>
<rect x="32" y="464" width="326" height="56" rx="8" fill="#FFFFFF" stroke="#817567"/><path d="M334 476 V508" stroke="#D3C4B4" stroke-dasharray="2 4"/>
<text x="44" y="492" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">○</text>
<text x="68" y="492" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">Accessories counted</text>
<rect x="32" y="528" width="326" height="56" rx="8" fill="#FFFFFF" stroke="#817567"/><path d="M334 540 V572" stroke="#D3C4B4" stroke-dasharray="2 4"/>
<text x="44" y="556" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">○</text>
<text x="68" y="556" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">Stored data erased</text>
<rect x="32" y="592" width="326" height="56" rx="8" fill="#FFFFFF" stroke="#817567"/><path d="M334 604 V636" stroke="#D3C4B4" stroke-dasharray="2 4"/>
<text x="44" y="620" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">○</text>
<text x="68" y="620" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">Power test passed</text>
<rect x="32" y="656" width="326" height="216" rx="8" fill="#F3E6DA" stroke="#817567"/><path d="M334 668 V860" stroke="#D3C4B4" stroke-dasharray="2 4"/>
<text x="44" y="684" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">○</text>
<text x="68" y="684" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">Return to stock</text>
<text x="68" y="708" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">Return to stock is</text>
<text x="68" y="732" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">conditional on a successful</text>
<text x="68" y="756" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">power test as well as the</text>
<text x="68" y="780" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">completed intake checks. A</text>
<text x="68" y="804" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">later change to the power</text>
<text x="68" y="828" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">result must invalidate this</text>
<text x="68" y="852" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">route immediately.</text>
<rect x="32" y="880" width="326" height="168" rx="8" fill="#F3E6DA" stroke="#817567"/><path d="M334 892 V1036" stroke="#D3C4B4" stroke-dasharray="2 4"/>
<text x="44" y="908" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">○</text>
<text x="68" y="908" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">Send for repair</text>
<text x="68" y="932" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">The specialist repair team</text>
<text x="68" y="956" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">can accept a device without</text>
<text x="68" y="980" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">a passed power test once the</text>
<text x="68" y="1004" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">accessories and data checks</text>
<text x="68" y="1028" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">are complete.</text>
<rect x="32" y="1056" width="326" height="168" rx="8" fill="#F3E6DA" stroke="#817567"/><path d="M334 1068 V1212" stroke="#D3C4B4" stroke-dasharray="2 4"/>
<text x="44" y="1084" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">○</text>
<text x="68" y="1084" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">Send for recycling</text>
<text x="68" y="1108" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">Approved material recovery</text>
<text x="68" y="1132" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">is available after the same</text>
<text x="68" y="1156" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">safe intake checks, with the</text>
<text x="68" y="1180" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">complete chain-of-custody</text>
<text x="68" y="1204" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">record attached.</text>
<rect x="32" y="1240" width="326" height="96" rx="8" fill="#FFF1E5"/>
<text x="44" y="1268" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">Accessories unchecked · Data</text>
<text x="44" y="1292" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">pending · Power unchecked ·</text>
<text x="44" y="1316" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">Route none</text>
<text x="32" y="1368" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">Complete accessories and data</text>
<text x="32" y="1392" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">checks.</text>
<text x="32" y="1448" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">☐ Chain of custody checked</text>
<rect x="32" y="1488" width="326" height="48" rx="8" fill="#EDE0D4"/><text x="195" y="1518" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">Record disposition</text>
<text x="416" y="36" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#201B13">INDEPENDENT AUTHOR REFERENCE</text>
<text x="416" y="60" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#201B13">T5 · Initial draft</text>
<text x="416" y="84" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">390 logical parent /358 child</text>
<text x="416" y="108" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Host viewport600; full content shown</text>
<text x="416" y="132" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">No component-owned scrolling</text>
<text x="416" y="156" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13"></text>
<text x="416" y="180" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Title22pt iOS /22sp Android,600</text>
<text x="416" y="204" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Body16pt iOS /16sp Android</text>
<text x="416" y="228" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Panel inset16, radius16pt/dp</text>
<text x="416" y="252" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Major section gap16pt/dp</text>
<text x="416" y="276" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Rows inset12, gap8, radius8pt/dp</text>
<text x="416" y="300" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Empty trailing paint gutter24pt/dp</text>
<text x="416" y="324" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Dashed guide is annotation only</text>
<text x="416" y="348" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Primary height48pt/dp, radius8</text>
<text x="416" y="372" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13"></text>
<text x="416" y="396" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Opaque source-backed palette:</text>
<text x="416" y="420" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FFFFFFFF panel/unselected row</text>
<text x="416" y="444" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FFFFDDB3 selected row</text>
<text x="416" y="468" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FFF3E6DA disabled option</text>
<text x="416" y="492" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FF805610 enabled primary</text>
<text x="416" y="516" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FFEDE0D4 disabled primary</text>
<text x="416" y="540" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FF201B13 text /#FFFFFFFF primary</text>
<text x="416" y="564" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13"></text>
<text x="416" y="588" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Wrap all copy; no ellipsis</text>
<text x="416" y="612" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">No overlap or horizontal clipping</text>
<text x="416" y="636" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Visible selected/checked marks</text>
<text x="416" y="660" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13"></text>
<text x="416" y="684" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Schematic wrapping and glyphs</text>
<text x="416" y="708" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">are not cross-renderer pixel targets.</text>
<text x="416" y="732" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Pixel regions are frozen separately</text>
<text x="416" y="756" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">in policy.json /PIXEL-SCOPE.md.</text>
</svg>
