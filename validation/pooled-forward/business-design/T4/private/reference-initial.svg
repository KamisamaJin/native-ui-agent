<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1536" viewBox="0 0 780 1536"><title>T4 Initial draft independent reference</title><rect width="780" height="1536" fill="#FFF8F4"/><rect x="16" y="16" width="358" height="1504" rx="16" fill="#FFFFFF"/>
<text x="32" y="44" font-family="system-ui,sans-serif" font-size="22" font-weight="600" fill="#201B13">Service outage notice</text>
<text x="32" y="68" font-family="system-ui,sans-serif" font-size="22" font-weight="600" fill="#201B13">composer</text>
<text x="32" y="104" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">INC-880 · Regional membership and</text>
<text x="32" y="128" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">assisted-registration service</text>
<text x="32" y="152" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">interruption</text>
<text x="32" y="184" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">Staff are supporting members who</text>
<text x="32" y="208" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">cannot complete assisted</text>
<text x="32" y="232" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">registration. The notice must</text>
<text x="32" y="256" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">retain the full explanation for</text>
<text x="32" y="280" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">people who saved a partially</text>
<text x="32" y="304" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">completed form, including the</text>
<text x="32" y="328" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">distinction between an unconfirmed</text>
<text x="32" y="352" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">request and a confirmed membership,</text>
<text x="32" y="376" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">and must not promise a recovery</text>
<text x="32" y="400" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">time that has not been provided by</text>
<text x="32" y="424" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">the incident owner.</text>
<rect x="32" y="464" width="326" height="216" rx="8" fill="#F3E6DA" stroke="#817567"/><path d="M334 476 V668" stroke="#D3C4B4" stroke-dasharray="2 4"/>
<text x="44" y="492" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">○</text>
<text x="68" y="492" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">Notify affected customers</text>
<text x="68" y="516" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">Customers with bookings</text>
<text x="68" y="540" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">awaiting confirmation need a</text>
<text x="68" y="564" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">direct explanation and a</text>
<text x="68" y="588" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">usable next step.</text>
<text x="68" y="612" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">124 recipients · Blocked:</text>
<text x="68" y="636" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">Direct customer wording has</text>
<text x="68" y="660" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">not been approved</text>
<rect x="32" y="688" width="326" height="240" rx="8" fill="#FFFFFF" stroke="#817567"/><path d="M334 700 V916" stroke="#D3C4B4" stroke-dasharray="2 4"/>
<text x="44" y="716" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">○</text>
<text x="68" y="716" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">Notify service staff</text>
<text x="68" y="740" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">Regional service staff,</text>
<text x="68" y="764" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">assisted-registration</text>
<text x="68" y="788" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">volunteers, and the named</text>
<text x="68" y="812" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">support coordinator need the</text>
<text x="68" y="836" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">full operational explanation</text>
<text x="68" y="860" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">for their next member</text>
<text x="68" y="884" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">conversation.</text>
<text x="68" y="908" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">47 recipients · Allowed</text>
<rect x="32" y="936" width="326" height="144" rx="8" fill="#F3E6DA" stroke="#817567"/><path d="M334 948 V1068" stroke="#D3C4B4" stroke-dasharray="2 4"/>
<text x="44" y="964" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">○</text>
<text x="68" y="964" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">Notify partner offices</text>
<text x="68" y="988" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">Partner offices have no</text>
<text x="68" y="1012" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">affected bookings in this</text>
<text x="68" y="1036" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">incident.</text>
<text x="68" y="1060" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">0 recipients · Allowed</text>
<rect x="32" y="1088" width="326" height="72" rx="8" fill="#F3E6DA" stroke="#817567"/><path d="M334 1100 V1148" stroke="#D3C4B4" stroke-dasharray="2 4"/>
<text x="44" y="1116" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">○</text>
<text x="68" y="1116" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">Include troubleshooting</text>
<text x="68" y="1140" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">steps</text>
<rect x="32" y="1168" width="326" height="56" rx="8" fill="#F3E6DA" stroke="#817567"/><path d="M334 1180 V1212" stroke="#D3C4B4" stroke-dasharray="2 4"/>
<text x="44" y="1196" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">○</text>
<text x="68" y="1196" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#4F4539">Preview notice</text>
<rect x="32" y="1240" width="326" height="72" rx="8" fill="#FFF1E5"/>
<text x="44" y="1268" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">No audience selected · Steps</text>
<text x="44" y="1292" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">omitted</text>
<text x="32" y="1344" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">Choose an allowed audience.</text>
<text x="32" y="1400" font-family="system-ui,sans-serif" font-size="16" font-weight="400" fill="#201B13">☐ Customer wording reviewed</text>
<rect x="32" y="1440" width="326" height="48" rx="8" fill="#EDE0D4"/><text x="195" y="1470" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="600" fill="#201B13">Publish notice</text>
<text x="416" y="36" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#201B13">INDEPENDENT AUTHOR REFERENCE</text>
<text x="416" y="60" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#201B13">T4 · Initial draft</text>
<text x="416" y="84" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">390 logical parent /358 child</text>
<text x="416" y="108" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Host viewport600; full content shown</text>
<text x="416" y="132" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">No component-owned scrolling</text>
<text x="416" y="156" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13"></text>
<text x="416" y="180" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Title22pt iOS /22sp Android,600</text>
<text x="416" y="204" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Body16pt iOS /16sp Android</text>
<text x="416" y="228" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Panel inset16, radius16pt/dp</text>
<text x="416" y="252" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Major section gap16pt/dp</text>
<text x="416" y="276" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Rows inset12, gap8, radius8pt/dp</text>
<text x="416" y="300" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Empty trailing paint gutter24pt/dp</text>
<text x="416" y="324" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Dashed guide is annotation only</text>
<text x="416" y="348" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Primary height48pt/dp, radius8</text>
<text x="416" y="372" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13"></text>
<text x="416" y="396" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Opaque source-backed palette:</text>
<text x="416" y="420" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FFFFFFFF panel/unselected row</text>
<text x="416" y="444" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FFFFDDB3 selected row</text>
<text x="416" y="468" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FFF3E6DA disabled option</text>
<text x="416" y="492" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FF805610 enabled primary</text>
<text x="416" y="516" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FFEDE0D4 disabled primary</text>
<text x="416" y="540" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">#FF201B13 text /#FFFFFFFF primary</text>
<text x="416" y="564" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13"></text>
<text x="416" y="588" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Wrap all copy; no ellipsis</text>
<text x="416" y="612" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">No overlap or horizontal clipping</text>
<text x="416" y="636" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Visible selected/checked marks</text>
<text x="416" y="660" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13"></text>
<text x="416" y="684" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Schematic wrapping and glyphs</text>
<text x="416" y="708" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">are not cross-renderer pixel targets.</text>
<text x="416" y="732" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">Pixel regions are frozen separately</text>
<text x="416" y="756" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#201B13">in policy.json /PIXEL-SCOPE.md.</text>
</svg>
