<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1564" viewBox="0 0 390 1564"><title>Independent authored design, not runtime output</title><rect width="390" height="1564" fill="#FFFFFF"/><rect x="16" y="24" width="358" height="1516" rx="12" fill="#F7F9FC"/><g font-family="system-ui, sans-serif"><text x="32" y="48" font-size="24" font-weight="600" fill="#15243B">Extended review:</text><text x="32" y="78" font-size="24" font-weight="600" fill="#15243B">Recruiting candidate</text><text x="32" y="108" font-size="24" font-weight="600" fill="#15243B">disposition for the</text><text x="32" y="138" font-size="24" font-weight="600" fill="#15243B">cross-functional welcome</text><text x="32" y="168" font-size="24" font-weight="600" fill="#15243B">and operations programme</text><text x="32" y="210" font-size="15" font-weight="400" fill="#526174">Record the recruiting team’s next step</text><text x="32" y="231" font-size="15" font-weight="400" fill="#526174">from completed assessment evidence and</text><text x="32" y="252" font-size="15" font-weight="400" fill="#526174">current reviewer capacity. Archiving</text><text x="32" y="273" font-size="15" font-weight="400" fill="#526174">requires a reason and is unavailable</text><text x="32" y="294" font-size="15" font-weight="400" fill="#526174">during a legal hold. Please read this</text><text x="32" y="315" font-size="15" font-weight="400" fill="#526174">caller-supplied narrative in full before</text><text x="32" y="336" font-size="15" font-weight="400" fill="#526174">recording the request. The facilities,</text><text x="32" y="357" font-size="15" font-weight="400" fill="#526174">people, and operations teams share this</text><text x="32" y="378" font-size="15" font-weight="400" fill="#526174">reusable panel, so the narrative may</text><text x="32" y="399" font-size="15" font-weight="400" fill="#526174">include several complete sentences and</text><text x="32" y="420" font-size="15" font-weight="400" fill="#526174">meaningful spaces. Every sentence must</text><text x="32" y="441" font-size="15" font-weight="400" fill="#526174">remain visible when the host scrolls; the</text><text x="32" y="462" font-size="15" font-weight="400" fill="#526174">panel must grow naturally instead of</text><text x="32" y="483" font-size="15" font-weight="400" fill="#526174">clipping, shrinking the type, or</text><text x="32" y="504" font-size="15" font-weight="400" fill="#526174">introducing an internal scroll region.</text><text x="32" y="537" font-size="15" font-weight="400" fill="#526174">An eligible archive reason does not</text><text x="32" y="558" font-size="15" font-weight="400" fill="#526174">override a legal hold.</text><text x="32" y="579" font-size="15" font-weight="400" fill="#526174"></text><text x="32" y="600" font-size="15" font-weight="400" fill="#526174">Changing disposition clears the next step</text><text x="32" y="621" font-size="15" font-weight="400" fill="#526174">or reason and evidence confirmation.</text><text x="32" y="642" font-size="15" font-weight="400" fill="#526174"></text><text x="32" y="663" font-size="15" font-weight="400" fill="#526174">Caller note: keep the accessibility labels</text><text x="32" y="684" font-size="15" font-weight="400" fill="#526174">on the actual controls. Long descriptive</text><text x="32" y="705" font-size="15" font-weight="400" fill="#526174">text belongs in the component content and</text><text x="32" y="726" font-size="15" font-weight="400" fill="#526174">wraps across as many lines as necessary.</text><text x="32" y="747" font-size="15" font-weight="400" fill="#526174">This explanatory note is business context</text><text x="32" y="768" font-size="15" font-weight="400" fill="#526174">for the operator.</text><text x="32" y="801" font-size="16" font-weight="600" fill="#15243B">Disposition</text><rect x="32" y="835" width="326" height="52" rx="8" fill="#E5F1FF" stroke="#2459A6"/><text x="48" y="866" font-size="15" fill="#526174">Continue review</text><text x="333" y="866" font-size="16" fill="#2459A6">✓</text><rect x="32" y="899" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="930" font-size="15" fill="#526174">Archive application</text><text x="32" y="963" font-size="16" font-weight="600" fill="#15243B">Detail</text><rect x="32" y="997" width="326" height="52" rx="8" fill="#E5F1FF" stroke="#2459A6"/><text x="48" y="1028" font-size="15" fill="#526174">Technical interview</text><text x="333" y="1028" font-size="16" fill="#2459A6">✓</text><rect x="32" y="1061" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="1092" font-size="15" fill="#526174">Recruiter screen</text><rect x="32" y="1125" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="1156" font-size="15" fill="#526174">Skills gap</text><rect x="32" y="1189" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="1220" font-size="15" fill="#526174">Role closed</text><text x="32" y="1253" font-size="16" font-weight="600" fill="#15243B">Disposition: Continue review. Detail:</text><text x="32" y="1275" font-size="16" font-weight="600" fill="#15243B">Technical interview. 82 portfolio points.</text><rect x="32" y="1309" width="326" height="52" rx="8" fill="#E5F1FF" stroke="#2459A6"/><text x="48" y="1340" font-size="15" fill="#526174">I confirm the evidence review</text><text x="333" y="1340" font-size="16" fill="#2459A6">✓</text><text x="32" y="1373" font-size="15" font-weight="400" fill="#526174">Recorded. Selections are locked for this</text><text x="32" y="1394" font-size="15" font-weight="400" fill="#526174">request.</text><text x="32" y="1427" font-size="15" font-weight="400" fill="#526174">Candidate disposition recorded.</text><rect x="32" y="1460" width="326" height="48" rx="8" fill="#D9E1EC"/><text x="195" y="1490" text-anchor="middle" font-size="16" font-weight="600" fill="#526174">Record candidate disposition</text></g></svg>
