<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1096" viewBox="0 0 390 1096"><title>Independent authored design, not runtime output</title><rect width="390" height="1096" fill="#FFFFFF"/><rect x="16" y="24" width="358" height="1048" rx="12" fill="#F7F9FC"/><g font-family="system-ui, sans-serif"><text x="32" y="48" font-size="24" font-weight="600" fill="#15243B">Recruiting candidate</text><text x="32" y="78" font-size="24" font-weight="600" fill="#15243B">disposition</text><text x="32" y="120" font-size="15" font-weight="400" fill="#526174">Record the recruiting team’s next step</text><text x="32" y="141" font-size="15" font-weight="400" fill="#526174">from completed assessment evidence and</text><text x="32" y="162" font-size="15" font-weight="400" fill="#526174">current reviewer capacity. Archiving</text><text x="32" y="183" font-size="15" font-weight="400" fill="#526174">requires a reason and is unavailable</text><text x="32" y="204" font-size="15" font-weight="400" fill="#526174">during a legal hold.</text><text x="32" y="237" font-size="15" font-weight="400" fill="#526174">An eligible archive reason does not</text><text x="32" y="258" font-size="15" font-weight="400" fill="#526174">override a legal hold.</text><text x="32" y="279" font-size="15" font-weight="400" fill="#526174"></text><text x="32" y="300" font-size="15" font-weight="400" fill="#526174">Changing disposition clears the next step</text><text x="32" y="321" font-size="15" font-weight="400" fill="#526174">or reason and evidence confirmation.</text><text x="32" y="354" font-size="16" font-weight="600" fill="#15243B">Disposition</text><rect x="32" y="388" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="419" font-size="15" fill="#15243B">Continue review</text><rect x="32" y="452" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="483" font-size="15" fill="#15243B">Archive application</text><text x="32" y="516" font-size="16" font-weight="600" fill="#15243B">Detail</text><rect x="32" y="550" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="581" font-size="15" fill="#526174">Technical interview</text><rect x="32" y="614" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="645" font-size="15" fill="#526174">Recruiter screen</text><rect x="32" y="678" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="709" font-size="15" fill="#526174">Skills gap</text><rect x="32" y="742" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="773" font-size="15" fill="#526174">Role closed</text><text x="32" y="806" font-size="16" font-weight="600" fill="#15243B">Disposition: Not chosen. Detail: Not</text><text x="32" y="828" font-size="16" font-weight="600" fill="#15243B">chosen. 82 portfolio points.</text><rect x="32" y="862" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="893" font-size="15" fill="#526174">I confirm the evidence review</text><text x="32" y="926" font-size="15" font-weight="400" fill="#526174">Choose a disposition.</text><text x="32" y="959" font-size="15" font-weight="400" fill="#526174">No request recorded.</text><rect x="32" y="992" width="326" height="48" rx="8" fill="#D9E1EC"/><text x="195" y="1022" text-anchor="middle" font-size="16" font-weight="600" fill="#526174">Record candidate disposition</text></g></svg>
