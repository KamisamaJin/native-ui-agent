<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1415" viewBox="0 0 390 1415"><title>Independent authored design, not runtime output</title><rect width="390" height="1415" fill="#FFFFFF"/><rect x="16" y="24" width="358" height="1367" rx="12" fill="#F7F9FC"/><g font-family="system-ui, sans-serif"><text x="32" y="48" font-size="24" font-weight="600" fill="#15243B">Extended review:</text><text x="32" y="78" font-size="24" font-weight="600" fill="#15243B">Training pathway</text><text x="32" y="108" font-size="24" font-weight="600" fill="#15243B">enrollment for the</text><text x="32" y="138" font-size="24" font-weight="600" fill="#15243B">cross-functional welcome</text><text x="32" y="168" font-size="24" font-weight="600" fill="#15243B">and operations programme</text><text x="32" y="210" font-size="15" font-weight="400" fill="#526174">Enroll a staff member in the next learning</text><text x="32" y="231" font-size="15" font-weight="400" fill="#526174">activity using already completed modules</text><text x="32" y="252" font-size="15" font-weight="400" fill="#526174">and published capacity. This panel does</text><text x="32" y="273" font-size="15" font-weight="400" fill="#526174">not book a date or load a course service.</text><text x="32" y="294" font-size="15" font-weight="400" fill="#526174">Please read this caller-supplied narrative</text><text x="32" y="315" font-size="15" font-weight="400" fill="#526174">in full before recording the request. The</text><text x="32" y="336" font-size="15" font-weight="400" fill="#526174">facilities, people, and operations teams</text><text x="32" y="357" font-size="15" font-weight="400" fill="#526174">share this reusable panel, so the</text><text x="32" y="378" font-size="15" font-weight="400" fill="#526174">narrative may include several complete</text><text x="32" y="399" font-size="15" font-weight="400" fill="#526174">sentences and meaningful spaces. Every</text><text x="32" y="420" font-size="15" font-weight="400" fill="#526174">sentence must remain visible when the host</text><text x="32" y="441" font-size="15" font-weight="400" fill="#526174">scrolls; the panel must grow naturally</text><text x="32" y="462" font-size="15" font-weight="400" fill="#526174">instead of clipping, shrinking the type,</text><text x="32" y="483" font-size="15" font-weight="400" fill="#526174">or introducing an internal scroll region.</text><text x="32" y="516" font-size="15" font-weight="400" fill="#526174">Foundation completion is a case-sensitive</text><text x="32" y="537" font-size="15" font-weight="400" fill="#526174">module identifier, not a display label.</text><text x="32" y="558" font-size="15" font-weight="400" fill="#526174"></text><text x="32" y="579" font-size="15" font-weight="400" fill="#526174">Changing a pathway clears the</text><text x="32" y="600" font-size="15" font-weight="400" fill="#526174">participation mode and commitment.</text><text x="32" y="621" font-size="15" font-weight="400" fill="#526174"></text><text x="32" y="642" font-size="15" font-weight="400" fill="#526174">Caller note: keep the accessibility labels</text><text x="32" y="663" font-size="15" font-weight="400" fill="#526174">on the actual controls. Long descriptive</text><text x="32" y="684" font-size="15" font-weight="400" fill="#526174">text belongs in the component content and</text><text x="32" y="705" font-size="15" font-weight="400" fill="#526174">wraps across as many lines as necessary.</text><text x="32" y="726" font-size="15" font-weight="400" fill="#526174">This explanatory note is business context</text><text x="32" y="747" font-size="15" font-weight="400" fill="#526174">for the operator.</text><text x="32" y="780" font-size="16" font-weight="600" fill="#15243B">Pathway</text><rect x="32" y="814" width="326" height="52" rx="8" fill="#E5F1FF" stroke="#2459A6"/><text x="48" y="845" font-size="15" fill="#526174">Guided cohort</text><text x="333" y="845" font-size="16" fill="#2459A6">✓</text><rect x="32" y="878" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="909" font-size="15" fill="#526174">Independent lab</text><text x="32" y="942" font-size="16" font-weight="600" fill="#15243B">Mode</text><rect x="32" y="976" width="326" height="52" rx="8" fill="#E5F1FF" stroke="#2459A6"/><text x="48" y="1007" font-size="15" fill="#526174">Certificate assessment</text><text x="333" y="1007" font-size="16" fill="#2459A6">✓</text><rect x="32" y="1040" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="1071" font-size="15" fill="#526174">Practice only</text><text x="32" y="1104" font-size="16" font-weight="600" fill="#15243B">Pathway: Guided cohort. Mode: Certificate</text><text x="32" y="1126" font-size="16" font-weight="600" fill="#15243B">assessment. 16 completed hours.</text><rect x="32" y="1160" width="326" height="52" rx="8" fill="#E5F1FF" stroke="#2459A6"/><text x="48" y="1191" font-size="15" fill="#526174">I confirm the learning commitment</text><text x="333" y="1191" font-size="16" fill="#2459A6">✓</text><text x="32" y="1224" font-size="15" font-weight="400" fill="#526174">Recorded. Selections are locked for this</text><text x="32" y="1245" font-size="15" font-weight="400" fill="#526174">request.</text><text x="32" y="1278" font-size="15" font-weight="400" fill="#526174">Training enrollment recorded.</text><rect x="32" y="1311" width="326" height="48" rx="8" fill="#D9E1EC"/><text x="195" y="1341" text-anchor="middle" font-size="16" font-weight="600" fill="#526174">Record training enrollment</text></g></svg>
