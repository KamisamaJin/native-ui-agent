<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1436" viewBox="0 0 390 1436"><title>Independent authored design, not runtime output</title><rect width="390" height="1436" fill="#FFFFFF"/><rect x="16" y="24" width="358" height="1388" rx="12" fill="#F7F9FC"/><g font-family="system-ui, sans-serif"><text x="32" y="48" font-size="24" font-weight="600" fill="#15243B">Extended review:</text><text x="32" y="78" font-size="24" font-weight="600" fill="#15243B">Catering package</text><text x="32" y="108" font-size="24" font-weight="600" fill="#15243B">configuration for the</text><text x="32" y="138" font-size="24" font-weight="600" fill="#15243B">cross-functional welcome</text><text x="32" y="168" font-size="24" font-weight="600" fill="#15243B">and operations programme</text><text x="32" y="210" font-size="15" font-weight="400" fill="#526174">Prepare a reusable order summary for the</text><text x="32" y="231" font-size="15" font-weight="400" fill="#526174">facilities desk. Capacity and dietary</text><text x="32" y="252" font-size="15" font-weight="400" fill="#526174">facts come from the caller; this component</text><text x="32" y="273" font-size="15" font-weight="400" fill="#526174">records the requested package and service.</text><text x="32" y="294" font-size="15" font-weight="400" fill="#526174">Please read this caller-supplied narrative</text><text x="32" y="315" font-size="15" font-weight="400" fill="#526174">in full before recording the request. The</text><text x="32" y="336" font-size="15" font-weight="400" fill="#526174">facilities, people, and operations teams</text><text x="32" y="357" font-size="15" font-weight="400" fill="#526174">share this reusable panel, so the</text><text x="32" y="378" font-size="15" font-weight="400" fill="#526174">narrative may include several complete</text><text x="32" y="399" font-size="15" font-weight="400" fill="#526174">sentences and meaningful spaces. Every</text><text x="32" y="420" font-size="15" font-weight="400" fill="#526174">sentence must remain visible when the host</text><text x="32" y="441" font-size="15" font-weight="400" fill="#526174">scrolls; the panel must grow naturally</text><text x="32" y="462" font-size="15" font-weight="400" fill="#526174">instead of clipping, shrinking the type,</text><text x="32" y="483" font-size="15" font-weight="400" fill="#526174">or introducing an internal scroll region.</text><text x="32" y="516" font-size="15" font-weight="400" fill="#526174">Quantities describe this event only. A</text><text x="32" y="537" font-size="15" font-weight="400" fill="#526174">reusable place setting counts as one</text><text x="32" y="558" font-size="15" font-weight="400" fill="#526174">complete set.</text><text x="32" y="579" font-size="15" font-weight="400" fill="#526174"></text><text x="32" y="600" font-size="15" font-weight="400" fill="#526174">Selecting another package clears the</text><text x="32" y="621" font-size="15" font-weight="400" fill="#526174">service and confirmation.</text><text x="32" y="642" font-size="15" font-weight="400" fill="#526174"></text><text x="32" y="663" font-size="15" font-weight="400" fill="#526174">Caller note: keep the accessibility labels</text><text x="32" y="684" font-size="15" font-weight="400" fill="#526174">on the actual controls. Long descriptive</text><text x="32" y="705" font-size="15" font-weight="400" fill="#526174">text belongs in the component content and</text><text x="32" y="726" font-size="15" font-weight="400" fill="#526174">wraps across as many lines as necessary.</text><text x="32" y="747" font-size="15" font-weight="400" fill="#526174">This explanatory note is business context</text><text x="32" y="768" font-size="15" font-weight="400" fill="#526174">for the operator.</text><text x="32" y="801" font-size="16" font-weight="600" fill="#15243B">Package</text><rect x="32" y="835" width="326" height="52" rx="8" fill="#E5F1FF" stroke="#2459A6"/><text x="48" y="866" font-size="15" fill="#526174">Buffet package</text><text x="333" y="866" font-size="16" fill="#2459A6">✓</text><rect x="32" y="899" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="930" font-size="15" fill="#526174">Boxed package</text><text x="32" y="963" font-size="16" font-weight="600" fill="#15243B">Service</text><rect x="32" y="997" width="326" height="52" rx="8" fill="#E5F1FF" stroke="#2459A6"/><text x="48" y="1028" font-size="15" fill="#526174">Reusable service</text><text x="333" y="1028" font-size="16" fill="#2459A6">✓</text><rect x="32" y="1061" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="1092" font-size="15" fill="#526174">Compostable service</text><text x="32" y="1125" font-size="16" font-weight="600" fill="#15243B">Package: Buffet package. Service: Reusable</text><text x="32" y="1147" font-size="16" font-weight="600" fill="#15243B">service. 12 guests.</text><rect x="32" y="1181" width="326" height="52" rx="8" fill="#E5F1FF" stroke="#2459A6"/><text x="48" y="1212" font-size="15" fill="#526174">I confirm the dietary counts</text><text x="333" y="1212" font-size="16" fill="#2459A6">✓</text><text x="32" y="1245" font-size="15" font-weight="400" fill="#526174">Recorded. Selections are locked for this</text><text x="32" y="1266" font-size="15" font-weight="400" fill="#526174">request.</text><text x="32" y="1299" font-size="15" font-weight="400" fill="#526174">Catering order recorded.</text><rect x="32" y="1332" width="326" height="48" rx="8" fill="#D9E1EC"/><text x="195" y="1362" text-anchor="middle" font-size="16" font-weight="600" fill="#526174">Record catering order</text></g></svg>
