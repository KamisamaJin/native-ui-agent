<svg xmlns="http://www.w3.org/2000/svg" width="390" height="968" viewBox="0 0 390 968"><title>Independent authored design, not runtime output</title><rect width="390" height="968" fill="#FFFFFF"/><rect x="16" y="24" width="358" height="920" rx="12" fill="#F7F9FC"/><g font-family="system-ui, sans-serif"><text x="32" y="48" font-size="24" font-weight="600" fill="#15243B">Catering package</text><text x="32" y="78" font-size="24" font-weight="600" fill="#15243B">configuration</text><text x="32" y="120" font-size="15" font-weight="400" fill="#526174">Prepare a reusable order summary for the</text><text x="32" y="141" font-size="15" font-weight="400" fill="#526174">facilities desk. Capacity and dietary</text><text x="32" y="162" font-size="15" font-weight="400" fill="#526174">facts come from the caller; this component</text><text x="32" y="183" font-size="15" font-weight="400" fill="#526174">records the requested package and service.</text><text x="32" y="216" font-size="15" font-weight="400" fill="#526174">Quantities describe this event only. A</text><text x="32" y="237" font-size="15" font-weight="400" fill="#526174">reusable place setting counts as one</text><text x="32" y="258" font-size="15" font-weight="400" fill="#526174">complete set.</text><text x="32" y="279" font-size="15" font-weight="400" fill="#526174"></text><text x="32" y="300" font-size="15" font-weight="400" fill="#526174">Selecting another package clears the</text><text x="32" y="321" font-size="15" font-weight="400" fill="#526174">service and confirmation.</text><text x="32" y="354" font-size="16" font-weight="600" fill="#15243B">Package</text><rect x="32" y="388" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="419" font-size="15" fill="#15243B">Buffet package</text><rect x="32" y="452" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="483" font-size="15" fill="#15243B">Boxed package</text><text x="32" y="516" font-size="16" font-weight="600" fill="#15243B">Service</text><rect x="32" y="550" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="581" font-size="15" fill="#526174">Reusable service</text><rect x="32" y="614" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="645" font-size="15" fill="#526174">Compostable service</text><text x="32" y="678" font-size="16" font-weight="600" fill="#15243B">Package: Not chosen. Service: Not chosen.</text><text x="32" y="700" font-size="16" font-weight="600" fill="#15243B">12 guests.</text><rect x="32" y="734" width="326" height="52" rx="8" fill="#FFFFFF" stroke="#B8C5D6"/><text x="48" y="765" font-size="15" fill="#526174">I confirm the dietary counts</text><text x="32" y="798" font-size="15" font-weight="400" fill="#526174">Choose a package.</text><text x="32" y="831" font-size="15" font-weight="400" fill="#526174">No request recorded.</text><rect x="32" y="864" width="326" height="48" rx="8" fill="#D9E1EC"/><text x="195" y="894" text-anchor="middle" font-size="16" font-weight="600" fill="#526174">Record catering order</text></g></svg>
