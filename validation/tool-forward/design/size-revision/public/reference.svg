<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1512" viewBox="0 0 760 1512">
<title>Return Resolution Card structural reference</title><desc>Reference at normal text size: a controlled return-decision card, selected replacement option, size L selected, unaccepted acknowledgement. Text and layout may reflow natively; this is not a pixel golden.</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;fill:#20282D}.small{font-size:12px;fill:#5D676C}.body{font-size:14px}.label{font-size:15px;font-weight:600}.accent{fill:#21645A}.note{font-size:14px;fill:#5D676C}</style></defs>
<rect width="760" height="1512" fill="#FAF8F5"/>
<text x="32" y="34" font-size="20" font-weight="600">Structural reference · normal native text</text>
<text x="32" y="58" class="note">Offered width 390 · card 358 · host inset 16 / top 24</text>
<g transform="translate(16,80)">
<rect x="0" y="0" width="358" height="1376" rx="20" fill="#FFF" stroke="#D7DDD9"/>
<text x="16" y="30" class="small">MERIDIAN GOODS</text>
<text x="16" y="62" font-size="24" font-weight="600">Choose how to return</text>
<rect x="16" y="76" width="150" height="26" rx="13" fill="#EAF5EF"/><text x="28" y="94" font-size="12" class="accent">Needs your decision</text>
<text x="16" y="124" class="small">Order MG-58102 · Item 1 of 1</text>
<text x="16" y="150" class="body"><tspan x="16">Choose the resolution that works for you.</tspan><tspan x="16" dy="20">We will send a prepaid return label after</tspan><tspan x="16" dy="20">you confirm.</tspan></text>
<rect x="16" y="210" width="52" height="52" rx="12" fill="#DDEFE9"/>
<path d="M29 225l13-6 13 6v23l-13 6-13-6z M29 225l13 6 13-6 M42 231v23 M36 222l13 6" fill="none" stroke="#21645A" stroke-width="1.8"/>
<text x="80" y="227" class="label">Everyday commuter jacket</text><text x="80" y="247" class="small">Moss · Size M · Quantity 1</text><text x="80" y="265" class="small">Paid $84.00</text>
<rect x="16" y="286" width="326" height="46" rx="10" fill="#FFF0D2"/><text x="28" y="314" font-size="13" fill="#775004">Return by November 12 · 4 days left</text>
<text x="16" y="358" class="body"><tspan x="16">Your jacket is eligible for a return. The</tspan><tspan x="16" dy="20">original item must be sent back within</tspan><tspan x="16" dy="20">the return window.</tspan></text>
<text x="16" y="434" font-size="17" font-weight="600">Your resolution</text>
<rect x="16" y="450" width="326" height="100" rx="12" fill="#FFF" stroke="#D7DDD9"/>
<circle cx="38" cy="474" r="9" fill="none" stroke="#5D676C"/>
<text x="58" y="476" class="label">Original payment</text><text x="314" y="476" text-anchor="end" class="label">$84.00</text>
<text x="58" y="503" class="body"><tspan x="58">Back to the card you used</tspan><tspan x="58" dy="20">at checkout.</tspan></text>
<rect x="16" y="562" width="326" height="120" rx="12" fill="#FFF" stroke="#D7DDD9"/>
<circle cx="38" cy="586" r="9" fill="none" stroke="#5D676C"/>
<text x="58" y="588" class="label">Store credit</text><text x="314" y="588" text-anchor="end" class="label">$92.40</text>
<rect x="58" y="601" width="92" height="23" rx="11" fill="#EAF5EF"/><text x="68" y="617" font-size="12" class="accent">+10% bonus</text>
<text x="58" y="648" class="body"><tspan x="58">A little extra for your next find.</tspan></text>
<rect x="16" y="694" width="326" height="122" rx="12" fill="#EAF5EF" stroke="#21645A" stroke-width="2"/>
<circle cx="38" cy="718" r="9" fill="none" stroke="#21645A" stroke-width="2"/><circle cx="38" cy="718" r="5" fill="#21645A"/>
<text x="58" y="720" class="label">A different size</text><text x="58" y="744" class="label">No extra cost</text>
<rect x="58" y="754" width="102" height="23" rx="11" fill="#DDEFE9"/><text x="68" y="770" font-size="12" class="accent">Free exchange</text>
<text x="58" y="799" font-size="13">Reserve while returning this one.</text>
<rect x="16" y="836" width="326" height="98" rx="10" fill="#F5F3EE"/><text x="28" y="860" class="label">Replacement details</text>
<text x="28" y="884" class="body"><tspan x="28">The replacement ships after the carrier</tspan><tspan x="28" dy="20">scans your return. Choose a size to reserve.</tspan></text>
<text x="16" y="964" class="label">Choose a replacement size</text>
<rect x="16" y="980" width="48" height="48" rx="10" fill="#FFF" stroke="#D7DDD9"/><text x="40" y="1010" text-anchor="middle" class="label">S</text>
<rect x="76" y="980" width="92" height="48" rx="10" fill="#F5F3EE" stroke="#D7DDD9"/><text x="122" y="1000" text-anchor="middle" class="small">M</text><text x="122" y="1017" text-anchor="middle" font-size="10" fill="#5D676C">Out of stock</text>
<rect x="180" y="980" width="48" height="48" rx="10" fill="#EAF5EF" stroke="#21645A" stroke-width="2"/><text x="204" y="1010" text-anchor="middle" class="label">L</text>
<rect x="240" y="980" width="48" height="48" rx="10" fill="#FFF" stroke="#D7DDD9"/><text x="264" y="1010" text-anchor="middle" class="label">XL</text>
<rect x="16" y="1054" width="20" height="20" rx="4" fill="#FFF" stroke="#5D676C"/>
<text x="48" y="1068" class="body"><tspan x="48">I will send back the original jacket</tspan><tspan x="48" dy="20">before the replacement is shipped.</tspan></text>
<rect x="16" y="1110" width="326" height="48" rx="10" fill="#F5F3EE"/><text x="28" y="1140" class="label">What happens after I confirm?</text><path d="M320 1128l6 6-6 6" fill="none" stroke="#5D676C" stroke-width="2"/>
<text x="16" y="1188" class="small">Original item</text><text x="342" y="1188" text-anchor="end" class="small">$84.00</text>
<text x="16" y="1212" class="small">Return shipping</text><text x="342" y="1212" text-anchor="end" class="small">Free</text>
<text x="16" y="1236" class="label">Replacement</text><text x="342" y="1236" text-anchor="end" class="label">$84.00</text>
<path d="M16 1250h326" stroke="#D7DDD9"/><text x="16" y="1276" font-size="18" font-weight="600">Due today</text><text x="342" y="1276" text-anchor="end" font-size="18" font-weight="600">$0.00</text>
<text x="16" y="1299" class="small">No charge to your original payment method.</text>
<text x="16" y="1324" font-size="13" fill="#5D676C">Accept the return terms to continue.</text>
</g>
<g transform="translate(406,100)"><text x="0" y="0" font-size="18" font-weight="600">Continue in natural flow</text>
<text x="0" y="30" class="note"><tspan x="0">The card continues below the first</tspan><tspan x="0" dy="21">600-unit viewport. The parent scrolls.</tspan></text>
<rect x="0" y="90" width="306" height="56" rx="12" fill="#DFE6E1"/><text x="153" y="124" text-anchor="middle" font-size="15" fill="#59655E">Request replacement</text>
<text x="153" y="184" text-anchor="middle" class="accent" font-size="15">Keep my purchase</text>
<text x="0" y="246" font-size="17" font-weight="600">State alternatives</text>
<rect x="0" y="268" width="306" height="134" rx="12" fill="#F5F3EE"/><circle cx="26" cy="297" r="9" fill="none" stroke="#21645A" stroke-width="3" stroke-dasharray="38 18"/><text x="46" y="302" class="label">Reserving your replacement</text><text x="16" y="333" class="body"><tspan x="16">Keep this screen open while we</tspan><tspan x="16" dy="20">confirm the return.</tspan></text><text x="16" y="385" class="small">Submitting: header + item + total remain</text>
<rect x="0" y="426" width="306" height="142" rx="12" fill="#EAF5EF"/><path d="M18 451l7 7 13-15" fill="none" stroke="#21645A" stroke-width="3"/><text x="48" y="455" class="label accent">Your return is ready</text><text x="16" y="486" class="body"><tspan x="16">The label and next steps have</tspan><tspan x="16" dy="20">been sent to your email.</tspan></text><text x="16" y="543" class="small">Return reference RT-58102</text>
<text x="0" y="613" class="note"><tspan x="0">Complete: a full-width Done button</tspan><tspan x="0" dy="21">follows the total and footnote.</tspan></text>
<text x="0" y="695" font-size="17" font-weight="600">Reflow rules</text>
<text x="0" y="725" class="note"><tspan x="0">• Native text sizes; unlimited wrapping.</tspan><tspan x="0" dy="24">• Stack amounts at narrow widths.</tspan><tspan x="0" dy="24">• Wrap size choices in caller order.</tspan><tspan x="0" dy="24">• Mirror leading/trailing regions in RTL.</tspan><tspan x="0" dy="24">• No internal vertical scrolling.</tspan><tspan x="0" dy="24">• Changes wait for caller echo.</tspan></text>
<text x="0" y="923" font-size="17" font-weight="600">Dark palette sample</text>
<rect x="0" y="944" width="306" height="122" rx="20" fill="#192224" stroke="#4A5A56"/><rect x="16" y="960" width="274" height="90" rx="12" fill="#223F36" stroke="#8ED6BD" stroke-width="2"/><circle cx="36" cy="982" r="8" fill="#8ED6BD"/><text x="54" y="988" font-size="15" font-weight="600" fill="#F2F6F3" style="fill:#F2F6F3">Selected resolution</text><text x="54" y="1018" font-size="13" style="fill:#B4C0BB">Readable detail and amount</text>
<text x="0" y="1120" class="note"><tspan x="0">Structural drawing only.</tspan><tspan x="0" dy="21">Use the brief's complete caller strings.</tspan><tspan x="0" dy="21">It is not a runtime screenshot or golden.</tspan></text>
</g></svg>